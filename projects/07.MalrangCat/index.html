<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MalrangCat</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; font-family: 'Georgia', serif; }
    canvas { display: block; }

    #overlay {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: radial-gradient(ellipse at center,
        rgba(14, 5, 28, 0.97) 0%,
        rgba(3, 0, 10, 0.99) 100%);
    }
    #overlay.hidden { display: none; }

    #overlay h1 {
      color: #ffd9a0;
      font-size: 2.8rem;
      letter-spacing: 0.26em;
      font-weight: 400;
      margin-bottom: 0.45rem;
      text-shadow: 0 0 50px rgba(255, 170, 60, 0.25);
    }
    #overlay p {
      color: rgba(255, 200, 140, 0.42);
      font-size: 0.84rem;
      letter-spacing: 0.2em;
      margin-bottom: 3.8rem;
      font-family: sans-serif;
    }
    #btnXR {
      padding: 1rem 3.8rem;
      font-size: 0.95rem;
      background: transparent;
      color: #ffd9a0;
      border: 1px solid rgba(255, 180, 80, 0.4);
      border-radius: 60px;
      cursor: pointer;
      letter-spacing: 0.2em;
      font-family: sans-serif;
      transition: background 0.28s, border-color 0.28s, box-shadow 0.28s;
    }
    #btnXR:hover {
      background: rgba(255, 180, 80, 0.07);
      border-color: rgba(255, 210, 130, 0.7);
      box-shadow: 0 0 28px rgba(255, 160, 50, 0.18);
    }
    #errMsg {
      color: #ff8877;
      margin-top: 1.6rem;
      font-size: 0.78rem;
      text-align: center;
      max-width: 290px;
      line-height: 1.75;
      font-family: sans-serif;
    }
    #dbg {
      position: fixed; top: 0.8rem; left: 0.8rem; z-index: 20;
      color: rgba(255, 200, 140, 0.75);
      font-family: monospace;
      font-size: 0.68rem;
      line-height: 1.85;
      pointer-events: none;
      text-shadow: 0 0 5px #000;
      display: none;
    }
    #hint {
      position: fixed; bottom: 2.2rem; left: 50%;
      transform: translateX(-50%); z-index: 20;
      color: rgba(255, 200, 140, 0.48);
      font-size: 0.74rem;
      letter-spacing: 0.12em;
      pointer-events: none;
      font-family: sans-serif;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div id="overlay">
    <h1>MalrangCat</h1>
    <p>말랑말랑한 고양이</p>
    <button id="btnXR">만져보기</button>
    <div id="errMsg"></div>
  </div>
  <div id="dbg"></div>
  <div id="hint"></div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.165.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.165.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { XRHandModelFactory } from 'three/addons/webxr/XRHandModelFactory.js';

    // ─────────────────────────────────────────────────────────────
    // FLAGS
    // ─────────────────────────────────────────────────────────────
    const DEBUG     = location.search.includes('debug');
    const MOUSEMODE = location.search.includes('mouse');

    const dbgEl  = document.getElementById('dbg');
    const hintEl = document.getElementById('hint');
    if (DEBUG) dbgEl.style.display = 'block';

    // ─────────────────────────────────────────────────────────────
    // TOKENS
    // ─────────────────────────────────────────────────────────────
    const SEG    = 64;           // 격자 해상도 (64×64 = 4,225 버텍스)
    const COLS   = SEG + 1;
    const VCOUNT = COLS * COLS;

    // cheesecat.png content bbox: 247-710 x (1024w), 426-1165 y (1536h) → aspect 0.627
    const CAT_ASPECT = 463 / 739;   // (710-247) / (1165-426) ≈ 0.626
    const CAT_W      = 0.96;        // 메시 가로 m (기존 0.32의 3배)
    const CAT_H      = CAT_W / CAT_ASPECT; // ≈ 1.53 m

    // UV crop: image 전체 중 고양이가 있는 영역만 쓰도록
    // (Cloudflare 서빙 시 텍스처는 전체 이미지, UV는 그대로 0~1)
    const T = {
      cat: {
        forward: 0.75,   // 3배 커진 만큼 살짝 멀리
        drop:    0.25,    // 큰 고양이 중심을 눈높이보다 아래로
        width:   CAT_W,
        height:  CAT_H,
      },
      sim: {
        cohesion:  0.045,  // ↓0.055: 더 느리고 끈적한 복원(레진젤 점성). damping은 유지=출렁임 보존
        neighborK: 0.072,
        damping:   0.88,
        maxVel:    0.10,   // 멀리 당길 때 버텍스가 손끝을 따라오도록 상향
        cohesionB: 0.10,   // 뒷면은 더 단단히 rest 유지 → "앞만 눌리고 뒤는 잠잠"
        kThick:    0.045,  // 두께(앞-뒤 간격) 스프링 → 볼륨 유지 / 봉합
      },
      grab: {
        capture:      0.08,  // 힘 절반: 접점 중심으로 좁게만 반응(과한 출렁임 완화)
        kGrab:        0.17,  // 손끝을 더 단단히 따라옴 → 쭉 늘어남
        releaseSpeed: 0.06,  // ↓ 보통 속도로 떼도 놓음(빠른 털기만 → 살짝만 들어도)
        breakDist:    0.22,  // ↓ ~22cm 당기면 손끝에서 똑 떨어짐(늘이다 자연 분리)
        regrabDelay:  18,
      },
      rigid: {
        grabPropK: 0.03,  // 몸통 이동 대폭 축소 → 손을 피하지 않고 제자리서 늘어남
        homeK:     0.025, // 미세 드리프트 안정화 (home이 따라오므로 스냅백 아님)
        damp:      0.9,
      },
      push: {
        offset:   0.02,   // 손바닥 중심 → 실제 접촉면(피부) 보정 (작게: 멀리서 닿은 척 방지)
        bandLo:  -0.04,   // 접촉 z 하한 (local m) — 표면 안쪽 살짝
        bandHi:   0.01,   // 접촉 z 상한 = BULGE + 이 값 (표면 바로 앞 1cm까지만 = 실제 닿아야 반응)
        reachXY:  0.0,    // (미사용) xy는 alphaAtLocal 실루엣 판정으로 대체
        stick:    0.85,   // 닿은 채 손바닥 변위를 따라가는 비율 (저항 없는 추종)
        palmR:    0.18,   // 표면 cling 반경 (local m) — 손에 감기는 범위
        kPalm:    0.07,   // cling 강성 (표면이 손바닥에 붙는 정도)
        minSpeed: 0.0015, // 이 속도 미만이면 이동 무시 (정지 손 떨림 방지)
      },
      hold: {
        pinchOn:  0.030,  // 엄지-검지 거리 이하 → 핀치 시작 (m)
        pinchOff: 0.055,  // 이 이상 벌어지면 핀치 해제 (히스테리시스)
        stick:    0.85,   // 집고 옮길 때 손을 따라가는 비율 (1=딱붙음)
        rotStick:   1.0,  // 양손 회전 추종 비율 (1=손 비튼 만큼 그대로)
        rotMaxStep: 0.35, // 프레임당 최대 회전(rad) — 추적 글리치 스핀 방지
      },
    };

    // 사전 계산
    const hStep    = T.cat.width  / SEG;
    const vStep    = T.cat.height / SEG;
    const diagStep = Math.sqrt(hStep * hStep + vStep * vStep);
    const capR     = T.grab.capture;          // 좌우 편의성
    const capR2    = capR * capR;
    const palmR2   = T.push.palmR * T.push.palmR;

    // 풍선 돔 설정
    const BULGE    = 0.06;                     // 최대 Z 돌출량 (m) — 풍선 두께 (3배 크기 비례)
    const TOUCH_Z  = BULGE + 0.06;            // 잡는 중(grab) 안전 경계용 Z 여유 (m)
    // ── 접촉 게이트: 손끝 z 절대값이 아니라 "그 XY의 실제 표면(balloonZ)과의 간격"으로 판정.
    //    가장자리(balloonZ≈0)에서 허공을 잡아도 표면이 움직이던 인과 오류를 제거.
    const TOUCH_GAP = 0.02;   // 획득 인정: 표면 앞 2cm 이내여야 "닿음" (손추적 지터 여유)
    const PALM_GAP  = 0.02;   // 손바닥 클링 인정 간격
    const PRESS_MAX = 0.05;   // 표면 뒤로 5cm까지 관통(눌러 들어감) 허용
    const balloonZ = new Float32Array(VCOUNT); // 버텍스별 rest Z 오프셋
    let   balloonBuilt = false;

    // ─────────────────────────────────────────────────────────────
    // SHADER — 텍스처 + 디퓨즈 + 프레넬 + 손끝 글로우
    // ─────────────────────────────────────────────────────────────
    const catVert = /* glsl */`
      uniform vec3  uFingers[2];
      uniform int   uFingerCount;
      varying vec2  vUv;
      varying vec3  vNormal;
      varying vec3  vView;
      varying float vGlow;

      void main() {
        vUv     = uv;
        vec4 wp = modelMatrix * vec4(position, 1.0);
        vNormal = normalize(mat3(modelMatrix) * normal);
        vView   = normalize(cameraPosition - wp.xyz);

        float g = 0.0;
        for (int k = 0; k < 2; k++) {
          if (k >= uFingerCount) break;
          float d = distance(wp.xyz, uFingers[k]);
          g = max(g, exp(-d * d * 260.0));
        }
        vGlow = g;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `;

    const catFrag = /* glsl */`
      uniform sampler2D uTex;
      uniform vec3      uLightDir;
      varying vec2      vUv;
      varying vec3      vNormal;
      varying vec3      vView;
      varying float     vGlow;

      void main() {
        vec4 tex = texture2D(uTex, vUv);
        if (tex.a < 0.5) discard;   // 깔끔한 윤곽 컷아웃 (depthWrite와 함께 뒷면 비침 차단)

        vec3 n = normalize(vNormal);
        vec3 v = normalize(vView);

        // 디퓨즈 라이팅
        float diff  = max(dot(n, normalize(uLightDir)), 0.0);
        float light = 0.50 + 0.50 * diff;

        // 프레넬 (젤리 가장자리 광택)
        float fresnel = pow(1.0 - max(dot(n, v), 0.0), 2.8);

        vec3 col  = tex.rgb * light;
        col += vec3(1.0, 0.97, 0.90) * fresnel * 0.16;
        col += vec3(1.0, 0.82, 0.42) * vGlow * 0.60;  // 황금빛 글로우

        gl_FragColor = vec4(col, tex.a);
      }
    `;

    // ─────────────────────────────────────────────────────────────
    // SCENE
    // ─────────────────────────────────────────────────────────────
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.xr.enabled = !MOUSEMODE;
    document.body.appendChild(renderer.domElement);

    const scene  = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

    if (MOUSEMODE) {
      camera.position.set(0, 0, 0.65);
      camera.lookAt(0, 0, 0);
    }

    scene.add(new THREE.AmbientLight(0xffffff, 0.6));
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.1);
    dirLight.position.set(1, 2, 2);
    scene.add(dirLight);

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ─────────────────────────────────────────────────────────────
    // CAT MESH — PlaneGeometry + ShaderMaterial
    // ─────────────────────────────────────────────────────────────
    const catGeo = new THREE.PlaneGeometry(T.cat.width, T.cat.height, SEG, SEG);

    // ── 알파 마스크 + 풍선 돔
    // alphaMask[i]=0 → 투명(고양이 윤곽 밖), 물리 정지
    // balloonZ[i]    → 고양이 내부 거리 필드 기반 Z 오프셋 (풍선 모양)
    const alphaMask = new Uint8Array(VCOUNT);
    alphaMask.fill(1);
    // rimMask[i]=1 → 실루엣 경계(8-이웃 중 투명 있음 or 격자 가장자리)의 불투명 정점.
    // 이 한 줄 두께 림을 뒷면→앞면 용접해 앞·뒤가 닫힌 곡면이 되게 함(솔기 봉합).
    const rimMask = new Uint8Array(VCOUNT);

    function buildAlphaMask(img) {
      const cvs = document.createElement('canvas');
      cvs.width = img.width; cvs.height = img.height;
      const ctx = cvs.getContext('2d');
      ctx.drawImage(img, 0, 0);
      const data = ctx.getImageData(0, 0, img.width, img.height).data;

      // ── 1. 알파 샘플링
      for (let row = 0; row <= SEG; row++) {
        for (let col = 0; col <= SEG; col++) {
          const i = row * COLS + col;
          const u = col / SEG;
          const v = 1 - row / SEG;
          const px = Math.min(Math.floor(u * img.width),  img.width  - 1);
          const py = Math.min(Math.floor((1-v) * img.height), img.height - 1);
          alphaMask[i] = data[(py * img.width + px) * 4 + 3] > 20 ? 1 : 0;
        }
      }

      // ── 1b. 림(경계) 마스크: 불투명이면서 8-이웃에 투명이 있거나 격자 가장자리
      //   경계 셀의 모든 불투명 코너를 포함하도록 8-이웃 사용 → 렌더 알파엣지가
      //   앞/뒤에서 정확히 일치(용접) → 틈 없음.
      for (let row = 0; row <= SEG; row++) {
        for (let col = 0; col <= SEG; col++) {
          const i = row * COLS + col;
          if (!alphaMask[i]) { rimMask[i] = 0; continue; }
          let rim = (col === 0 || col === SEG || row === 0 || row === SEG);
          for (let dr = -1; dr <= 1 && !rim; dr++)
            for (let dc = -1; dc <= 1 && !rim; dc++) {
              if (dr === 0 && dc === 0) continue;
              if (!alphaMask[(row + dr) * COLS + (col + dc)]) rim = true;
            }
          rimMask[i] = rim ? 1 : 0;
        }
      }

      // ── 2. 거리 필드 계산 (Manhattan) → 돔 높이
      // distField[i] = 투명 경계에서 몇 격자 떨어졌는지
      const dist = new Float32Array(VCOUNT);
      for (let i = 0; i < VCOUNT; i++) dist[i] = alphaMask[i] ? 999 : 0;

      // 전진 패스
      for (let r = 0; r <= SEG; r++) for (let c = 0; c <= SEG; c++) {
        const i = r * COLS + c;
        if (!alphaMask[i]) continue;
        let m = dist[i];
        if (c > 0)   m = Math.min(m, dist[i-1]    + 1);
        if (r > 0)   m = Math.min(m, dist[i-COLS] + 1);
        dist[i] = m;
      }
      // 후진 패스
      for (let r = SEG; r >= 0; r--) for (let c = SEG; c >= 0; c--) {
        const i = r * COLS + c;
        if (!alphaMask[i]) continue;
        let m = dist[i];
        if (c < SEG) m = Math.min(m, dist[i+1]    + 1);
        if (r < SEG) m = Math.min(m, dist[i+COLS] + 1);
        dist[i] = m;
      }

      // ── 3. 정규화 후 풍선 Z 계산
      // sin(t*PI/2) 커브: 가장자리=0, 중심=BULGE, 전환 부드러움
      const maxD = dist.reduce((m,v) => Math.max(m,v), 0) || 1;
      for (let i = 0; i < VCOUNT; i++) {
        if (!alphaMask[i]) { balloonZ[i] = 0; continue; }
        const t = dist[i] / maxD;                    // 0(가장자리) ~ 1(중심)
        balloonZ[i] = Math.sin(t * Math.PI * 0.5) * BULGE;
      }

      applyBalloon();
      balloonBuilt = true;
    }

    // 풍선 높이를 지오메트리 + rest 위치에 적용
    function applyBalloon() {
      for (let i = 0; i < VCOUNT; i++) {
        posArr[i*3+2]   =  balloonZ[i];           // 앞면 +Z 돔
        posArrB[i*3+2]  = -balloonZ[i];           // 뒷면 -Z 돔
        if (placed) {
          restArr[i*3+2]  =  balloonZ[i];
          restArrB[i*3+2] = -balloonZ[i];
        }
      }
      if (placed) computeRestLengths();           // rest 바뀌면 스프링 길이도 재계산
      catGeo.attributes.position.needsUpdate  = true;
      catGeoB.attributes.position.needsUpdate = true;
      catGeo.computeVertexNormals();
      catGeoB.computeVertexNormals();
    }

    const catImg = new Image();
    catImg.crossOrigin = 'anonymous';
    catImg.onload = () => buildAlphaMask(catImg);
    catImg.src = 'cheesecat.png';

    const catTex = new THREE.TextureLoader().load('cheesecat.png');
    catTex.colorSpace = THREE.SRGBColorSpace;

    const catMat = new THREE.ShaderMaterial({
      vertexShader:   catVert,
      fragmentShader: catFrag,
      transparent: true,
      side:        THREE.DoubleSide,
      depthWrite:  true,   // 앞 껍데기가 뒤 껍데기를 가리도록 (입체 인형)
      uniforms: {
        uTex:         { value: catTex },
        uFingers:     { value: [new THREE.Vector3(9999, 9999, 9999),
                                 new THREE.Vector3(9999, 9999, 9999)] },
        uFingerCount: { value: 0 },
        uLightDir:    { value: new THREE.Vector3(1, 2, 2).normalize() },
      },
    });

    const catMesh = new THREE.Mesh(catGeo, catMat);
    catMesh.visible = false;
    scene.add(catMesh);

    // ── 뒷면 껍데기: 독립 지오메트리(거울 공유 X)
    // 앞면 버퍼를 공유하지 않고 자기 물리를 가짐 → 앞을 만져도 뒤는 따로 거동.
    // 두께 스프링이 앞↔뒤를 묶어 닫힌 볼륨 유지(rim에선 rest≈0 → 봉합, 안 비침).
    const catGeoB = catGeo.clone();
    // 윈딩 반전 → 법선이 -Z(바깥쪽) 향하도록 (뒷면 라이팅 정상화)
    if (catGeoB.index) {
      const idx = catGeoB.index.array;
      for (let t = 0; t < idx.length; t += 3) { const tmp = idx[t]; idx[t] = idx[t+2]; idx[t+2] = tmp; }
      catGeoB.index.needsUpdate = true;
    }
    const catMeshBack = new THREE.Mesh(catGeoB, catMat);
    catMesh.add(catMeshBack);       // 자식 → catMesh 변형/가시성/핀치이동 따라감

    const CAT_COUNT = 7;
    const CAT_REVEAL_TOUCHES = [0, 3, 9, 16, 25, 36, 50];
    const CAT_SPACING = CAT_W * 0.56;
    const CAT_NOTE_PLAN = [
      { name: '솔', semitoneFromSol:  0 },
      { name: '파', semitoneFromSol: -2 },
      { name: '미', semitoneFromSol: -3 },
      { name: '레', semitoneFromSol: -5 },
      { name: '도', semitoneFromSol: -7 },
      { name: '라', semitoneFromSol:  2 },
      { name: '시', semitoneFromSol:  4 },
    ];
    const CAT_NOTE_RATES = CAT_NOTE_PLAN.map(note => Math.pow(2, note.semitoneFromSol / 12));

    const catMeshes = [catMesh];
    for (let i = 1; i < CAT_COUNT; i++) {
      const front = new THREE.Mesh(catGeo, catMat);
      const back = new THREE.Mesh(catGeoB, catMat);
      front.add(back);
      front.visible = false;
      front.userData.spawnScale = 1;
      scene.add(front);
      catMeshes.push(front);
    }

    const catLayoutCenter = new THREE.Vector3();
    const catLayoutRight = new THREE.Vector3(1, 0, 0);
    const catLayoutQuat = new THREE.Quaternion();
    const _catLayoutTarget = new THREE.Vector3();
    const _catTouchLocal = new THREE.Vector3();
    const grabMesh = [catMesh, catMesh];
    const palmMesh = [catMesh, catMesh];
    let touchCount = 0;
    let visibleCatCount = 1;

    // ─────────────────────────────────────────────────────────────
    // AUDIO — 터치 시 랜덤 야옹 + 쓰다듬는 동안 골골(purr). 공간 오디오로 고양이에서 남.
    //   AudioContext는 제스처(버튼 클릭/마우스다운) 때 resume — 자동재생 정책 회피.
    // ─────────────────────────────────────────────────────────────
    const listener = new THREE.AudioListener();
    camera.add(listener);                 // XR에서 camera matrixWorld가 머리 추적 → 리스너도 추적
    const audioLoader = new THREE.AudioLoader();

    const MEOW_FILE = 'cat-meow3.wav';
    let meowBuffer = null;
    audioLoader.load(MEOW_FILE, b => { meowBuffer = b; });

    const meowVoice = new THREE.PositionalAudio(listener);
    meowVoice.setRefDistance(0.6);
    meowVoice.setRolloffFactor(0.6);      // 완만한 거리 감쇠 (멀어도 들리게)
    catMesh.add(meowVoice);

    const purrVoice = new THREE.PositionalAudio(listener);
    purrVoice.setRefDistance(0.6);
    purrVoice.setRolloffFactor(0.6);
    purrVoice.setLoop(true);
    purrVoice.setVolume(0);
    catMesh.add(purrVoice);
    let purrBuffer = null;
    audioLoader.load('purring.wav', b => { purrBuffer = b; });

    let lastMeowAt  = -1e9;               // 야옹 쿨다운용
    let contactPrev = false;              // 접촉 상승엣지 감지용

    function resumeAudio() {
      const ctx = listener.context;
      if (ctx && ctx.state === 'suspended') ctx.resume();
    }

    function playMeow(nowS, sourceMesh = catMesh) {
      if (nowS - lastMeowAt < 0.45) return;          // 연타 방지
      if (!meowBuffer) return;
      const catIndex = Math.max(0, catMeshes.indexOf(sourceMesh));
      if (meowVoice.isPlaying) meowVoice.stop();
      sourceMesh.add(meowVoice);
      meowVoice.setBuffer(meowBuffer);
      meowVoice.setPlaybackRate(CAT_NOTE_RATES[catIndex] || 1);
      meowVoice.play();
      lastMeowAt = nowS;
    }

    function layoutCats(instant = false) {
      for (let i = 0; i < visibleCatCount; i++) {
        const offset = (i - (visibleCatCount - 1) * 0.5) * CAT_SPACING;
        const mesh = catMeshes[i];
        _catLayoutTarget.copy(catLayoutCenter).addScaledVector(catLayoutRight, offset);
        mesh.userData.layoutTarget = mesh.userData.layoutTarget || new THREE.Vector3();
        mesh.userData.layoutQuat = mesh.userData.layoutQuat || new THREE.Quaternion();
        mesh.userData.layoutTarget.copy(_catLayoutTarget);
        mesh.userData.layoutQuat.copy(catLayoutQuat);
        if (instant) {
          mesh.position.copy(_catLayoutTarget);
          mesh.quaternion.copy(catLayoutQuat);
          mesh.scale.setScalar(1);
          mesh.userData.spawnScale = 1;
        }
      }
    }

    function revealCatsForTouchCount() {
      let changed = false;
      for (let i = 1; i < CAT_COUNT; i++) {
        if (touchCount < CAT_REVEAL_TOUCHES[i] || catMeshes[i].visible) continue;
        const prev = catMeshes[i - 1];
        const mesh = catMeshes[i];
        mesh.position.copy(prev.position).addScaledVector(catLayoutRight, CAT_SPACING);
        mesh.quaternion.copy(catLayoutQuat);
        mesh.scale.setScalar(0.001);
        mesh.userData.spawnScale = 0.001;
        mesh.visible = true;
        visibleCatCount = Math.max(visibleCatCount, i + 1);
        changed = true;
      }
      if (changed) layoutCats(false);
    }

    function registerCatTouch() {
      touchCount += 1;
      revealCatsForTouchCount();
      if (touchCount < CAT_REVEAL_TOUCHES[CAT_COUNT - 1]) {
        const next = CAT_REVEAL_TOUCHES.find(v => v > touchCount);
        hintEl.textContent = next ? `터치 ${touchCount} / ${next}` : '';
      } else {
        hintEl.textContent = '';
      }
    }

    function updateCatLayoutMotion(contact) {
      if (contact) return;
      for (let i = 0; i < visibleCatCount; i++) {
        const mesh = catMeshes[i];
        if (!mesh.visible) continue;
        if (mesh.userData.spawnScale < 1) {
          mesh.userData.spawnScale += (1 - mesh.userData.spawnScale) * 0.14;
          if (mesh.userData.spawnScale > 0.995) mesh.userData.spawnScale = 1;
          mesh.scale.setScalar(mesh.userData.spawnScale);
        }
        if (mesh.userData.layoutTarget) mesh.position.lerp(mesh.userData.layoutTarget, 0.12);
        if (mesh.userData.layoutQuat) mesh.quaternion.slerp(mesh.userData.layoutQuat, 0.12);
      }
    }

    function resetCatLayout(basePos, baseQuat) {
      catLayoutCenter.copy(basePos);
      catLayoutQuat.copy(baseQuat);
      catLayoutRight.set(1, 0, 0).applyQuaternion(baseQuat).normalize();
      touchCount = 0;
      visibleCatCount = 1;
      for (let i = 0; i < CAT_COUNT; i++) {
        catMeshes[i].visible = i === 0;
        catMeshes[i].scale.setScalar(1);
        catMeshes[i].userData.spawnScale = 1;
      }
      layoutCats(true);
    }

    // ─────────────────────────────────────────────────────────────
    // PHYSICS BUFFERS (로컬 메시 공간)
    // ─────────────────────────────────────────────────────────────
    const posArr  = catGeo.attributes.position.array;  // 앞면 지오메트리 버퍼 직접 참조
    const restArr = new Float32Array(VCOUNT * 3);       // 초기(rest) 위치
    const velArr  = new Float32Array(VCOUNT * 3);       // 버텍스 속도
    const prevArr = new Float32Array(VCOUNT * 3);       // 직전 프레임 스냅샷 (Jacobi 적분용)

    // 뒷면 레이어 (독립 시뮬, 두께 스프링으로 앞면 따라 볼륨 유지)
    const posArrB  = catGeoB.attributes.position.array; // 뒷면 지오메트리 버퍼
    const restArrB = new Float32Array(VCOUNT * 3);
    const velArrB  = new Float32Array(VCOUNT * 3);
    const prevArrB = new Float32Array(VCOUNT * 3);

    // ── 스프링 rest 길이 (풍선 돔 포함 실제 거리)
    // 평면 hStep/vStep을 쓰면 돔 경사가 영구 긴장 → 손 안 대도 자가운동.
    // rest 위치(돔 포함)의 실제 이웃 거리로 잡아야 돔이 진짜 평형이 됨.
    const rlH  = new Float32Array(VCOUNT); // i ↔ i+1      (col < SEG)
    const rlV  = new Float32Array(VCOUNT); // i ↔ i+COLS   (row < SEG)
    const rlD1 = new Float32Array(VCOUNT); // i ↔ i+COLS+1 (down-right)
    const rlD2 = new Float32Array(VCOUNT); // i ↔ i+COLS-1 (down-left)

    function computeRestLengths() {
      for (let r = 0; r <= SEG; r++) for (let c = 0; c <= SEG; c++) {
        const i = r * COLS + c, i3 = i * 3;
        const rx = restArr[i3], ry = restArr[i3+1], rz = restArr[i3+2];
        if (c < SEG)             { const n=(i+1)*3;      rlH[i]  = Math.hypot(restArr[n]-rx, restArr[n+1]-ry, restArr[n+2]-rz); }
        if (r < SEG)             { const n=(i+COLS)*3;   rlV[i]  = Math.hypot(restArr[n]-rx, restArr[n+1]-ry, restArr[n+2]-rz); }
        if (r < SEG && c < SEG)  { const n=(i+COLS+1)*3; rlD1[i] = Math.hypot(restArr[n]-rx, restArr[n+1]-ry, restArr[n+2]-rz); }
        if (r < SEG && c > 0)    { const n=(i+COLS-1)*3; rlD2[i] = Math.hypot(restArr[n]-rx, restArr[n+1]-ry, restArr[n+2]-rz); }
      }
    }

    // ─────────────────────────────────────────────────────────────
    // FINGER STATE
    // ─────────────────────────────────────────────────────────────
    const fingers = [
      { pos: new THREE.Vector3(), has: false },
      { pos: new THREE.Vector3(), has: false },
    ];
    const fingerPrev     = [new THREE.Vector3(), new THREE.Vector3()];
    const fingerVel      = [new THREE.Vector3(), new THREE.Vector3()];
    const fingerSpeed    = [0, 0];
    const fingerLocalPos = [new THREE.Vector3(), new THREE.Vector3()];
    const fingerCanGrab  = [false, false]; // XR = true 항상; 마우스 = 클릭 시만

    // ── PALM STATE — 손바닥으로 슥슥 밀어 고양이 이동 + 손에 감기는 cling
    const palmPos      = [new THREE.Vector3(), new THREE.Vector3()];
    const palmPrev     = [new THREE.Vector3(), new THREE.Vector3()];
    const palmVel      = [new THREE.Vector3(), new THREE.Vector3()];
    const palmHas      = [false, false];
    const palmStick    = [false, false];                                   // 이번 프레임 접촉?
    const palmLocalPt  = [new THREE.Vector3(), new THREE.Vector3()];       // 접촉점(cat-local)
    const _palmC       = new THREE.Vector3(); // 보정된 접촉점(world)
    const _dir         = new THREE.Vector3(); // 손바닥→고양이 방향
    const _w           = new THREE.Vector3(); // 임시 (wrist)

    // ── PINCH-HOLD STATE — 핀치로 집어 고양이 전체를 들고 옮김
    const pinching   = [false, false];  // 엄지-검지 모음 상태
    const holdActive = [false, false];  // 고양이를 집어 든 상태(이동 추종)
    const _thumb     = new THREE.Vector3();

    // 마우스 모드: hover 글로우용 (physics와 분리)
    const shaderPos   = [new THREE.Vector3(9999,9999,9999), new THREE.Vector3(9999,9999,9999)];
    let   shaderCount = 0;

    // ─────────────────────────────────────────────────────────────
    // GRAB STATE
    // ─────────────────────────────────────────────────────────────
    const grabActive  = [false, false];
    // grabWeight[h][i] = 0~1 (단순 블리안 대신 거리 가중치)
    // 가운데 = 1, 반경 끝 = 0 → 점토 주룉 늘어나는 느낌
    const grabWeight  = [new Float32Array(VCOUNT), new Float32Array(VCOUNT)];
    const grabCenterL = [new THREE.Vector3(), new THREE.Vector3()];
    const regrabCool  = [0, 0];

    // ─────────────────────────────────────────────────────────────
    // MESH RIGID BODY — 메시 전체 이동 (cat이 손으로 밀리도록)
    // ─────────────────────────────────────────────────────────────
    const meshVel  = new THREE.Vector3();
    const meshHome = new THREE.Vector3(); // 배치 직후 원위치

    // ── 양손 핀치 회전용 temp
    const _hA     = new THREE.Vector3();
    const _hB     = new THREE.Vector3();
    const _cenNow = new THREE.Vector3();
    const _qSpin  = new THREE.Quaternion();
    const _yAxis  = new THREE.Vector3(0, 1, 0);
    let   spinning = false; // 디버그/관측용 — 이번 프레임 양손 회전 중?

    // ─────────────────────────────────────────────────────────────
    // HELPERS
    // ─────────────────────────────────────────────────────────────
    const _invMat  = new THREE.Matrix4();
    const _headPos = new THREE.Vector3();
    const _headFwd = new THREE.Vector3();
    const _spawn   = new THREE.Vector3();

    let placed = false, needsPlacement = false;

    // ─────────────────────────────────────────────────────────────
    // INIT PHYSICS — rest 위치 복사, 속도 초기화
    // ─────────────────────────────────────────────────────────────
    function initPhysics() {
      if (balloonBuilt) applyBalloon();
      restArr.set(posArr);
      restArrB.set(posArrB);
      computeRestLengths();   // 돔 포함 실제 rest 길이 (평형 보장)
      velArr.fill(0);
      velArrB.fill(0);
      grabActive[0] = grabActive[1] = false;
      grabWeight[0].fill(0); grabWeight[1].fill(0);
      regrabCool[0] = regrabCool[1] = 0;
      fingerCanGrab[0] = fingerCanGrab[1] = false;
      palmHas[0] = palmHas[1] = false;
      palmStick[0] = palmStick[1] = false;
      pinching[0] = pinching[1] = false;
      holdActive[0] = holdActive[1] = false;
      meshVel.set(0, 0, 0);
    }

    // ─────────────────────────────────────────────────────────────
    // PLACEMENT (XR) — 세션 첫 프레임에 눈높이 정면 배치
    // ─────────────────────────────────────────────────────────────
    function placeCat() {
      const xrCam = renderer.xr.getCamera();
      xrCam.getWorldPosition(_headPos);
      xrCam.getWorldDirection(_headFwd);
      _headFwd.y = 0;
      if (_headFwd.lengthSq() < 1e-6) _headFwd.set(0, 0, -1);
      _headFwd.normalize();

      _spawn.copy(_headPos).addScaledVector(_headFwd, T.cat.forward);
      _spawn.y = _headPos.y - T.cat.drop;

      catMesh.position.copy(_spawn);
      meshHome.copy(_spawn);   // 원위치 저장

      catMesh.quaternion.setFromUnitVectors(
        new THREE.Vector3(0, 0, 1),
        _headFwd.clone().negate()
      );
      resetCatLayout(_spawn, catMesh.quaternion);
      catMesh.updateWorldMatrix(false, false);
      catMesh.visible = true;
      initPhysics();
      placed = true;
    }

    // PLACEMENT (mouse) — 원점에 고양이, 카메라는 앞쪽
    function placeCatMouse() {
      catMesh.position.set(0, 0, 0);
      meshHome.set(0, 0, 0);   // 원위치 저장
      catMesh.quaternion.identity();
      resetCatLayout(catMesh.position, catMesh.quaternion);
      catMesh.updateWorldMatrix(false, false);
      catMesh.visible = true;
      document.getElementById('overlay').classList.add('hidden');
      hintEl.textContent = '클릭 & 드래그로 말랑하게 만져보세요 🐾';
      initPhysics();
      placed = true;
    }

    // ─────────────────────────────────────────────────────────────
    // HANDS  (scene에 추가해야 joint matrixWorld 갱신됨)
    // ─────────────────────────────────────────────────────────────
    const hands = MOUSEMODE ? [] : [renderer.xr.getHand(0), renderer.xr.getHand(1)];
    hands.forEach(h => scene.add(h));

    // ─────────────────────────────────────────────────────────────
    // HAND GLOVE — 실제 손 위 은은한 프레넬 림 (고양이와 같은 골든 톤)
    //   XRHandModelFactory 'mesh' = 관절 따라 변형되는 스킨드 손 메시(GLB 비동기 로드).
    //   머티리얼만 교체: 중앙 투명 + 가장자리만 발광(additive) → 얇은 빛 장갑.
    // ─────────────────────────────────────────────────────────────
    const gloveVert = /* glsl */`
      #include <common>
      #include <skinning_pars_vertex>
      varying vec3 vN;
      varying vec3 vV;
      void main() {
        #include <skinbase_vertex>
        #include <beginnormal_vertex>
        #include <skinnormal_vertex>
        #include <begin_vertex>
        #include <skinning_vertex>
        vec4 mv = modelViewMatrix * vec4(transformed, 1.0);
        vN = normalize(normalMatrix * objectNormal);
        vV = normalize(-mv.xyz);
        gl_Position = projectionMatrix * mv;
      }
    `;
    const gloveFrag = /* glsl */`
      uniform vec3  uColor;
      uniform float uIntensity;
      varying vec3  vN;
      varying vec3  vV;
      void main() {
        // 가장자리(grazing)일수록 1 → 중앙은 거의 0(투명)
        float fres = pow(1.0 - max(dot(normalize(vN), normalize(vV)), 0.0), 3.0);
        gl_FragColor = vec4(uColor * fres * uIntensity, fres);
      }
    `;
    function makeGloveMat() {
      return new THREE.ShaderMaterial({
        uniforms: {
          uColor:     { value: new THREE.Color(1.0, 0.82, 0.42) }, // 고양이 골든 글로우와 동일
          uIntensity: { value: 0.45 },                             // 은은하게 (↑밝게 / ↓더 연하게)
        },
        vertexShader:   gloveVert,
        fragmentShader: gloveFrag,
        transparent:    true,
        depthWrite:     false,
        blending:       THREE.AdditiveBlending,
        side:           THREE.DoubleSide,
      });
    }

    if (!MOUSEMODE) {
      const handFactory = new XRHandModelFactory();
      for (let h = 0; h < 2; h++) {
        hands[h].add(handFactory.createHandModel(hands[h], 'mesh'));
      }
    }

    // 손 GLB는 비동기 로드 → 등장한 SkinnedMesh의 머티리얼을 글러브로 교체(1회).
    const _gloveDone = new WeakSet();
    function skinGloves() {
      for (let h = 0; h < hands.length; h++) {
        hands[h].traverse((o) => {
          if (o.isSkinnedMesh && !_gloveDone.has(o)) {
            o.material      = makeGloveMat();
            o.frustumCulled = false; // 손 근접 시 컬링 방지
            _gloveDone.add(o);
          }
        });
      }
    }

    function readFingers() {
      for (let h = 0; h < 2; h++) {
        const tip    = hands[h]?.joints?.['index-finger-tip'];
        const wasHas = fingers[h].has;
        fingers[h].has = false;
        fingerSpeed[h] = 0;
        if (tip) {
          fingers[h].pos.setFromMatrixPosition(tip.matrixWorld);
          if (fingers[h].pos.lengthSq() >= 1e-8) { // 미갱신 joint(원점) 무시
            fingers[h].has = true;
            fingerCanGrab[h] = true;  // XR: 항상 잡기 가능
            if (wasHas) {
              fingerVel[h].subVectors(fingers[h].pos, fingerPrev[h]);
              fingerSpeed[h] = fingerVel[h].length();
            } else {
              fingerVel[h].set(0, 0, 0); // 추적 재획득 프레임 속도 스파이크 방지
            }
            fingerPrev[h].copy(fingers[h].pos);
          }
        }

        // ── 핀치 판정: 엄지끝-검지끝 거리 (히스테리시스)
        const thumb = hands[h]?.joints?.['thumb-tip'];
        if (thumb && fingers[h].has) {
          _thumb.setFromMatrixPosition(thumb.matrixWorld);
          if (_thumb.lengthSq() >= 1e-8) {
            const pd = _thumb.distanceTo(fingers[h].pos);
            pinching[h] = pinching[h] ? (pd < T.hold.pinchOff) : (pd < T.hold.pinchOn);
          } else pinching[h] = false;
        } else pinching[h] = false;

        // ── 손바닥 중심 = wrist + middle-finger-metacarpal 중점
        const wrist = hands[h]?.joints?.['wrist'];
        const meta  = hands[h]?.joints?.['middle-finger-metacarpal'];
        const wasPalm = palmHas[h];
        palmHas[h] = false;
        if (wrist && meta) {
          _w.setFromMatrixPosition(wrist.matrixWorld);
          palmPos[h].setFromMatrixPosition(meta.matrixWorld);
          if (_w.lengthSq() >= 1e-8 && palmPos[h].lengthSq() >= 1e-8) {
            palmPos[h].add(_w).multiplyScalar(0.5);
            palmHas[h] = true;
            if (wasPalm) palmVel[h].subVectors(palmPos[h], palmPrev[h]);
            else         palmVel[h].set(0, 0, 0); // 재획득 스파이크 방지
            palmPrev[h].copy(palmPos[h]);
          }
        }
      }
    }

    function findTouchMesh(worldPos, outLocal) {
      let bestMesh = null;
      let bestGap = Infinity;
      for (let i = 0; i < visibleCatCount; i++) {
        const mesh = catMeshes[i];
        if (!mesh.visible) continue;
        _invMat.copy(mesh.matrixWorld).invert();
        outLocal.copy(worldPos).applyMatrix4(_invMat);
        const surfZ = surfaceZAtLocal(outLocal);
        const gap = outLocal.z - surfZ;
        if (surfZ < 0 || gap > TOUCH_GAP || gap < -PRESS_MAX) continue;
        const absGap = Math.abs(gap);
        if (absGap < bestGap) {
          bestGap = absGap;
          bestMesh = mesh;
          _catTouchLocal.copy(outLocal);
        }
      }
      if (!bestMesh) return null;
      outLocal.copy(_catTouchLocal);
      _invMat.copy(bestMesh.matrixWorld).invert();
      return bestMesh;
    }

    function findPalmMesh(handIndex, outLocal) {
      let bestMesh = null;
      let bestGap = Infinity;
      for (let i = 0; i < visibleCatCount; i++) {
        const mesh = catMeshes[i];
        if (!mesh.visible) continue;
        _dir.copy(mesh.position).sub(palmPos[handIndex]);
        if (_dir.lengthSq() < 1e-8) continue;
        _dir.normalize();
        _palmC.copy(palmPos[handIndex]).addScaledVector(_dir, T.push.offset);
        _invMat.copy(mesh.matrixWorld).invert();
        outLocal.copy(_palmC).applyMatrix4(_invMat);
        const surfZ = surfaceZAtLocal(outLocal);
        const gapZ = outLocal.z - surfZ;
        if (surfZ < 0 || gapZ >= PALM_GAP || gapZ <= -PRESS_MAX) continue;
        const absGap = Math.abs(gapZ);
        if (absGap < bestGap) {
          bestGap = absGap;
          bestMesh = mesh;
          _catTouchLocal.copy(outLocal);
        }
      }
      if (!bestMesh) return null;
      outLocal.copy(_catTouchLocal);
      _invMat.copy(bestMesh.matrixWorld).invert();
      return bestMesh;
    }

    // ─────────────────────────────────────────────────────────────
    // GRAB UPDATE — 손별 잡기 획득/해제
    // ─────────────────────────────────────────────────────────────
    function updateGrab() {
      _invMat.copy(catMesh.matrixWorld).invert();

      for (let h = 0; h < 2; h++) {
        regrabCool[h] = Math.max(0, regrabCool[h] - 1);

        if (!fingers[h].has) {
          if (grabActive[h]) { grabActive[h] = false; grabWeight[h].fill(0); }
          fingerLocalPos[h].set(9999, 9999, 9999);
          continue;
        }

        // 손끝 → 실제로 닿은 고양이의 로컬 공간으로 변환
        if (!grabActive[h]) {
          const meshForHand = findTouchMesh(fingers[h].pos, fingerLocalPos[h]);
          if (!meshForHand) {
            fingerLocalPos[h].set(9999, 9999, 9999);
            continue;
          }
          grabMesh[h] = meshForHand;
        } else {
          _invMat.copy(grabMesh[h].matrixWorld).invert();
          fingerLocalPos[h].copy(fingers[h].pos).applyMatrix4(_invMat);
        }

        // ── 표면 간격 게이트 (획득 시): 손끝이 그 XY의 실제 풍선 표면(balloonZ)에
        //    거의 닿았을 때만 인터랙션 시작. 평면 z 슬랩이 아니라 표면 간격 기반이라
        //    가장자리(평평, z≈0)에서 허공을 잡아도 반응하던 인과 오류를 제거.
        if (!grabActive[h]) {
          const surfZ = surfaceZAtLocal(fingerLocalPos[h]);   // 윤곽 밖이면 -1
          const gap   = fingerLocalPos[h].z - surfZ;          // +면 표면 앞 허공, -면 관통
          if (surfZ < 0 || gap > TOUCH_GAP || gap < -PRESS_MAX) {
            fingerLocalPos[h].set(9999, 9999, 9999);
            continue;
          }
        } else {
          // ── 잡는 중: 표면을 z로 쭉 늘이는 동작을 죽이지 않도록 느슨한 안전 경계만.
          //    실제 해제는 아래 flick / breakDist(0.5)가 담당.
          if (fingerLocalPos[h].z < -PRESS_MAX || fingerLocalPos[h].z > TOUCH_Z + 0.4) {
            grabActive[h] = false; grabWeight[h].fill(0);
            fingerLocalPos[h].set(9999, 9999, 9999);
            continue;
          }
        }

        // ── 해제 조건 확인 (잡는 중일 때)
        if (grabActive[h]) {
          const flick  = fingerSpeed[h] > T.grab.releaseSpeed;
          const tooFar = fingerLocalPos[h].distanceTo(grabCenterL[h]) > T.grab.breakDist;
          if (flick || tooFar) {
            // 손 속도를 로컬 공간으로 변환 후 잡힌 버텍스에 전달 (날아가게)
            const e   = _invMat.elements;
            const wx  = fingerVel[h].x, wy = fingerVel[h].y, wz = fingerVel[h].z;
            const lvx = e[0]*wx + e[4]*wy + e[8]*wz;
            const lvy = e[1]*wx + e[5]*wy + e[9]*wz;
            const lvz = e[2]*wx + e[6]*wy + e[10]*wz;
            for (let i = 0; i < VCOUNT; i++) {
              const w = grabWeight[h][i];
              if (w < 0.001) continue;
              velArr[i*3]   += lvx * 0.45 * w;
              velArr[i*3+1] += lvy * 0.45 * w;
              velArr[i*3+2] += lvz * 0.45 * w;
            }
            grabActive[h] = false;
            grabWeight[h].fill(0);
            regrabCool[h] = T.grab.regrabDelay;
          }
          continue; // 잡는 중: 재획득 시도 안 함
        }

        // ── 잡기 획득 — capture 반경 안의 불투명 버텍스, 거리 가중치 계산
        if (fingerCanGrab[h] && regrabCool[h] === 0) {
          const fl = fingerLocalPos[h];
          let   wsum = 0;
          grabWeight[h].fill(0);
          grabCenterL[h].set(0, 0, 0);

          for (let i = 0; i < VCOUNT; i++) {
            if (!alphaMask[i]) continue;
            const dx = posArr[i*3]   - fl.x;
            const dy = posArr[i*3+1] - fl.y;
            const dz = posArr[i*3+2] - fl.z;
            const dsq = dx*dx + dy*dy + dz*dz;
            if (dsq < capR2) {
              // 중심=1, 가장자리=0 의 부드러운 낙하 (찰흙 느낌)
              const t = 1 - Math.sqrt(dsq) / capR;
              const w = t * t;   // ease-in falloff
              grabWeight[h][i] = w;
              grabCenterL[h].x += posArr[i*3]   * w;
              grabCenterL[h].y += posArr[i*3+1] * w;
              grabCenterL[h].z += posArr[i*3+2] * w;
              wsum += w;
            }
          }
          if (wsum > 0.01) {
            grabCenterL[h].divideScalar(wsum);
            grabActive[h] = true;
          }
        }
      }
    }

    // cat-local 점이 고양이 실루엣(알파) 안의 불투명 격자에 있는지.
    // 평면 bbox 대신 이걸 써서 윤곽 밖·모서리의 "안 닿았는데 반응(AT 필드)"을 막는다.
    function alphaAtLocal(lp) {
      const col = Math.round((lp.x / T.cat.width  + 0.5) * SEG);
      const row = Math.round((0.5 - lp.y / T.cat.height) * SEG);
      if (col < 0 || col > SEG || row < 0 || row > SEG) return false;
      return alphaMask[row * COLS + col] === 1;
    }

    // 손끝 XY 위치에서의 rest 표면 높이(앞면 +balloonZ). 윤곽 밖이면 -1.
    // 접촉 게이트가 "손끝 z 절대값"이 아니라 "표면과의 간격"을 보도록 하는 핵심.
    function surfaceZAtLocal(lp) {
      const col = Math.round((lp.x / T.cat.width  + 0.5) * SEG);
      const row = Math.round((0.5 - lp.y / T.cat.height) * SEG);
      if (col < 0 || col > SEG || row < 0 || row > SEG) return -1;
      const idx = row * COLS + col;
      if (alphaMask[idx] !== 1) return -1;
      return balloonZ[idx];
    }

    // ─────────────────────────────────────────────────────────────
    // PALM CONTACT — 손바닥 접촉 판정 (보정된 접촉면 기준)
    //   _invMat은 updateGrab에서 갱신됨(같은 프레임, catMesh 위치 변동 전)
    // ─────────────────────────────────────────────────────────────
    function updatePalm() {
      for (let h = 0; h < 2; h++) {
        // ── 핀치 홀드: 고양이를 잡은(grab) 채 핀치하면 들어 올림 → 이동 추종
        if (!pinching[h] || !fingers[h].has) holdActive[h] = false;
        else if (grabActive[h])              holdActive[h] = true;

        palmStick[h] = false;
        if (!palmHas[h]) continue;

        // 접촉점 → 실제로 닿은 고양이의 로컬 공간, 윤곽 안 + 표면 근처(z)일 때만 접촉
        const meshForPalm = findPalmMesh(h, palmLocalPt[h]);
        if (meshForPalm) {
          palmMesh[h] = meshForPalm;
          palmStick[h] = true;
        }
      }
    }

    // ─────────────────────────────────────────────────────────────
    // SIMULATION STEP — 버텍스 물리 적분
    //   cohesion: rest position spring (탄성 복원)
    //   neighbor: 8방향 스프링 (출렁임 파급, 구조 유지)
    //   finger:   push(dent) 또는 grab(pull) 힘
    // ─────────────────────────────────────────────────────────────
    function simStep() {
      const pos  = posArr;
      const prev = prevArr;
      const rest = restArr;
      const vel  = velArr;
      const kC   = T.sim.cohesion;
      const kN   = T.sim.neighborK;
      const dp   = T.sim.damping;
      const mv   = T.sim.maxVel;
      const mv2  = mv * mv;

      // 직전 프레임 위치를 스냅샷 → 모든 이웃 힘을 동일한 상태에서 읽음(Jacobi).
      // 제자리 갱신(Gauss-Seidel)은 격자를 훑는 순서 때문에 비대칭 힘 →
      // 자가 회전/표류(나선 버그)를 유발. 스냅샷으로 그 에너지 주입을 제거.
      prev.set(pos);

      for (let i = 0; i < VCOUNT; i++) {
        const i3 = i * 3;
        const px = prev[i3], py = prev[i3+1], pz = prev[i3+2];

        // ── cohesion: rest position으로 끌어당김
        let fx = (rest[i3]   - px) * kC;
        let fy = (rest[i3+1] - py) * kC;
        let fz = (rest[i3+2] - pz) * kC;

        const row = (i / COLS) | 0;
        const col = i % COLS;

        let ni3, dx, dy, dz, d, s;

        // ── 축방향 스프링 (rest 길이 = 돔 포함 실제 거리)
        if (col > 0) {
          ni3 = (i-1)*3;
          dx = prev[ni3]-px; dy = prev[ni3+1]-py; dz = prev[ni3+2]-pz;
          d  = Math.sqrt(dx*dx+dy*dy+dz*dz);
          if (d > 1e-8) { s=(d-rlH[i-1])/d*kN; fx+=dx*s; fy+=dy*s; fz+=dz*s; }
        }
        if (col < SEG) {
          ni3 = (i+1)*3;
          dx = prev[ni3]-px; dy = prev[ni3+1]-py; dz = prev[ni3+2]-pz;
          d  = Math.sqrt(dx*dx+dy*dy+dz*dz);
          if (d > 1e-8) { s=(d-rlH[i])/d*kN; fx+=dx*s; fy+=dy*s; fz+=dz*s; }
        }
        if (row > 0) {
          ni3 = (i-COLS)*3;
          dx = prev[ni3]-px; dy = prev[ni3+1]-py; dz = prev[ni3+2]-pz;
          d  = Math.sqrt(dx*dx+dy*dy+dz*dz);
          if (d > 1e-8) { s=(d-rlV[i-COLS])/d*kN; fx+=dx*s; fy+=dy*s; fz+=dz*s; }
        }
        if (row < SEG) {
          ni3 = (i+COLS)*3;
          dx = prev[ni3]-px; dy = prev[ni3+1]-py; dz = prev[ni3+2]-pz;
          d  = Math.sqrt(dx*dx+dy*dy+dz*dz);
          if (d > 1e-8) { s=(d-rlV[i])/d*kN; fx+=dx*s; fy+=dy*s; fz+=dz*s; }
        }

        // ── 대각선 스프링 (shear 방지, 젤리 구조감)
        if (col > 0 && row > 0) {
          ni3 = (i-COLS-1)*3;
          dx = prev[ni3]-px; dy = prev[ni3+1]-py; dz = prev[ni3+2]-pz;
          d  = Math.sqrt(dx*dx+dy*dy+dz*dz);
          if (d > 1e-8) { s=(d-rlD1[i-COLS-1])/d*kN; fx+=dx*s; fy+=dy*s; fz+=dz*s; }
        }
        if (col < SEG && row > 0) {
          ni3 = (i-COLS+1)*3;
          dx = prev[ni3]-px; dy = prev[ni3+1]-py; dz = prev[ni3+2]-pz;
          d  = Math.sqrt(dx*dx+dy*dy+dz*dz);
          if (d > 1e-8) { s=(d-rlD2[i-COLS+1])/d*kN; fx+=dx*s; fy+=dy*s; fz+=dz*s; }
        }
        if (col > 0 && row < SEG) {
          ni3 = (i+COLS-1)*3;
          dx = prev[ni3]-px; dy = prev[ni3+1]-py; dz = prev[ni3+2]-pz;
          d  = Math.sqrt(dx*dx+dy*dy+dz*dz);
          if (d > 1e-8) { s=(d-rlD2[i])/d*kN; fx+=dx*s; fy+=dy*s; fz+=dz*s; }
        }
        if (col < SEG && row < SEG) {
          ni3 = (i+COLS+1)*3;
          dx = prev[ni3]-px; dy = prev[ni3+1]-py; dz = prev[ni3+2]-pz;
          d  = Math.sqrt(dx*dx+dy*dy+dz*dz);
          if (d > 1e-8) { s=(d-rlD1[i])/d*kN; fx+=dx*s; fy+=dy*s; fz+=dz*s; }
        }

        // ── 투명 버텍스: 물리 동결 (윤곽 유지)
        if (!alphaMask[i]) {
          pos[i3]   = rest[i3];
          pos[i3+1] = rest[i3+1];
          pos[i3+2] = rest[i3+2];
          vel[i3] = vel[i3+1] = vel[i3+2] = 0;
          continue;
        }

        // ── 잡기 힘 — 가중치 기반 부드러운 당김 (찰흙 주욱 느낌)
        for (let h = 0; h < 2; h++) {
          if (!fingers[h].has) continue;
          const w = grabWeight[h][i];
          if (!grabActive[h] || w < 0.001) continue;
          const fl = fingerLocalPos[h];
          // 가중치로 스케일: 중심 버텍스는 강하게, 주변은 약하게 당김
          fx += (fl.x - px) * T.grab.kGrab * w;
          fy += (fl.y - py) * T.grab.kGrab * w;
          fz += (fl.z - pz) * T.grab.kGrab * w;
        }

        // ── 손바닥 cling — 닿은 주변 표면이 손바닥에 감기듯 끌림(쫀득)
        for (let h = 0; h < 2; h++) {
          if (!palmStick[h]) continue;
          const pl = palmLocalPt[h];
          const dpx = pl.x - px, dpy = pl.y - py, dpz = pl.z - pz;
          const d2  = dpx*dpx + dpy*dpy + dpz*dpz;
          if (d2 >= palmR2) continue;
          const w = (1 - Math.sqrt(d2) / T.push.palmR) * T.push.kPalm; // 중심↑ 가장자리0
          fx += dpx * w; fy += dpy * w; fz += dpz * w;
        }

        // ── 적분
        vel[i3]   = (vel[i3]   + fx) * dp;
        vel[i3+1] = (vel[i3+1] + fy) * dp;
        vel[i3+2] = (vel[i3+2] + fz) * dp;

        // 폭주 방지 클램프
        const vsq = vel[i3]*vel[i3]+vel[i3+1]*vel[i3+1]+vel[i3+2]*vel[i3+2];
        if (vsq > mv2) {
          const sc = mv / Math.sqrt(vsq);
          vel[i3]*=sc; vel[i3+1]*=sc; vel[i3+2]*=sc;
        }

        pos[i3]   += vel[i3];
        pos[i3+1] += vel[i3+1];
        pos[i3+2] += vel[i3+2];
      }

      catGeo.attributes.position.needsUpdate = true;
      catGeo.computeVertexNormals();
    }

    // ─────────────────────────────────────────────────────────────
    // SIMULATION STEP (뒷면) — 독립 시뮬, 손 힘 없음
    //   격자 스프링 + cohesion(더 단단) + 두께 스프링(앞면 따라 볼륨/봉합).
    //   두께는 "압축될 때만" 밀어냄 → 앞을 누르면 뒤가 볼록(잠잠하다가 볼륨 보존),
    //   앞을 당겨 늘일 땐 뒤가 끌려오지 않음.
    // ─────────────────────────────────────────────────────────────
    function simStepBack() {
      const pos   = posArrB;
      const prev  = prevArrB;
      const rest  = restArrB;
      const vel   = velArrB;
      const front = posArr;            // 두께 스프링용 (앞면 현재 z)
      const kC    = T.sim.cohesionB;
      const kN    = T.sim.neighborK;
      const dp    = T.sim.damping;
      const kT    = T.sim.kThick;
      const mv    = T.sim.maxVel;
      const mv2   = mv * mv;

      prev.set(pos);

      for (let i = 0; i < VCOUNT; i++) {
        const i3 = i * 3;
        const px = prev[i3], py = prev[i3+1], pz = prev[i3+2];

        let fx = (rest[i3]   - px) * kC;
        let fy = (rest[i3+1] - py) * kC;
        let fz = (rest[i3+2] - pz) * kC;

        const row = (i / COLS) | 0;
        const col = i % COLS;
        let ni3, dx, dy, dz, d, s;

        if (col > 0) {
          ni3 = (i-1)*3;
          dx = prev[ni3]-px; dy = prev[ni3+1]-py; dz = prev[ni3+2]-pz;
          d  = Math.sqrt(dx*dx+dy*dy+dz*dz);
          if (d > 1e-8) { s=(d-rlH[i-1])/d*kN; fx+=dx*s; fy+=dy*s; fz+=dz*s; }
        }
        if (col < SEG) {
          ni3 = (i+1)*3;
          dx = prev[ni3]-px; dy = prev[ni3+1]-py; dz = prev[ni3+2]-pz;
          d  = Math.sqrt(dx*dx+dy*dy+dz*dz);
          if (d > 1e-8) { s=(d-rlH[i])/d*kN; fx+=dx*s; fy+=dy*s; fz+=dz*s; }
        }
        if (row > 0) {
          ni3 = (i-COLS)*3;
          dx = prev[ni3]-px; dy = prev[ni3+1]-py; dz = prev[ni3+2]-pz;
          d  = Math.sqrt(dx*dx+dy*dy+dz*dz);
          if (d > 1e-8) { s=(d-rlV[i-COLS])/d*kN; fx+=dx*s; fy+=dy*s; fz+=dz*s; }
        }
        if (row < SEG) {
          ni3 = (i+COLS)*3;
          dx = prev[ni3]-px; dy = prev[ni3+1]-py; dz = prev[ni3+2]-pz;
          d  = Math.sqrt(dx*dx+dy*dy+dz*dz);
          if (d > 1e-8) { s=(d-rlV[i])/d*kN; fx+=dx*s; fy+=dy*s; fz+=dz*s; }
        }
        if (col > 0 && row > 0) {
          ni3 = (i-COLS-1)*3;
          dx = prev[ni3]-px; dy = prev[ni3+1]-py; dz = prev[ni3+2]-pz;
          d  = Math.sqrt(dx*dx+dy*dy+dz*dz);
          if (d > 1e-8) { s=(d-rlD1[i-COLS-1])/d*kN; fx+=dx*s; fy+=dy*s; fz+=dz*s; }
        }
        if (col < SEG && row > 0) {
          ni3 = (i-COLS+1)*3;
          dx = prev[ni3]-px; dy = prev[ni3+1]-py; dz = prev[ni3+2]-pz;
          d  = Math.sqrt(dx*dx+dy*dy+dz*dz);
          if (d > 1e-8) { s=(d-rlD2[i-COLS+1])/d*kN; fx+=dx*s; fy+=dy*s; fz+=dz*s; }
        }
        if (col > 0 && row < SEG) {
          ni3 = (i+COLS-1)*3;
          dx = prev[ni3]-px; dy = prev[ni3+1]-py; dz = prev[ni3+2]-pz;
          d  = Math.sqrt(dx*dx+dy*dy+dz*dz);
          if (d > 1e-8) { s=(d-rlD2[i])/d*kN; fx+=dx*s; fy+=dy*s; fz+=dz*s; }
        }
        if (col < SEG && row < SEG) {
          ni3 = (i+COLS+1)*3;
          dx = prev[ni3]-px; dy = prev[ni3+1]-py; dz = prev[ni3+2]-pz;
          d  = Math.sqrt(dx*dx+dy*dy+dz*dz);
          if (d > 1e-8) { s=(d-rlD1[i])/d*kN; fx+=dx*s; fy+=dy*s; fz+=dz*s; }
        }

        if (!alphaMask[i]) {
          pos[i3]   = rest[i3];
          pos[i3+1] = rest[i3+1];
          pos[i3+2] = rest[i3+2];
          vel[i3] = vel[i3+1] = vel[i3+2] = 0;
          continue;
        }

        // ── 두께 스프링 (압축될 때만): 앞-뒤 간격이 rest보다 좁아지면 뒤를 밀어냄
        const err = (front[i3+2] - pz) - 2 * balloonZ[i];   // 현재간격 - rest간격
        if (err < 0) fz += err * kT;                        // 음수 → 뒤를 -z로 (볼록)

        vel[i3]   = (vel[i3]   + fx) * dp;
        vel[i3+1] = (vel[i3+1] + fy) * dp;
        vel[i3+2] = (vel[i3+2] + fz) * dp;

        const vsq = vel[i3]*vel[i3]+vel[i3+1]*vel[i3+1]+vel[i3+2]*vel[i3+2];
        if (vsq > mv2) {
          const sc = mv / Math.sqrt(vsq);
          vel[i3]*=sc; vel[i3+1]*=sc; vel[i3+2]*=sc;
        }

        pos[i3]   += vel[i3];
        pos[i3+1] += vel[i3+1];
        pos[i3+2] += vel[i3+2];
      }

      // ── 솔기 봉합: 림 정점을 앞면 현재 위치에 용접.
      //   앞/뒤가 경계에서 정확히 같은 모서리를 공유 → 한 장의 닫힌 곡면.
      //   (뒷면 림은 앞면을 따르는 키네마틱 팔로워가 됨 — 더 안정적)
      for (let i = 0; i < VCOUNT; i++) {
        if (!rimMask[i]) continue;
        const i3 = i * 3;
        pos[i3]   = front[i3];
        pos[i3+1] = front[i3+1];
        pos[i3+2] = front[i3+2];
        vel[i3] = vel[i3+1] = vel[i3+2] = 0;
      }

      catGeoB.attributes.position.needsUpdate = true;
      catGeoB.computeVertexNormals();
    }

    // ─────────────────────────────────────────────────────────────
    // MESH RIGID UPDATE — 잡아당길 때 고양이 전체가 밀리고 복귀
    // ─────────────────────────────────────────────────────────────
    function updateMeshRigid() {
      // ── 몸통 변형(A축)은 오직 핀치-홀드에서만.
      //   · 한 손 핀치-홀드  → 위치 이동(추종)
      //   · 양손 핀치-홀드   → 두 손 중점 기준 Y축 회전 + 중점 이동 (현실 물건 비틀듯)
      //   holdActive = pinching && grabActive 라 허공·단순접촉으론 절대 안 움직인다.
      //   (제거된 입력: palmStick/단순 grab 몸통이동 + meshVel 글라이드 — "겉도는 느낌"의 원인)
      spinning = false;
      const bodyMesh = (holdActive[0] && grabMesh[0]) || (holdActive[1] && grabMesh[1]) || catMesh;
      const twoHand = holdActive[0] && holdActive[1] && fingers[0].has && fingers[1].has;

      if (twoHand) {
        spinning = true;
        _hA.copy(fingers[0].pos);   // A 현재
        _hB.copy(fingers[1].pos);   // B 현재
        // 직전 손끝 = 현재 - 이번 프레임 변위(fingerVel)
        const a0x = _hA.x - fingerVel[0].x, a0y = _hA.y - fingerVel[0].y, a0z = _hA.z - fingerVel[0].z;
        const b0x = _hB.x - fingerVel[1].x, b0y = _hB.y - fingerVel[1].y, b0z = _hB.z - fingerVel[1].z;

        // ── 중점 이동(translation): 두 손이 같은 방향으로 움직이면 따라 이동
        _cenNow.addVectors(_hA, _hB).multiplyScalar(0.5);
        bodyMesh.position.x += _cenNow.x - (a0x + b0x) * 0.5;
        bodyMesh.position.y += _cenNow.y - (a0y + b0y) * 0.5;
        bodyMesh.position.z += _cenNow.z - (a0z + b0z) * 0.5;

        // ── XZ(수평) 평면 두 손 벡터 각도 변화 → Y축 회전 (위아래 떨림 무시)
        let dAng = Math.atan2(_hB.z - _hA.z, _hB.x - _hA.x) -
                   Math.atan2(b0z - a0z, b0x - a0x);
        if (dAng >  Math.PI) dAng -= 2 * Math.PI;
        else if (dAng < -Math.PI) dAng += 2 * Math.PI;
        // 추적 글리치 스핀 방지 클램프 + 추종 비율
        const maxs = T.hold.rotMaxStep;
        if (dAng >  maxs) dAng =  maxs;
        else if (dAng < -maxs) dAng = -maxs;
        dAng *= T.hold.rotStick;

        if (dAng !== 0) {
          // atan2(z,x) 각도를 +dAng 따라가려면 월드 +Y축으로 θ=-dAng 회전
          const th = -dAng, cs = Math.cos(th), sn = Math.sin(th);
          // 중점 피벗 기준 position 회전 (월드 +Y)
          const px = bodyMesh.position.x - _cenNow.x;
          const pz = bodyMesh.position.z - _cenNow.z;
          bodyMesh.position.x = _cenNow.x + px * cs + pz * sn;
          bodyMesh.position.z = _cenNow.z - px * sn + pz * cs;
          // 본체 방향 회전
          _qSpin.setFromAxisAngle(_yAxis, th);
          bodyMesh.quaternion.premultiply(_qSpin);
        }
        return;
      }

      // ── 한 손 핀치-홀드: 집어 든 손만 저항감 있게 위치 추종
      for (let h = 0; h < 2; h++) {
        if (!holdActive[h] || !fingers[h].has) continue;
        (grabMesh[h] || catMesh).position.addScaledVector(fingerVel[h], T.hold.stick);
      }
    }

    // ─────────────────────────────────────────────────────────────
    // MAIN UPDATE — 매 프레임 호출
    // ─────────────────────────────────────────────────────────────
    function updateCat() {
      if (!MOUSEMODE) readFingers();

      for (let i = 0; i < visibleCatCount; i++) catMeshes[i].updateWorldMatrix(false, false);
      updateGrab();
      updatePalm();        // ← 손바닥 접촉 판정 (simStep cling + 이동에 사용)
      simStep();           // 앞면(손 힘의 주인)
      simStepBack();       // 뒷면(독립 팔로워 + 두께 볼륨)
      updateMeshRigid();   // ← 고양이 전체 이동 물리

      // 셰이더 손끝 글로우 업데이트
      if (MOUSEMODE) {
        catMat.uniforms.uFingers.value[0].copy(shaderPos[0]);
        catMat.uniforms.uFingerCount.value = shaderCount;
      } else {
        let fc = 0;
        for (let h = 0; h < 2; h++) {
          if (fingers[h].has) catMat.uniforms.uFingers.value[fc++].copy(fingers[h].pos);
        }
        catMat.uniforms.uFingerCount.value = fc;
      }

      // ── 사운드: 접촉 시작 엣지 → 랜덤 야옹 / 지속 접촉 → 골골(purr) 페이드
      const contact = grabActive[0] || grabActive[1] || palmStick[0] || palmStick[1] ||
                      holdActive[0] || holdActive[1];
      const nowS = performance.now() * 0.001;
      if (contact && !contactPrev) {
        const soundMesh =
          (grabActive[0] && grabMesh[0]) ||
          (grabActive[1] && grabMesh[1]) ||
          (palmStick[0] && palmMesh[0]) ||
          (palmStick[1] && palmMesh[1]) ||
          catMesh;
        registerCatTouch();
        playMeow(nowS, soundMesh);   // 닿는 순간 한 번
      }
      contactPrev = contact;
      updateCatLayoutMotion(contact);

      if (purrBuffer) {
        const target = contact ? 0.5 : 0;            // 쓰다듬는 동안만 골골
        if (target > 0 && !purrVoice.isPlaying) { purrVoice.setBuffer(purrBuffer); purrVoice.play(); }
        const v  = purrVoice.getVolume();
        const nv = v + (target - v) * 0.05;          // 부드러운 페이드 인/아웃
        purrVoice.setVolume(nv);
        if (target === 0 && nv < 0.01 && purrVoice.isPlaying) purrVoice.stop();
      }

      if (DEBUG) {
        dbgEl.textContent =
          `mode: ${MOUSEMODE ? 'mouse' : 'XR'}  spin:${spinning ? '🔄' : '○'}\n` +
          `cats: ${visibleCatCount}/${CAT_COUNT} touches:${touchCount}\n` +
          `L: ${fingers[0].has ? '✓' : '✗'} grab:${grabActive[0] ? '●' : '○'} hold:${holdActive[0] ? '✊' : '○'} palm:${palmStick[0] ? '✋' : '○'}\n` +
          `R: ${fingers[1].has ? '✓' : '✗'} grab:${grabActive[1] ? '●' : '○'} hold:${holdActive[1] ? '✊' : '○'} palm:${palmStick[1] ? '✋' : '○'}`;
      }
    }

    // ─────────────────────────────────────────────────────────────
    // MOUSE MODE INPUT  (?mouse URL 파라미터로 활성화)
    // ─────────────────────────────────────────────────────────────
    if (MOUSEMODE) {
      const raycaster = new THREE.Raycaster();
      const mouseNDC  = new THREE.Vector2();
      const hitPlane  = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
      const hitPoint  = new THREE.Vector3();
      let   isDown    = false;

      function trackMouse(clientX, clientY) {
        mouseNDC.x =  (clientX / window.innerWidth)  * 2 - 1;
        mouseNDC.y = -(clientY / window.innerHeight) * 2 + 1;
        raycaster.setFromCamera(mouseNDC, camera);
        return raycaster.ray.intersectPlane(hitPlane, hitPoint);
      }

      window.addEventListener('mousemove', e => {
        if (!placed) return;
        if (!trackMouse(e.clientX, e.clientY)) { fingers[0].has = false; return; }

        const prevPos = fingerPrev[0].clone();
        shaderPos[0].copy(hitPoint);
        shaderCount = 1;

        if (isDown) {
          fingers[0].pos.copy(hitPoint);
          fingers[0].has = true;
          fingerCanGrab[0] = true;
          fingerVel[0].subVectors(hitPoint, prevPos);
          fingerSpeed[0] = fingerVel[0].length();
        } else {
          fingers[0].has = false;
          fingerCanGrab[0] = false;
          fingerVel[0].set(0, 0, 0);
          fingerSpeed[0] = 0;
        }
        fingerPrev[0].copy(hitPoint);
      });

      window.addEventListener('mousedown', e => {
        if (!placed) return;
        resumeAudio();
        isDown = true;
        if (!trackMouse(e.clientX, e.clientY)) return;
        fingers[0].pos.copy(hitPoint);
        fingers[0].has = true;
        fingerCanGrab[0] = true;
        fingerPrev[0].copy(hitPoint);
        fingerVel[0].set(0, 0, 0);
        fingerSpeed[0] = 0;
      });

      window.addEventListener('mouseup', () => {
        isDown = false;
        fingers[0].has = false;
        fingerCanGrab[0] = false;
        fingerSpeed[0] = 0;
        // 잡기 해제 시 현재 속도를 버텍스에 전달
        if (grabActive[0]) {
          (grabMesh[0] || catMesh).updateWorldMatrix(false, false);
          _invMat.copy((grabMesh[0] || catMesh).matrixWorld).invert();
          const e   = _invMat.elements;
          const wx  = fingerVel[0].x, wy = fingerVel[0].y, wz = fingerVel[0].z;
          const lvx = e[0]*wx + e[4]*wy + e[8]*wz;
          const lvy = e[1]*wx + e[5]*wy + e[9]*wz;
          const lvz = e[2]*wx + e[6]*wy + e[10]*wz;
          for (let i = 0; i < VCOUNT; i++) {
            const w = grabWeight[0][i];
            if (w < 0.001) continue;
            velArr[i*3]   += lvx * 0.42 * w;
            velArr[i*3+1] += lvy * 0.42 * w;
            velArr[i*3+2] += lvz * 0.42 * w;
          }
          grabActive[0] = false;
          grabWeight[0].fill(0);
          regrabCool[0] = T.grab.regrabDelay;
        }
      });

      window.addEventListener('mouseleave', () => {
        shaderCount = 0;
        fingers[0].has = false;
        if (grabActive[0]) { grabActive[0] = false; grabWeight[0].fill(0); }
      });

      // 터치 지원
      window.addEventListener('touchmove', e => {
        e.preventDefault();
        if (!placed) return;
        const t = e.touches[0];
        if (!trackMouse(t.clientX, t.clientY)) return;
        const prevPos = fingerPrev[0].clone();
        shaderPos[0].copy(hitPoint);
        shaderCount = 1;
        fingers[0].pos.copy(hitPoint);
        fingers[0].has = true;
        fingerCanGrab[0] = true;
        fingerVel[0].subVectors(hitPoint, prevPos);
        fingerSpeed[0] = fingerVel[0].length();
        fingerPrev[0].copy(hitPoint);
      }, { passive: false });

      window.addEventListener('touchstart', e => {
        if (!placed) return;
        resumeAudio();
        isDown = true;
        const t = e.touches[0];
        if (!trackMouse(t.clientX, t.clientY)) return;
        fingers[0].pos.copy(hitPoint);
        fingers[0].has = true;
        fingerCanGrab[0] = true;
        fingerPrev[0].copy(hitPoint);
        fingerVel[0].set(0, 0, 0);
        fingerSpeed[0] = 0;
      });

      window.addEventListener('touchend', () => {
        isDown = false;
        fingers[0].has = false;
        fingerCanGrab[0] = false;
        shaderCount = 0;
        if (grabActive[0]) { grabActive[0] = false; grabWeight[0].fill(0); }
      });
    }

    // ─────────────────────────────────────────────────────────────
    // XR SETUP
    // ─────────────────────────────────────────────────────────────
    const overlay = document.getElementById('overlay');
    const btnXR   = document.getElementById('btnXR');
    const errMsg  = document.getElementById('errMsg');

    if (!MOUSEMODE) {
      btnXR.addEventListener('click', async () => {
        resumeAudio();   // 제스처 시점에 오디오 컨텍스트 활성화 (XR 진입 후 야옹 가능)
        if (!navigator.xr) {
          errMsg.textContent = 'WebXR를 지원하지 않는 기기입니다.';
          return;
        }
        const ok = await navigator.xr.isSessionSupported('immersive-ar').catch(() => false);
        if (!ok) {
          errMsg.textContent = 'immersive-ar 세션을 지원하지 않습니다.';
          return;
        }
        try {
          const session = await navigator.xr.requestSession('immersive-ar', {
            requiredFeatures: ['local-floor'],
            optionalFeatures: ['hand-tracking'],  // 선택사항: 지원 안 해도 세션 실패 안 함
          });
          renderer.xr.setSession(session);
          needsPlacement = true;
          overlay.classList.add('hidden');
        } catch (e) {
          errMsg.textContent = `세션 시작 실패: ${e.message}`;
        }
      });
    }

    // ─────────────────────────────────────────────────────────────
    // RENDER LOOP
    // ─────────────────────────────────────────────────────────────
    renderer.setAnimationLoop(() => {
      if (MOUSEMODE && !placed) {
        placeCatMouse();
      } else if (!MOUSEMODE && needsPlacement && renderer.xr.isPresenting) {
        placeCat();
        needsPlacement = false;
      }

      if (!MOUSEMODE) skinGloves();
      if (placed) updateCat();
      renderer.render(scene, camera);
    });

  </script>
</body>
</html>
