<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MalrangCat</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; font-family: 'Georgia', serif; }
    canvas { display: block; }

    #overlay {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: radial-gradient(ellipse at center,
        rgba(14, 5, 28, 0.97) 0%,
        rgba(3, 0, 10, 0.99) 100%);
    }
    #overlay.hidden { display: none; }

    #overlay h1 {
      color: #ffd9a0;
      font-size: 2.8rem;
      letter-spacing: 0.26em;
      font-weight: 400;
      margin-bottom: 0.45rem;
      text-shadow: 0 0 50px rgba(255, 170, 60, 0.25);
    }
    #overlay p {
      color: rgba(255, 200, 140, 0.42);
      font-size: 0.84rem;
      letter-spacing: 0.2em;
      margin-bottom: 3.8rem;
      font-family: sans-serif;
    }
    #btnXR {
      padding: 1rem 3.8rem;
      font-size: 0.95rem;
      background: transparent;
      color: #ffd9a0;
      border: 1px solid rgba(255, 180, 80, 0.4);
      border-radius: 60px;
      cursor: pointer;
      letter-spacing: 0.2em;
      font-family: sans-serif;
      transition: background 0.28s, border-color 0.28s, box-shadow 0.28s;
    }
    #btnXR:hover {
      background: rgba(255, 180, 80, 0.07);
      border-color: rgba(255, 210, 130, 0.7);
      box-shadow: 0 0 28px rgba(255, 160, 50, 0.18);
    }
    #errMsg {
      color: #ff8877;
      margin-top: 1.6rem;
      font-size: 0.78rem;
      text-align: center;
      max-width: 290px;
      line-height: 1.75;
      font-family: sans-serif;
    }
    #dbg {
      position: fixed; top: 0.8rem; left: 0.8rem; z-index: 20;
      color: rgba(255, 200, 140, 0.75);
      font-family: monospace;
      font-size: 0.68rem;
      line-height: 1.85;
      pointer-events: none;
      text-shadow: 0 0 5px #000;
      display: none;
    }
    #hint {
      position: fixed; bottom: 2.2rem; left: 50%;
      transform: translateX(-50%); z-index: 20;
      color: rgba(255, 200, 140, 0.48);
      font-size: 0.74rem;
      letter-spacing: 0.12em;
      pointer-events: none;
      font-family: sans-serif;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div id="overlay">
    <h1>MalrangCat</h1>
    <p>말랑말랑한 고양이</p>
    <button id="btnXR">만져보기</button>
    <div id="errMsg"></div>
  </div>
  <div id="dbg"></div>
  <div id="hint"></div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.165.0/build/three.module.js"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';

    // ─────────────────────────────────────────────────────────────
    // FLAGS
    // ─────────────────────────────────────────────────────────────
    const DEBUG     = location.search.includes('debug');
    const MOUSEMODE = location.search.includes('mouse');

    const dbgEl  = document.getElementById('dbg');
    const hintEl = document.getElementById('hint');
    if (DEBUG) dbgEl.style.display = 'block';

    // ─────────────────────────────────────────────────────────────
    // TOKENS
    // ─────────────────────────────────────────────────────────────
    const SEG    = 64;           // 격자 해상도 (64×64 = 4,225 버텍스)
    const COLS   = SEG + 1;
    const VCOUNT = COLS * COLS;

    // cheesecat.png content bbox: 247-710 x (1024w), 426-1165 y (1536h) → aspect 0.627
    const CAT_ASPECT = 463 / 739;   // (710-247) / (1165-426) ≈ 0.626
    const CAT_W      = 0.96;        // 메시 가로 m (기존 0.32의 3배)
    const CAT_H      = CAT_W / CAT_ASPECT; // ≈ 1.53 m

    // UV crop: image 전체 중 고양이가 있는 영역만 쓰도록
    // (Cloudflare 서빙 시 텍스처는 전체 이미지, UV는 그대로 0~1)
    const T = {
      cat: {
        forward: 0.75,   // 3배 커진 만큼 살짝 멀리
        drop:    0.25,    // 큰 고양이 중심을 눈높이보다 아래로
        width:   CAT_W,
        height:  CAT_H,
      },
      sim: {
        cohesion:  0.055,  // 살짝 낮춰 반죽처럼 늘어난 채 천천히 복원
        neighborK: 0.072,
        damping:   0.88,
        maxVel:    0.10,   // 멀리 당길 때 버텍스가 손끝을 따라오도록 상향
      },
      grab: {
        capture:      0.16,  // 큰 고양이용 잡기 반경
        kGrab:        0.17,  // 손끝을 더 단단히 따라옴 → 쭉 늘어남
        releaseSpeed: 0.09,  // 일반 드래그로는 안 풀리고, 빠른 털기만 놓침
        breakDist:    0.5,   // 반죽 가닥 길게 당겨도 안 끊김
        regrabDelay:  18,
      },
      rigid: {
        grabPropK: 0.03,  // 몸통 이동 대폭 축소 → 손을 피하지 않고 제자리서 늘어남
        homeK:     0.05,  // 밀려도 빠르게 제자리 복귀
        damp:      0.9,
      },
    };

    // 사전 계산
    const hStep    = T.cat.width  / SEG;
    const vStep    = T.cat.height / SEG;
    const diagStep = Math.sqrt(hStep * hStep + vStep * vStep);
    const capR     = T.grab.capture;          // 좌우 편의성
    const capR2    = capR * capR;

    // 풍선 돔 설정
    const BULGE    = 0.06;                     // 최대 Z 돌출량 (m) — 풍선 두께 (3배 크기 비례)
    const TOUCH_Z  = BULGE + 0.06;            // 잡기 허용 Z 범위 (m)
    const balloonZ = new Float32Array(VCOUNT); // 버텍스별 rest Z 오프셋
    let   balloonBuilt = false;

    // ─────────────────────────────────────────────────────────────
    // SHADER — 텍스처 + 디퓨즈 + 프레넬 + 손끝 글로우
    // ─────────────────────────────────────────────────────────────
    const catVert = /* glsl */`
      uniform vec3  uFingers[2];
      uniform int   uFingerCount;
      varying vec2  vUv;
      varying vec3  vNormal;
      varying vec3  vView;
      varying float vGlow;

      void main() {
        vUv     = uv;
        vec4 wp = modelMatrix * vec4(position, 1.0);
        vNormal = normalize(mat3(modelMatrix) * normal);
        vView   = normalize(cameraPosition - wp.xyz);

        float g = 0.0;
        for (int k = 0; k < 2; k++) {
          if (k >= uFingerCount) break;
          float d = distance(wp.xyz, uFingers[k]);
          g = max(g, exp(-d * d * 260.0));
        }
        vGlow = g;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `;

    const catFrag = /* glsl */`
      uniform sampler2D uTex;
      uniform vec3      uLightDir;
      varying vec2      vUv;
      varying vec3      vNormal;
      varying vec3      vView;
      varying float     vGlow;

      void main() {
        vec4 tex = texture2D(uTex, vUv);
        if (tex.a < 0.5) discard;   // 깔끔한 윤곽 컷아웃 (depthWrite와 함께 뒷면 비침 차단)

        vec3 n = normalize(vNormal);
        vec3 v = normalize(vView);

        // 디퓨즈 라이팅
        float diff  = max(dot(n, normalize(uLightDir)), 0.0);
        float light = 0.50 + 0.50 * diff;

        // 프레넬 (젤리 가장자리 광택)
        float fresnel = pow(1.0 - max(dot(n, v), 0.0), 2.8);

        vec3 col  = tex.rgb * light;
        col += vec3(1.0, 0.97, 0.90) * fresnel * 0.16;
        col += vec3(1.0, 0.82, 0.42) * vGlow * 0.60;  // 황금빛 글로우

        gl_FragColor = vec4(col, tex.a);
      }
    `;

    // ─────────────────────────────────────────────────────────────
    // SCENE
    // ─────────────────────────────────────────────────────────────
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.xr.enabled = !MOUSEMODE;
    document.body.appendChild(renderer.domElement);

    const scene  = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

    if (MOUSEMODE) {
      camera.position.set(0, 0, 0.65);
      camera.lookAt(0, 0, 0);
    }

    scene.add(new THREE.AmbientLight(0xffffff, 0.6));
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.1);
    dirLight.position.set(1, 2, 2);
    scene.add(dirLight);

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ─────────────────────────────────────────────────────────────
    // CAT MESH — PlaneGeometry + ShaderMaterial
    // ─────────────────────────────────────────────────────────────
    const catGeo = new THREE.PlaneGeometry(T.cat.width, T.cat.height, SEG, SEG);

    // ── 알파 마스크 + 풍선 돔
    // alphaMask[i]=0 → 투명(고양이 윤곽 밖), 물리 정지
    // balloonZ[i]    → 고양이 내부 거리 필드 기반 Z 오프셋 (풍선 모양)
    const alphaMask = new Uint8Array(VCOUNT);
    alphaMask.fill(1);

    function buildAlphaMask(img) {
      const cvs = document.createElement('canvas');
      cvs.width = img.width; cvs.height = img.height;
      const ctx = cvs.getContext('2d');
      ctx.drawImage(img, 0, 0);
      const data = ctx.getImageData(0, 0, img.width, img.height).data;

      // ── 1. 알파 샘플링
      for (let row = 0; row <= SEG; row++) {
        for (let col = 0; col <= SEG; col++) {
          const i = row * COLS + col;
          const u = col / SEG;
          const v = 1 - row / SEG;
          const px = Math.min(Math.floor(u * img.width),  img.width  - 1);
          const py = Math.min(Math.floor((1-v) * img.height), img.height - 1);
          alphaMask[i] = data[(py * img.width + px) * 4 + 3] > 20 ? 1 : 0;
        }
      }

      // ── 2. 거리 필드 계산 (Manhattan) → 돔 높이
      // distField[i] = 투명 경계에서 몇 격자 떨어졌는지
      const dist = new Float32Array(VCOUNT);
      for (let i = 0; i < VCOUNT; i++) dist[i] = alphaMask[i] ? 999 : 0;

      // 전진 패스
      for (let r = 0; r <= SEG; r++) for (let c = 0; c <= SEG; c++) {
        const i = r * COLS + c;
        if (!alphaMask[i]) continue;
        let m = dist[i];
        if (c > 0)   m = Math.min(m, dist[i-1]    + 1);
        if (r > 0)   m = Math.min(m, dist[i-COLS] + 1);
        dist[i] = m;
      }
      // 후진 패스
      for (let r = SEG; r >= 0; r--) for (let c = SEG; c >= 0; c--) {
        const i = r * COLS + c;
        if (!alphaMask[i]) continue;
        let m = dist[i];
        if (c < SEG) m = Math.min(m, dist[i+1]    + 1);
        if (r < SEG) m = Math.min(m, dist[i+COLS] + 1);
        dist[i] = m;
      }

      // ── 3. 정규화 후 풍선 Z 계산
      // sin(t*PI/2) 커브: 가장자리=0, 중심=BULGE, 전환 부드러움
      const maxD = dist.reduce((m,v) => Math.max(m,v), 0) || 1;
      for (let i = 0; i < VCOUNT; i++) {
        if (!alphaMask[i]) { balloonZ[i] = 0; continue; }
        const t = dist[i] / maxD;                    // 0(가장자리) ~ 1(중심)
        balloonZ[i] = Math.sin(t * Math.PI * 0.5) * BULGE;
      }

      applyBalloon();
      balloonBuilt = true;
    }

    // 풍선 높이를 지오메트리 + rest 위치에 적용
    function applyBalloon() {
      for (let i = 0; i < VCOUNT; i++) {
        posArr[i*3+2]  = balloonZ[i];
        if (placed) restArr[i*3+2] = balloonZ[i]; // 이미 배치됐으면 rest도 갱신
      }
      if (placed) computeRestLengths();           // rest 바뀌면 스프링 길이도 재계산
      catGeo.attributes.position.needsUpdate = true;
      catGeo.computeVertexNormals();
    }

    const catImg = new Image();
    catImg.crossOrigin = 'anonymous';
    catImg.onload = () => buildAlphaMask(catImg);
    catImg.src = 'cheesecat.png';

    const catTex = new THREE.TextureLoader().load('cheesecat.png');
    catTex.colorSpace = THREE.SRGBColorSpace;

    const catMat = new THREE.ShaderMaterial({
      vertexShader:   catVert,
      fragmentShader: catFrag,
      transparent: true,
      side:        THREE.DoubleSide,
      depthWrite:  true,   // 앞 껍데기가 뒤 껍데기를 가리도록 (입체 인형)
      uniforms: {
        uTex:         { value: catTex },
        uFingers:     { value: [new THREE.Vector3(9999, 9999, 9999),
                                 new THREE.Vector3(9999, 9999, 9999)] },
        uFingerCount: { value: 0 },
        uLightDir:    { value: new THREE.Vector3(1, 2, 2).normalize() },
      },
    });

    const catMesh = new THREE.Mesh(catGeo, catMat);
    catMesh.visible = false;
    scene.add(catMesh);

    // ── 뒷면 껍데기: 같은 물리 지오메트리를 z축 반전해 붙임
    // → 앞(+Z 돔) + 뒤(-Z 돔)이 가장자리에서 맞물려 입체 인형(쿠션) 형태.
    //   geometry/uniform를 공유하므로 변형이 앞뒤 똑같이 반영됨.
    const catMeshBack = new THREE.Mesh(catGeo, catMat);
    catMeshBack.scale.z = -1;       // 돔을 반대쪽으로
    catMesh.add(catMeshBack);       // 자식 → catMesh 변형/가시성 따라감

    // ─────────────────────────────────────────────────────────────
    // PHYSICS BUFFERS (로컬 메시 공간)
    // ─────────────────────────────────────────────────────────────
    const posArr  = catGeo.attributes.position.array;  // 지오메트리 버퍼 직접 참조
    const restArr = new Float32Array(VCOUNT * 3);       // 초기(rest) 위치
    const velArr  = new Float32Array(VCOUNT * 3);       // 버텍스 속도
    const prevArr = new Float32Array(VCOUNT * 3);       // 직전 프레임 스냅샷 (Jacobi 적분용)

    // ── 스프링 rest 길이 (풍선 돔 포함 실제 거리)
    // 평면 hStep/vStep을 쓰면 돔 경사가 영구 긴장 → 손 안 대도 자가운동.
    // rest 위치(돔 포함)의 실제 이웃 거리로 잡아야 돔이 진짜 평형이 됨.
    const rlH  = new Float32Array(VCOUNT); // i ↔ i+1      (col < SEG)
    const rlV  = new Float32Array(VCOUNT); // i ↔ i+COLS   (row < SEG)
    const rlD1 = new Float32Array(VCOUNT); // i ↔ i+COLS+1 (down-right)
    const rlD2 = new Float32Array(VCOUNT); // i ↔ i+COLS-1 (down-left)

    function computeRestLengths() {
      for (let r = 0; r <= SEG; r++) for (let c = 0; c <= SEG; c++) {
        const i = r * COLS + c, i3 = i * 3;
        const rx = restArr[i3], ry = restArr[i3+1], rz = restArr[i3+2];
        if (c < SEG)             { const n=(i+1)*3;      rlH[i]  = Math.hypot(restArr[n]-rx, restArr[n+1]-ry, restArr[n+2]-rz); }
        if (r < SEG)             { const n=(i+COLS)*3;   rlV[i]  = Math.hypot(restArr[n]-rx, restArr[n+1]-ry, restArr[n+2]-rz); }
        if (r < SEG && c < SEG)  { const n=(i+COLS+1)*3; rlD1[i] = Math.hypot(restArr[n]-rx, restArr[n+1]-ry, restArr[n+2]-rz); }
        if (r < SEG && c > 0)    { const n=(i+COLS-1)*3; rlD2[i] = Math.hypot(restArr[n]-rx, restArr[n+1]-ry, restArr[n+2]-rz); }
      }
    }

    // ─────────────────────────────────────────────────────────────
    // FINGER STATE
    // ─────────────────────────────────────────────────────────────
    const fingers = [
      { pos: new THREE.Vector3(), has: false },
      { pos: new THREE.Vector3(), has: false },
    ];
    const fingerPrev     = [new THREE.Vector3(), new THREE.Vector3()];
    const fingerVel      = [new THREE.Vector3(), new THREE.Vector3()];
    const fingerSpeed    = [0, 0];
    const fingerLocalPos = [new THREE.Vector3(), new THREE.Vector3()];
    const fingerCanGrab  = [false, false]; // XR = true 항상; 마우스 = 클릭 시만

    // 마우스 모드: hover 글로우용 (physics와 분리)
    const shaderPos   = [new THREE.Vector3(9999,9999,9999), new THREE.Vector3(9999,9999,9999)];
    let   shaderCount = 0;

    // ─────────────────────────────────────────────────────────────
    // GRAB STATE
    // ─────────────────────────────────────────────────────────────
    const grabActive  = [false, false];
    // grabWeight[h][i] = 0~1 (단순 블리안 대신 거리 가중치)
    // 가운데 = 1, 반경 끝 = 0 → 점토 주룉 늘어나는 느낌
    const grabWeight  = [new Float32Array(VCOUNT), new Float32Array(VCOUNT)];
    const grabCenterL = [new THREE.Vector3(), new THREE.Vector3()];
    const regrabCool  = [0, 0];

    // ─────────────────────────────────────────────────────────────
    // MESH RIGID BODY — 메시 전체 이동 (cat이 손으로 밀리도록)
    // ─────────────────────────────────────────────────────────────
    const meshVel  = new THREE.Vector3();
    const meshHome = new THREE.Vector3(); // 배치 직후 원위치

    // ─────────────────────────────────────────────────────────────
    // HELPERS
    // ─────────────────────────────────────────────────────────────
    const _invMat  = new THREE.Matrix4();
    const _headPos = new THREE.Vector3();
    const _headFwd = new THREE.Vector3();
    const _spawn   = new THREE.Vector3();

    let placed = false, needsPlacement = false;

    // ─────────────────────────────────────────────────────────────
    // INIT PHYSICS — rest 위치 복사, 속도 초기화
    // ─────────────────────────────────────────────────────────────
    function initPhysics() {
      if (balloonBuilt) applyBalloon();
      restArr.set(posArr);
      computeRestLengths();   // 돔 포함 실제 rest 길이 (평형 보장)
      velArr.fill(0);
      grabActive[0] = grabActive[1] = false;
      grabWeight[0].fill(0); grabWeight[1].fill(0);
      regrabCool[0] = regrabCool[1] = 0;
      fingerCanGrab[0] = fingerCanGrab[1] = false;
      meshVel.set(0, 0, 0);
    }

    // ─────────────────────────────────────────────────────────────
    // PLACEMENT (XR) — 세션 첫 프레임에 눈높이 정면 배치
    // ─────────────────────────────────────────────────────────────
    function placeCat() {
      const xrCam = renderer.xr.getCamera();
      xrCam.getWorldPosition(_headPos);
      xrCam.getWorldDirection(_headFwd);
      _headFwd.y = 0;
      if (_headFwd.lengthSq() < 1e-6) _headFwd.set(0, 0, -1);
      _headFwd.normalize();

      _spawn.copy(_headPos).addScaledVector(_headFwd, T.cat.forward);
      _spawn.y = _headPos.y - T.cat.drop;

      catMesh.position.copy(_spawn);
      meshHome.copy(_spawn);   // 원위치 저장

      catMesh.quaternion.setFromUnitVectors(
        new THREE.Vector3(0, 0, 1),
        _headFwd.clone().negate()
      );
      catMesh.updateWorldMatrix(false, false);
      catMesh.visible = true;
      initPhysics();
      placed = true;
    }

    // PLACEMENT (mouse) — 원점에 고양이, 카메라는 앞쪽
    function placeCatMouse() {
      catMesh.position.set(0, 0, 0);
      meshHome.set(0, 0, 0);   // 원위치 저장
      catMesh.quaternion.identity();
      catMesh.updateWorldMatrix(false, false);
      catMesh.visible = true;
      document.getElementById('overlay').classList.add('hidden');
      hintEl.textContent = '클릭 & 드래그로 말랑하게 만져보세요 🐾';
      initPhysics();
      placed = true;
    }

    // ─────────────────────────────────────────────────────────────
    // HANDS  (scene에 추가해야 joint matrixWorld 갱신됨)
    // ─────────────────────────────────────────────────────────────
    const hands = MOUSEMODE ? [] : [renderer.xr.getHand(0), renderer.xr.getHand(1)];
    hands.forEach(h => scene.add(h));

    function readFingers() {
      for (let h = 0; h < 2; h++) {
        const tip    = hands[h]?.joints?.['index-finger-tip'];
        const wasHas = fingers[h].has;
        fingers[h].has = false;
        fingerSpeed[h] = 0;
        if (!tip) continue;
        fingers[h].pos.setFromMatrixPosition(tip.matrixWorld);
        if (fingers[h].pos.lengthSq() < 1e-8) continue; // 미갱신 joint(원점) 무시
        fingers[h].has = true;
        fingerCanGrab[h] = true;  // XR: 항상 잡기 가능
        if (wasHas) {
          fingerVel[h].subVectors(fingers[h].pos, fingerPrev[h]);
          fingerSpeed[h] = fingerVel[h].length();
        } else {
          fingerVel[h].set(0, 0, 0); // 추적 재획득 프레임 속도 스파이크 방지
        }
        fingerPrev[h].copy(fingers[h].pos);
      }
    }

    // ─────────────────────────────────────────────────────────────
    // GRAB UPDATE — 손별 잡기 획득/해제
    // ─────────────────────────────────────────────────────────────
    function updateGrab() {
      _invMat.copy(catMesh.matrixWorld).invert();

      for (let h = 0; h < 2; h++) {
        regrabCool[h] = Math.max(0, regrabCool[h] - 1);

        if (!fingers[h].has) {
          if (grabActive[h]) { grabActive[h] = false; grabWeight[h].fill(0); }
          fingerLocalPos[h].set(9999, 9999, 9999);
          continue;
        }

        // 손끝 → 로컬 공간 변환
        fingerLocalPos[h].copy(fingers[h].pos).applyMatrix4(_invMat);

        // ── Z 근접 게이트: 손이 메시 평면에서 너무 멀면 완전 무시
        // 풍선 표면(≈BULGE) 기준 ±TOUCH_Z 범위 밖이면 인터랙션 없음
        // → 손이 가까이 가기만 해도 울렁이는 현상 완전 차단
        if (fingerLocalPos[h].z < -0.02 || fingerLocalPos[h].z > TOUCH_Z) {
          if (grabActive[h]) { grabActive[h] = false; grabWeight[h].fill(0); }
          fingerLocalPos[h].set(9999, 9999, 9999);
          fingers[h].has = false;
          continue;
        }

        // ── 해제 조건 확인 (잡는 중일 때)
        if (grabActive[h]) {
          const flick  = fingerSpeed[h] > T.grab.releaseSpeed;
          const tooFar = fingerLocalPos[h].distanceTo(grabCenterL[h]) > T.grab.breakDist;
          if (flick || tooFar) {
            // 손 속도를 로컬 공간으로 변환 후 잡힌 버텍스에 전달 (날아가게)
            const e   = _invMat.elements;
            const wx  = fingerVel[h].x, wy = fingerVel[h].y, wz = fingerVel[h].z;
            const lvx = e[0]*wx + e[4]*wy + e[8]*wz;
            const lvy = e[1]*wx + e[5]*wy + e[9]*wz;
            const lvz = e[2]*wx + e[6]*wy + e[10]*wz;
            for (let i = 0; i < VCOUNT; i++) {
              const w = grabWeight[h][i];
              if (w < 0.001) continue;
              velArr[i*3]   += lvx * 0.45 * w;
              velArr[i*3+1] += lvy * 0.45 * w;
              velArr[i*3+2] += lvz * 0.45 * w;
            }
            grabActive[h] = false;
            grabWeight[h].fill(0);
            regrabCool[h] = T.grab.regrabDelay;
          }
          continue; // 잡는 중: 재획득 시도 안 함
        }

        // ── 잡기 획득 — capture 반경 안의 불투명 버텍스, 거리 가중치 계산
        if (fingerCanGrab[h] && regrabCool[h] === 0) {
          const fl = fingerLocalPos[h];
          let   wsum = 0;
          grabWeight[h].fill(0);
          grabCenterL[h].set(0, 0, 0);

          for (let i = 0; i < VCOUNT; i++) {
            if (!alphaMask[i]) continue;
            const dx = posArr[i*3]   - fl.x;
            const dy = posArr[i*3+1] - fl.y;
            const dz = posArr[i*3+2] - fl.z;
            const dsq = dx*dx + dy*dy + dz*dz;
            if (dsq < capR2) {
              // 중심=1, 가장자리=0 의 부드러운 낙하 (찰흙 느낌)
              const t = 1 - Math.sqrt(dsq) / capR;
              const w = t * t;   // ease-in falloff
              grabWeight[h][i] = w;
              grabCenterL[h].x += posArr[i*3]   * w;
              grabCenterL[h].y += posArr[i*3+1] * w;
              grabCenterL[h].z += posArr[i*3+2] * w;
              wsum += w;
            }
          }
          if (wsum > 0.01) {
            grabCenterL[h].divideScalar(wsum);
            grabActive[h] = true;
          }
        }
      }
    }

    // ─────────────────────────────────────────────────────────────
    // SIMULATION STEP — 버텍스 물리 적분
    //   cohesion: rest position spring (탄성 복원)
    //   neighbor: 8방향 스프링 (출렁임 파급, 구조 유지)
    //   finger:   push(dent) 또는 grab(pull) 힘
    // ─────────────────────────────────────────────────────────────
    function simStep() {
      const pos  = posArr;
      const prev = prevArr;
      const rest = restArr;
      const vel  = velArr;
      const kC   = T.sim.cohesion;
      const kN   = T.sim.neighborK;
      const dp   = T.sim.damping;
      const mv   = T.sim.maxVel;
      const mv2  = mv * mv;

      // 직전 프레임 위치를 스냅샷 → 모든 이웃 힘을 동일한 상태에서 읽음(Jacobi).
      // 제자리 갱신(Gauss-Seidel)은 격자를 훑는 순서 때문에 비대칭 힘 →
      // 자가 회전/표류(나선 버그)를 유발. 스냅샷으로 그 에너지 주입을 제거.
      prev.set(pos);

      for (let i = 0; i < VCOUNT; i++) {
        const i3 = i * 3;
        const px = prev[i3], py = prev[i3+1], pz = prev[i3+2];

        // ── cohesion: rest position으로 끌어당김
        let fx = (rest[i3]   - px) * kC;
        let fy = (rest[i3+1] - py) * kC;
        let fz = (rest[i3+2] - pz) * kC;

        const row = (i / COLS) | 0;
        const col = i % COLS;

        let ni3, dx, dy, dz, d, s;

        // ── 축방향 스프링 (rest 길이 = 돔 포함 실제 거리)
        if (col > 0) {
          ni3 = (i-1)*3;
          dx = prev[ni3]-px; dy = prev[ni3+1]-py; dz = prev[ni3+2]-pz;
          d  = Math.sqrt(dx*dx+dy*dy+dz*dz);
          if (d > 1e-8) { s=(d-rlH[i-1])/d*kN; fx+=dx*s; fy+=dy*s; fz+=dz*s; }
        }
        if (col < SEG) {
          ni3 = (i+1)*3;
          dx = prev[ni3]-px; dy = prev[ni3+1]-py; dz = prev[ni3+2]-pz;
          d  = Math.sqrt(dx*dx+dy*dy+dz*dz);
          if (d > 1e-8) { s=(d-rlH[i])/d*kN; fx+=dx*s; fy+=dy*s; fz+=dz*s; }
        }
        if (row > 0) {
          ni3 = (i-COLS)*3;
          dx = prev[ni3]-px; dy = prev[ni3+1]-py; dz = prev[ni3+2]-pz;
          d  = Math.sqrt(dx*dx+dy*dy+dz*dz);
          if (d > 1e-8) { s=(d-rlV[i-COLS])/d*kN; fx+=dx*s; fy+=dy*s; fz+=dz*s; }
        }
        if (row < SEG) {
          ni3 = (i+COLS)*3;
          dx = prev[ni3]-px; dy = prev[ni3+1]-py; dz = prev[ni3+2]-pz;
          d  = Math.sqrt(dx*dx+dy*dy+dz*dz);
          if (d > 1e-8) { s=(d-rlV[i])/d*kN; fx+=dx*s; fy+=dy*s; fz+=dz*s; }
        }

        // ── 대각선 스프링 (shear 방지, 젤리 구조감)
        if (col > 0 && row > 0) {
          ni3 = (i-COLS-1)*3;
          dx = prev[ni3]-px; dy = prev[ni3+1]-py; dz = prev[ni3+2]-pz;
          d  = Math.sqrt(dx*dx+dy*dy+dz*dz);
          if (d > 1e-8) { s=(d-rlD1[i-COLS-1])/d*kN; fx+=dx*s; fy+=dy*s; fz+=dz*s; }
        }
        if (col < SEG && row > 0) {
          ni3 = (i-COLS+1)*3;
          dx = prev[ni3]-px; dy = prev[ni3+1]-py; dz = prev[ni3+2]-pz;
          d  = Math.sqrt(dx*dx+dy*dy+dz*dz);
          if (d > 1e-8) { s=(d-rlD2[i-COLS+1])/d*kN; fx+=dx*s; fy+=dy*s; fz+=dz*s; }
        }
        if (col > 0 && row < SEG) {
          ni3 = (i+COLS-1)*3;
          dx = prev[ni3]-px; dy = prev[ni3+1]-py; dz = prev[ni3+2]-pz;
          d  = Math.sqrt(dx*dx+dy*dy+dz*dz);
          if (d > 1e-8) { s=(d-rlD2[i])/d*kN; fx+=dx*s; fy+=dy*s; fz+=dz*s; }
        }
        if (col < SEG && row < SEG) {
          ni3 = (i+COLS+1)*3;
          dx = prev[ni3]-px; dy = prev[ni3+1]-py; dz = prev[ni3+2]-pz;
          d  = Math.sqrt(dx*dx+dy*dy+dz*dz);
          if (d > 1e-8) { s=(d-rlD1[i])/d*kN; fx+=dx*s; fy+=dy*s; fz+=dz*s; }
        }

        // ── 투명 버텍스: 물리 동결 (윤곽 유지)
        if (!alphaMask[i]) {
          pos[i3]   = rest[i3];
          pos[i3+1] = rest[i3+1];
          pos[i3+2] = rest[i3+2];
          vel[i3] = vel[i3+1] = vel[i3+2] = 0;
          continue;
        }

        // ── 잡기 힘 — 가중치 기반 부드러운 당김 (찰흙 주욱 느낌)
        for (let h = 0; h < 2; h++) {
          if (!fingers[h].has) continue;
          const w = grabWeight[h][i];
          if (!grabActive[h] || w < 0.001) continue;
          const fl = fingerLocalPos[h];
          // 가중치로 스케일: 중심 버텍스는 강하게, 주변은 약하게 당김
          fx += (fl.x - px) * T.grab.kGrab * w;
          fy += (fl.y - py) * T.grab.kGrab * w;
          fz += (fl.z - pz) * T.grab.kGrab * w;
        }

        // ── 적분
        vel[i3]   = (vel[i3]   + fx) * dp;
        vel[i3+1] = (vel[i3+1] + fy) * dp;
        vel[i3+2] = (vel[i3+2] + fz) * dp;

        // 폭주 방지 클램프
        const vsq = vel[i3]*vel[i3]+vel[i3+1]*vel[i3+1]+vel[i3+2]*vel[i3+2];
        if (vsq > mv2) {
          const sc = mv / Math.sqrt(vsq);
          vel[i3]*=sc; vel[i3+1]*=sc; vel[i3+2]*=sc;
        }

        pos[i3]   += vel[i3];
        pos[i3+1] += vel[i3+1];
        pos[i3+2] += vel[i3+2];
      }

      catGeo.attributes.position.needsUpdate = true;
      catGeo.computeVertexNormals();
    }

    // ─────────────────────────────────────────────────────────────
    // MESH RIGID UPDATE — 잡아당길 때 고양이 전체가 밀리고 복귀
    // ─────────────────────────────────────────────────────────────
    function updateMeshRigid() {
      // grab 활성 → 손 속도의 일부를 메시 전체 이동에 전달
      for (let h = 0; h < 2; h++) {
        if (grabActive[h] && fingerSpeed[h] > 0.001) {
          meshVel.addScaledVector(fingerVel[h], T.rigid.grabPropK);
        }
      }
      // 원위치 복귀 스프링
      meshVel.x += (meshHome.x - catMesh.position.x) * T.rigid.homeK;
      meshVel.y += (meshHome.y - catMesh.position.y) * T.rigid.homeK;
      meshVel.z += (meshHome.z - catMesh.position.z) * T.rigid.homeK;
      // 감쇠 + 적용
      meshVel.multiplyScalar(T.rigid.damp);
      catMesh.position.add(meshVel);
    }

    // ─────────────────────────────────────────────────────────────
    // MAIN UPDATE — 매 프레임 호출
    // ─────────────────────────────────────────────────────────────
    function updateCat() {
      if (!MOUSEMODE) readFingers();

      catMesh.updateWorldMatrix(false, false);
      updateGrab();
      simStep();
      updateMeshRigid();   // ← 고양이 전체 이동 물리

      // 셰이더 손끝 글로우 업데이트
      if (MOUSEMODE) {
        catMat.uniforms.uFingers.value[0].copy(shaderPos[0]);
        catMat.uniforms.uFingerCount.value = shaderCount;
      } else {
        let fc = 0;
        for (let h = 0; h < 2; h++) {
          if (fingers[h].has) catMat.uniforms.uFingers.value[fc++].copy(fingers[h].pos);
        }
        catMat.uniforms.uFingerCount.value = fc;
      }

      if (DEBUG) {
        dbgEl.textContent =
          `mode: ${MOUSEMODE ? 'mouse' : 'XR'}\n` +
          `L: ${fingers[0].has ? '✓' : '✗'}  grab:${grabActive[0] ? '●' : '○'}\n` +
          `R: ${fingers[1].has ? '✓' : '✗'}  grab:${grabActive[1] ? '●' : '○'}`;
      }
    }

    // ─────────────────────────────────────────────────────────────
    // MOUSE MODE INPUT  (?mouse URL 파라미터로 활성화)
    // ─────────────────────────────────────────────────────────────
    if (MOUSEMODE) {
      const raycaster = new THREE.Raycaster();
      const mouseNDC  = new THREE.Vector2();
      const hitPlane  = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
      const hitPoint  = new THREE.Vector3();
      let   isDown    = false;

      function trackMouse(clientX, clientY) {
        mouseNDC.x =  (clientX / window.innerWidth)  * 2 - 1;
        mouseNDC.y = -(clientY / window.innerHeight) * 2 + 1;
        raycaster.setFromCamera(mouseNDC, camera);
        return raycaster.ray.intersectPlane(hitPlane, hitPoint);
      }

      window.addEventListener('mousemove', e => {
        if (!placed) return;
        if (!trackMouse(e.clientX, e.clientY)) { fingers[0].has = false; return; }

        const prevPos = fingerPrev[0].clone();
        shaderPos[0].copy(hitPoint);
        shaderCount = 1;

        if (isDown) {
          fingers[0].pos.copy(hitPoint);
          fingers[0].has = true;
          fingerCanGrab[0] = true;
          fingerVel[0].subVectors(hitPoint, prevPos);
          fingerSpeed[0] = fingerVel[0].length();
        } else {
          fingers[0].has = false;
          fingerCanGrab[0] = false;
          fingerVel[0].set(0, 0, 0);
          fingerSpeed[0] = 0;
        }
        fingerPrev[0].copy(hitPoint);
      });

      window.addEventListener('mousedown', e => {
        if (!placed) return;
        isDown = true;
        if (!trackMouse(e.clientX, e.clientY)) return;
        fingers[0].pos.copy(hitPoint);
        fingers[0].has = true;
        fingerCanGrab[0] = true;
        fingerPrev[0].copy(hitPoint);
        fingerVel[0].set(0, 0, 0);
        fingerSpeed[0] = 0;
      });

      window.addEventListener('mouseup', () => {
        isDown = false;
        fingers[0].has = false;
        fingerCanGrab[0] = false;
        fingerSpeed[0] = 0;
        // 잡기 해제 시 현재 속도를 버텍스에 전달
        if (grabActive[0]) {
          catMesh.updateWorldMatrix(false, false);
          _invMat.copy(catMesh.matrixWorld).invert();
          const e   = _invMat.elements;
          const wx  = fingerVel[0].x, wy = fingerVel[0].y, wz = fingerVel[0].z;
          const lvx = e[0]*wx + e[4]*wy + e[8]*wz;
          const lvy = e[1]*wx + e[5]*wy + e[9]*wz;
          const lvz = e[2]*wx + e[6]*wy + e[10]*wz;
          for (let i = 0; i < VCOUNT; i++) {
            const w = grabWeight[0][i];
            if (w < 0.001) continue;
            velArr[i*3]   += lvx * 0.42 * w;
            velArr[i*3+1] += lvy * 0.42 * w;
            velArr[i*3+2] += lvz * 0.42 * w;
          }
          grabActive[0] = false;
          grabWeight[0].fill(0);
          regrabCool[0] = T.grab.regrabDelay;
        }
      });

      window.addEventListener('mouseleave', () => {
        shaderCount = 0;
        fingers[0].has = false;
        if (grabActive[0]) { grabActive[0] = false; grabWeight[0].fill(0); }
      });

      // 터치 지원
      window.addEventListener('touchmove', e => {
        e.preventDefault();
        if (!placed) return;
        const t = e.touches[0];
        if (!trackMouse(t.clientX, t.clientY)) return;
        const prevPos = fingerPrev[0].clone();
        shaderPos[0].copy(hitPoint);
        shaderCount = 1;
        fingers[0].pos.copy(hitPoint);
        fingers[0].has = true;
        fingerCanGrab[0] = true;
        fingerVel[0].subVectors(hitPoint, prevPos);
        fingerSpeed[0] = fingerVel[0].length();
        fingerPrev[0].copy(hitPoint);
      }, { passive: false });

      window.addEventListener('touchstart', e => {
        if (!placed) return;
        isDown = true;
        const t = e.touches[0];
        if (!trackMouse(t.clientX, t.clientY)) return;
        fingers[0].pos.copy(hitPoint);
        fingers[0].has = true;
        fingerCanGrab[0] = true;
        fingerPrev[0].copy(hitPoint);
        fingerVel[0].set(0, 0, 0);
        fingerSpeed[0] = 0;
      });

      window.addEventListener('touchend', () => {
        isDown = false;
        fingers[0].has = false;
        fingerCanGrab[0] = false;
        shaderCount = 0;
        if (grabActive[0]) { grabActive[0] = false; grabWeight[0].fill(0); }
      });
    }

    // ─────────────────────────────────────────────────────────────
    // XR SETUP
    // ─────────────────────────────────────────────────────────────
    const overlay = document.getElementById('overlay');
    const btnXR   = document.getElementById('btnXR');
    const errMsg  = document.getElementById('errMsg');

    if (!MOUSEMODE) {
      btnXR.addEventListener('click', async () => {
        if (!navigator.xr) {
          errMsg.textContent = 'WebXR를 지원하지 않는 기기입니다.';
          return;
        }
        const ok = await navigator.xr.isSessionSupported('immersive-ar').catch(() => false);
        if (!ok) {
          errMsg.textContent = 'immersive-ar 세션을 지원하지 않습니다.';
          return;
        }
        try {
          const session = await navigator.xr.requestSession('immersive-ar', {
            requiredFeatures: ['local-floor'],
            optionalFeatures: ['hand-tracking'],  // 선택사항: 지원 안 해도 세션 실패 안 함
          });
          renderer.xr.setSession(session);
          needsPlacement = true;
          overlay.classList.add('hidden');
        } catch (e) {
          errMsg.textContent = `세션 시작 실패: ${e.message}`;
        }
      });
    }

    // ─────────────────────────────────────────────────────────────
    // RENDER LOOP
    // ─────────────────────────────────────────────────────────────
    renderer.setAnimationLoop(() => {
      if (MOUSEMODE && !placed) {
        placeCatMouse();
      } else if (!MOUSEMODE && needsPlacement && renderer.xr.isPresenting) {
        placeCat();
        needsPlacement = false;
      }

      if (placed) updateCat();
      renderer.render(scene, camera);
    });

  </script>
</body>
</html>
