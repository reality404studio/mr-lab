        vec4 mv  = modelViewMatrix * mp;
        vNormal  = normalMatrix * n;
        vViewPos = mv.xyz;
        vH  = hN;
        vPh = aPhase;
        gl_Position = projectionMatrix * mv;
      }
    `;
    const _jellyBellFrag = `
      uniform float uTime;
      uniform float uVoice;
      varying vec3  vNormal;
      varying vec3  vViewPos;
      varying float vH;
      varying float vPh;
      void main() {
        vec3  N   = normalize(vNormal);
        vec3  V   = normalize(-vViewPos);
        float ndv = abs(dot(N, V));
        float rim = pow(1.0 - ndv, 1.6);
        // 림(시안) → 정수리(마젠타) 그라데이션
        vec3 col = mix(vec3(0.25, 0.80, 1.0), vec3(0.95, 0.45, 0.85), clamp(vH, 0.0, 1.0));
        // 맥박에 맞춰 숨쉬는 내부 발광 코어
        float core = pow(ndv, 2.5) * (0.55 + 0.45 * sin(uTime * ${_JELLY_PULSE_W} + vPh));
        col += vec3(1.0, 0.60, 0.90) * core * 0.55;
        float glow = 0.3 + uVoice * 0.7;
        float a = (0.14 + rim * 0.62) * (0.5 + glow * 0.8);
        gl_FragColor = vec4(col * (0.7 + glow * 0.6), a);
      }
    `;
    const _jellyTentVert = `
      attribute float aPhase;
      uniform float uTime;
      varying float vDepth;
      varying float vPh;
      void main() {
        float depth = clamp(-position.y / ${(JELLY_UMBRELLA_R * 3.0).toFixed(3)}, 0.0, 1.0);
        float pulse = sin(uTime * ${_JELLY_PULSE_W} + aPhase);
        vec3 p = position;
        // 아래로 갈수록 크게 흔들리는 베일 스웨이
        p.x += sin(uTime * 1.6 + aPhase + position.y * 5.0)       * depth * ${(JELLY_UMBRELLA_R * 0.85).toFixed(3)};
        p.z += cos(uTime * 1.3 + aPhase * 1.7 + position.y * 4.0) * depth * ${(JELLY_UMBRELLA_R * 0.85).toFixed(3)};
        // 벨 맥박과 연동
        float radial = 1.0 + pulse * 0.10 * (1.0 - depth);
        p.x *= radial;
        p.z *= radial;
        vec4 mp = vec4(p, 1.0);
        #ifdef USE_INSTANCING
          mp = instanceMatrix * mp;
        #endif
        vDepth = depth;
        vPh    = aPhase;
        gl_Position = projectionMatrix * modelViewMatrix * mp;
      }
    `;
    const _jellyTentFrag = `
      uniform float uTime;
      uniform float uVoice;
      varying float vDepth;
      varying float vPh;
      void main() {
        vec3 col = mix(vec3(0.45, 0.85, 1.0), vec3(0.55, 0.30, 0.95), vDepth);
        // 베일을 따라 흘러내리는 발광 파동
        float wave = 0.7 + 0.3 * sin(vDepth * 14.0 - uTime * 2.2 + vPh);
        float a = pow(1.0 - vDepth, 1.8) * wave * (0.22 + uVoice * 0.35);
        gl_FragColor = vec4(col, a);
      }
    `;

    const _jellyData = [];
    let   _jellyBellMesh = null;
    let   _jellyTentMesh = null;

    function initJellyfish() {
      if (_jellyBellMesh) return;   // 세션 재진입 시 중복 생성 방지
      const R = JELLY_UMBRELLA_R;

      const phases = new Float32Array(JELLY_MAX);
      for (let i = 0; i < JELLY_MAX; i++) phases[i] = Math.random() * Math.PI * 2;

      // 벨: 적도 살짝 아래까지 내려오는 돔 (림이 안쪽으로 말림)
      const bellGeo = new THREE.SphereGeometry(R, 20, 12, 0, Math.PI * 2, 0, Math.PI * 0.62);
      bellGeo.setAttribute('aPhase', new THREE.InstancedBufferAttribute(phases, 1));
      const bellMat = new THREE.ShaderMaterial({
        uniforms: { uTime: _uTime, uVoice: _uVoice },
        vertexShader: _jellyBellVert, fragmentShader: _jellyBellFrag,
        transparent: true, depthWrite: false, side: THREE.DoubleSide,
        blending: THREE.AdditiveBlending,
      });
      _jellyBellMesh = new THREE.InstancedMesh(bellGeo, bellMat, JELLY_MAX);
      _jellyBellMesh.count = 0; _jellyBellMesh.frustumCulled = false;
      scene.add(_jellyBellMesh);

      // 베일(촉수 군집): 벨 아래로 길게 늘어진 반투명 원뿔 셸
      const tentGeo = new THREE.CylinderGeometry(R * 0.5, R * 0.10, R * 3.0, 9, 10, true);
      tentGeo.translate(0, -R * 1.5, 0);
      tentGeo.setAttribute('aPhase', new THREE.InstancedBufferAttribute(phases.slice(), 1));
      const tentMat = new THREE.ShaderMaterial({
        uniforms: { uTime: _uTime, uVoice: _uVoice },
        vertexShader: _jellyTentVert, fragmentShader: _jellyTentFrag,
        transparent: true, depthWrite: false, side: THREE.DoubleSide,
        blending: THREE.AdditiveBlending,
      });
      _jellyTentMesh = new THREE.InstancedMesh(tentGeo, tentMat, JELLY_MAX);
      _jellyTentMesh.count = 0; _jellyTentMesh.frustumCulled = false;
      scene.add(_jellyTentMesh);
    }

    function spawnJellyfish(x, y, z) {
      if (_jellyData.length >= JELLY_MAX) return;
      _jellyData.push({ x, y, z, vx:0, vy:0, vz:0,
        phase:Math.random()*Math.PI*2, scatterTimer:0 });
      ctx.spawnState.jellyCount = _jellyData.length;
    }

    function scatterJellyfishAt(x, y, z, r) {
      for (const j of _jellyData) _applyScatterImpulse(j, x, y, z, r);
    }

    

    function updateJellyfish(timestamp, dt) {
      if (!_jellyBellMesh || _jellyData.length === 0) return;
      const now = timestamp / 1000;
      const lvl = { silence:0, whisper:1, call:2, sing:3 }[ctx.voiceHeld] ?? 0;

      // 발광 강도는 셰이더의 uVoice 유니폼이 담당 (updateAtmosphere에서 스무딩)

      const vortexPos = getOrbVortexPositions();

      for (let i = 0; i < _jellyData.length; i++) {
        const j = _jellyData[i];
        j.scatterTimer = Math.max(j.scatterTimer-dt, 0);

        if (j.scatterTimer <= 0) {
          if (lvl >= 1) {
            const dx=ctx.headPos.x-j.x, dz=ctx.headPos.z-j.z;
            const d=Math.sqrt(dx*dx+dz*dz)+0.01;
            j.vx += (dx/d)*lvl*0.08*dt; j.vz += (dz/d)*lvl*0.08*dt;
          }
          for (const vp of vortexPos) {
            const d=Math.hypot(vp.x-j.x, vp.y-j.y, vp.z-j.z);
            if (d < JELLY_VORTEX_DIST) _steerToward(j, vp.x, vp.y, vp.z, 2.0, dt);
          }
        }

        j.vy += Math.sin(now*1.2+j.phase)*0.02*dt;
        j.vx *= 0.98; j.vy *= 0.98; j.vz *= 0.98;
        _constrainVolume(j);
        _clampSpeed(j, JELLY_DRIFT_SPEED*(1+lvl*0.3));
        j.x+=j.vx*dt; j.y+=j.vy*dt; j.z+=j.vz*dt;

        // 맥동은 GPU 셰이더에서 — CPU는 위치만 갱신
        _iPos.set(j.x, j.y, j.z); _iQuat.identity();
        _iMat.compose(_iPos, _iQuat, _iScl);
        _jellyBellMesh.setMatrixAt(i, _iMat);
        _jellyTentMesh.setMatrixAt(i, _iMat);
      }
      _jellyBellMesh.instanceMatrix.needsUpdate = true;
      _jellyTentMesh.instanceMatrix.needsUpdate = true;
      _jellyBellMesh.count = _jellyData.length;
      _jellyTentMesh.count = _jellyData.length;
    }

    // ─────────────────────────────────────────────────────────────
    // C15 — WHALE  (세션 1회 클라이맥스 시퀀스)
    // ─────────────────────────────────────────────────────────────

    const _whale = { phase:'idle', timer:0, mesh:null, sx:0,sy:0,sz:0, ex:0,ey:0,ez:0 };

    function _triggerWhale() {
      if (_whale.phase !== 'idle') return;
      const dir = Math.random()*Math.PI*2;
      _whale.sx = ctx.headPos.x + Math.cos(dir)*WHALE_SPAWN_DIST;
      _whale.sy = ctx.spawnEyeY*0.9;
      _whale.sz = ctx.headPos.z + Math.sin(dir)*WHALE_SPAWN_DIST;
      _whale.ex = ctx.headPos.x - Math.cos(dir)*WHALE_SPAWN_DIST;
      _whale.ey = ctx.spawnEyeY*0.9;
      _whale.ez = ctx.headPos.z - Math.sin(dir)*WHALE_SPAWN_DIST;
      _whale.timer = 0;
      _whale.phase = 'spawning';
      _whale.mesh  = models.whale.clone();
      _whale.mesh.traverse(c => {
        if (c.isMesh && c.material) {
          c.material = c.material.clone();
          c.material.uniforms.uTime = _uTime;   // clone이 끊은 전역 시간 참조 복구
          c.material.uniforms.uOpacity.value = 0;
        }
      });
      scene.add(_whale.mesh);
      ctx.spawnState.whaleSpawned = true;
      playWhaleSound(_whale.sx, _whale.sy, _whale.sz);
      if (DEBUG) console.log('[whale] 시퀀스 시작');
    }

    function updateWhale(timestamp, dt) {
      const now = timestamp / 1000;

      // 게이지 완성 시 소환 (안전망: 게이지 미완성이어도 4분 경과 시 등장)
      if (_whale.phase === 'idle' && !ctx.spawnState.whaleSpawned &&
          (_gauge.full || ctx.sessionTime >= SPAWN_WHALE_TIME + 60)) {
        _triggerWhale();
      }

      if (_whale.phase === 'idle' || _whale.phase === 'done' || !_whale.mesh) return;
      _whale.timer += dt;

      const totalDist = Math.hypot(_whale.ex-_whale.sx, _whale.ey-_whale.sy, _whale.ez-_whale.sz);
      const travelTime = totalDist / WHALE_SPEED;

      if (_whale.phase === 'spawning') {
        const op = Math.min(_whale.timer/WHALE_FADE_DUR, 1.0);
        _whale.mesh.traverse(c => { if (c.isMesh&&c.material) c.material.uniforms.uOpacity.value = op; });
        if (_whale.timer >= WHALE_FADE_DUR) { _whale.phase='passing'; _whale.timer=0; }

      } else if (_whale.phase === 'passing') {
        const p = Math.min(_whale.timer/travelTime, 1.0);
        _whale.mesh.position.set(
          _whale.sx+(_whale.ex-_whale.sx)*p,
          _whale.sy + Math.sin(now*0.5)*0.05,
          _whale.sz+(_whale.ez-_whale.sz)*p
        );
        _whale.mesh.rotation.y =
          Math.atan2(_whale.ex-_whale.sx, _whale.ez-_whale.sz) + Math.sin(now*0.8)*0.05;
        if (p >= 1.0) { _whale.phase='fading'; _whale.timer=0; }

      } else if (_whale.phase === 'fading') {
        const op = Math.max(1.0-_whale.timer/WHALE_FADE_DUR, 0);
        _whale.mesh.traverse(c => { if (c.isMesh&&c.material) c.material.uniforms.uOpacity.value = op; });
        if (_whale.timer >= WHALE_FADE_DUR) {
          scene.remove(_whale.mesh); _whale.mesh=null; _whale.phase='done';
          if (DEBUG) console.log('[whale] 시퀀스 종료');
        }
      }
    }

    // ─────────────────────────────────────────────────────────────
    // C22 — WHALE GAUGE  (공중의 빛 고리 — 채우면 고래가 온다)
    // 모든 제스처(터치·트레일·핀치·오브·노래)가 한 게이지에 기여 →
    // "무엇을 해야 하나"가 첫 1분 안에 보이는 디제틱 목표
    // ─────────────────────────────────────────────────────────────

    const _gaugeVert = `
      attribute float aFrac;
      uniform float uProgress;
      varying float vFrac;
      void main() {
        vFrac = aFrac;
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        // 채워진 입자는 더 크게 — 진행이 멀리서도 읽히도록
        float filled = step(aFrac, uProgress);
        gl_PointSize = clamp(18.0 / max(0.5, -mv.z), 4.0, 14.0) * mix(0.7, 1.35, filled);
        gl_Position = projectionMatrix * mv;
      }
    `;
    const _gaugeFrag = `
      uniform float uTime;
      uniform float uProgress;
      uniform float uPulseT;
      uniform float uFade;
      varying float vFrac;
      void main() {
        float r = length(gl_PointCoord - vec2(0.5));
        if (r > 0.5) discard;
        float glow   = exp(-r * r * 10.0);
        float filled = step(vFrac, uProgress);
        float tw     = 0.75 + 0.25 * sin(uTime * 2.0 + vFrac * 40.0);
        float pulse  = exp(-max(uTime - uPulseT, 0.0) * 3.0);
        float edge   = smoothstep(0.05, 0.0, abs(vFrac - uProgress));   // 진행 선두 강조
        // 채움: 금빛 반짝임 / 미채움: 어두운 시안 윤곽 (목표의 형태가 보임)
        vec3 col = mix(vec3(0.35, 0.70, 1.0), vec3(1.0, 0.85, 0.45) * tw + vec3(pulse * 0.5), filled);
        float a  = mix(0.10, 0.85 * tw + pulse * 0.4, filled) + edge * 0.9;
        gl_FragColor = vec4(col, a * glow * uFade);
      }
    `;

    const _gauge = {
      progress: 0, full: false, mesh: null, mat: null,
      pos: new THREE.Vector3(0, 1.7, -1.6),
      trailSeen: 0,
    };
    const _gaugeFwd = new THREE.Vector3();

    function initWhaleGauge() {
      if (_gauge.mesh) return;
      const pos  = new Float32Array(GAUGE_PTS * 3);
      const frac = new Float32Array(GAUGE_PTS);
      for (let i = 0; i < GAUGE_PTS; i++) {
        const f = i / GAUGE_PTS;
        const a = Math.PI / 2 - f * Math.PI * 2;   // 12시 방향부터 시계방향
        pos[i*3]   = Math.cos(a) * GAUGE_R;
        pos[i*3+1] = Math.sin(a) * GAUGE_R;
        pos[i*3+2] = 0;
        frac[i] = f;
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      geo.setAttribute('aFrac',    new THREE.BufferAttribute(frac, 1));
      _gauge.mat = new THREE.ShaderMaterial({
        uniforms: {
          uTime:     _uTime,
          uProgress: { value: 0 },
          uPulseT:   { value: -10 },
          uFade:     { value: 1 },
        },
        vertexShader: _gaugeVert, fragmentShader: _gaugeFrag,
        transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
      });
      _gauge.mesh = new THREE.Points(geo, _gauge.mat);
      _gauge.mesh.frustumCulled = false;
      scene.add(_gauge.mesh);
    }

    function gaugeAdd(v, pulse = true) {
      if (_gauge.full) return;
      _gauge.progress = Math.min(_gauge.progress + v, 1.0);
      if (pulse && _gauge.mat) _gauge.mat.uniforms.uPulseT.value = _uTime.value;
      if (_gauge.progress >= 1.0) _gaugeComplete();
    }

    function _gaugeComplete() {
      _gauge.full = true;
      const p = _gauge.pos;
      triggerBubbleBurst(p.x, p.y, p.z);
      triggerShockwaveRing(p.x, p.y, p.z);
      playShockwaveSound(p.x, p.y, p.z);
      if (DEBUG) console.log('[gauge] 완성 → 고래 소환');
    }

    function updateGauge(dt) {
      if (!_gauge.mesh) return;

      // 시선 방향 전방을 느리게 따라붙음 (시야에서 사라지지 않게)
      camera.getWorldDirection(_gaugeFwd);
      _gaugeFwd.y = 0;
      if (_gaugeFwd.lengthSq() < 0.001) _gaugeFwd.set(0, 0, -1);
      _gaugeFwd.normalize();
      const tx = ctx.headPos.x + _gaugeFwd.x * GAUGE_DIST;
      const ty = ctx.spawnEyeY + 0.25;
      const tz = ctx.headPos.z + _gaugeFwd.z * GAUGE_DIST;
      const k = 1.0 - Math.pow(0.25, dt);   // 프레임레이트 무관 lerp
      _gauge.pos.x += (tx - _gauge.pos.x) * k;
      _gauge.pos.y += (ty - _gauge.pos.y) * k;
      _gauge.pos.z += (tz - _gauge.pos.z) * k;
      _gauge.mesh.position.copy(_gauge.pos);
      _gauge.mesh.lookAt(ctx.headPos);

      // 연속 기여: 트레일 거리 / SING
      while (ctx.counters.trailLength >= _gauge.trailSeen + 0.5) {
        _gauge.trailSeen += 0.5;
        gaugeAdd(GAIN_TRAIL);
      }
      if (ctx.voiceHeld === 'sing') gaugeAdd(GAIN_SING * dt, false);

      _gauge.mat.uniforms.uProgress.value = _gauge.progress;

      // 완성 후 서서히 사라짐 (고래에게 무대를 넘김)
      if (_gauge.full) {
        _gauge.mat.uniforms.uFade.value = Math.max(_gauge.mat.uniforms.uFade.value - dt * 0.7, 0);
      }
    }

    // ─────────────────────────────────────────────────────────────
    // C23 — GUIDE FISH  (온보딩 — 황금 물고기가 트레일 그리기를 시연)
    // ─────────────────────────────────────────────────────────────

    const _guide = {
      state: 'none',   // none → enter → demo → wait → reward → free
      mesh: null, mat: null,
      t: 0, demoAngle: 0, rewarded: false, lastTouch: -10,
      x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0, ry: 0,
      cx: 0, cy: 0, cz: 0,             // 데모 원 중심
      wpx: 0, wpy: 0, wpz: 0, wpT: 0,  // free 상태 waypoint
    };
    const _gFwd = new THREE.Vector3();

    // 가이드 트레일 (금빛 점 리본)
    const GUIDE_TRAIL_MAX = 80;
    let _gtMesh = null;
    let _gtPts  = [];
    const _gtVert = `
      attribute float age;
      varying float vN;
      void main() {
        vN = clamp(age / 2.5, 0.0, 1.0);
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        gl_PointSize = clamp(9.0 / max(0.4, -mv.z), 2.0, 9.0) * (1.0 - vN * 0.6);
        gl_Position = projectionMatrix * mv;
      }
    `;
    const _gtFrag = `
      varying float vN;
      void main() {
        float r = length(gl_PointCoord - vec2(0.5));
        if (r > 0.5) discard;
        float glow = exp(-r * r * 12.0);
        vec3 col = mix(vec3(1.0, 0.9, 0.5), vec3(1.0, 0.6, 0.3), vN);
        gl_FragColor = vec4(col, glow * (1.0 - vN) * 0.85);
      }
    `;

    function spawnGuideFish() {
      if (!models.fishS) return;
      if (_guide.mesh) { _resetGuide(); return; }   // 세션 재진입: 상태만 리셋

      const src = models.fishS.children[0];
      const geo = src.geometry.clone();
      geo.deleteAttribute('aPhase');                 // 인스턴스 어트리뷰트 제거 (일반 Mesh용)
      geo.deleteAttribute('aFlash');
      const mat = src.material.clone();
      if (mat.uniforms) {
        mat.uniforms.uTime  = _uTime;                // clone이 끊은 공유 참조 복구
        mat.uniforms.uVoice = _uVoice;
        mat.uniforms.uTint.value.setRGB(1.9, 1.5, 0.75);   // 황금빛
      } else {
        mat.color = new THREE.Color(0xffcc55);       // 더미 폴백
      }
      _guide.mesh = new THREE.Mesh(geo, mat);
      _guide.mesh.frustumCulled = false;
      _guide.mat = mat;
      scene.add(_guide.mesh);

      const gtGeo = new THREE.BufferGeometry();
      gtGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(GUIDE_TRAIL_MAX * 3), 3));
      gtGeo.setAttribute('age',      new THREE.BufferAttribute(new Float32Array(GUIDE_TRAIL_MAX), 1));
      gtGeo.setDrawRange(0, 0);
      _gtMesh = new THREE.Points(gtGeo, new THREE.ShaderMaterial({
        vertexShader: _gtVert, fragmentShader: _gtFrag,
        transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
      }));
      _gtMesh.frustumCulled = false;
      scene.add(_gtMesh);

      _resetGuide();
    }

    function _resetGuide() {
      _guide.state = 'enter';
      _guide.t = 0; _guide.demoAngle = 0; _guide.rewarded = false;
      _guide.x = ctx.headPos.x + 1.2;
      _guide.y = ctx.spawnEyeY + 0.2;
      _guide.z = ctx.headPos.z - 1.4;
      _guide.vx = _guide.vy = _guide.vz = 0;
      _gtPts.length = 0;
      if (_guide.mesh) _guide.mesh.visible = true;
    }

    function _guideDemoCenter() {
      camera.getWorldDirection(_gFwd);
      _gFwd.y = 0;
      if (_gFwd.lengthSq() < 0.001) _gFwd.set(0, 0, -1);
      _gFwd.normalize();
      _guide.cx = ctx.headPos.x + _gFwd.x * 0.9;
      _guide.cy = ctx.spawnEyeY - 0.05;
      _guide.cz = ctx.headPos.z + _gFwd.z * 0.9;
    }

    function _guideTrailAdd(now) {
      const last = _gtPts[_gtPts.length - 1];
      if (last && Math.hypot(_guide.x - last.x, _guide.y - last.y, _guide.z - last.z) < 0.025) return;
      _gtPts.push({ x: _guide.x, y: _guide.y, z: _guide.z, t: now });
      if (_gtPts.length > GUIDE_TRAIL_MAX) _gtPts.shift();
    }

    function _guideTrailUpdate(now) {
      if (!_gtMesh) return;
      _gtPts = _gtPts.filter(p => now - p.t < 2.5);
      const pos = _gtMesh.geometry.attributes.position.array;
      const age = _gtMesh.geometry.attributes.age.array;
      for (let i = 0; i < _gtPts.length; i++) {
        pos[i*3] = _gtPts[i].x; pos[i*3+1] = _gtPts[i].y; pos[i*3+2] = _gtPts[i].z;
        age[i] = now - _gtPts[i].t;
      }
      _gtMesh.geometry.attributes.position.needsUpdate = true;
      _gtMesh.geometry.attributes.age.needsUpdate      = true;
      _gtMesh.geometry.setDrawRange(0, _gtPts.length);
    }

    function updateGuideFish(timestamp, dt) {
      if (!_guide.mesh || _guide.state === 'none') return;
      const now = timestamp / 1000;
      const g = _guide;
      g.t += dt;

      // 사용자가 그리기 시작했으면 기쁨의 보상 (1회)
      if (!g.rewarded && g.state !== 'enter' && ctx.counters.trailLength > 0.4) {
        g.state = 'reward'; g.t = 0; g.rewarded = true;
      }

      if (g.state === 'enter') {
        // 사용자 전방 0.9m 지점으로 헤엄쳐 들어옴
        _guideDemoCenter();
        _steerToward(g, g.cx, g.cy, g.cz, 2.5, dt);
        _clampSpeed(g, 0.7);
        g.x += g.vx*dt; g.y += g.vy*dt; g.z += g.vz*dt;
        const s = Math.sqrt(g.vx*g.vx + g.vz*g.vz);
        if (s > 0.02) g.ry = Math.atan2(g.vx, g.vz);
        if (Math.hypot(g.x-g.cx, g.y-g.cy, g.z-g.cz) < 0.18) { g.state='demo'; g.t=0; g.demoAngle=0; }

      } else if (g.state === 'demo') {
        // 사용자 앞에서 원을 그리며 트레일 시연 (2바퀴)
        g.demoAngle += dt * 2.4;
        const r  = 0.25;
        const px = g.x, pz = g.z;
        g.x = g.cx + Math.cos(g.demoAngle) * r;
        g.y = g.cy + Math.sin(g.demoAngle * 2.0) * 0.05;
        g.z = g.cz + Math.sin(g.demoAngle) * r;
        if (Math.hypot(g.x-px, g.z-pz) > 1e-4) g.ry = Math.atan2(g.x-px, g.z-pz);
        _guideTrailAdd(now);
        if (g.demoAngle >= Math.PI * 4) { g.state='wait'; g.t=0; }

      } else if (g.state === 'wait') {
        // 호버하며 대기, 반응 없으면 6초마다 재시연
        g.x += (g.cx - g.x) * 0.5 * dt;
        g.z += (g.cz - g.z) * 0.5 * dt;
        g.y = g.cy + Math.sin(now * 1.8) * 0.03;
        if (g.t > 6) { _guideDemoCenter(); g.state='demo'; g.t=0; g.demoAngle=0; }

      } else if (g.state === 'reward') {
        // 기쁨의 나선 상승 + 빛 알갱이 보상
        g.demoAngle += dt * 7.0;
        const r = 0.12;
        const px = g.x, pz = g.z;
        g.x = g.cx + Math.cos(g.demoAngle) * r;
        g.z = g.cz + Math.sin(g.demoAngle) * r;
        g.y += dt * 0.25;
        if (Math.hypot(g.x-px, g.z-pz) > 1e-4) g.ry = Math.atan2(g.x-px, g.z-pz);
        _guideTrailAdd(now);
        if (g.t > 1.4) {
          spawnLightMote(g.x, g.y, g.z);
          spawnLightMote(g.x + 0.06, g.y - 0.04, g.z);
          playHatchSound(g.x, g.y, g.z);
          g.state = 'free'; g.t = 0; g.wpT = 0;
        }

      } else if (g.state === 'free') {
        // 일반 물고기처럼 주변을 유영 (계속 터치 가능한 황금 물고기)
        g.wpT -= dt;
        if (g.wpT <= 0 || Math.hypot(g.x-g.wpx, g.y-g.wpy, g.z-g.wpz) < 0.15) {
          const [wx, wy, wz] = _randomSpawnPos();
          g.wpx = wx; g.wpy = wy; g.wpz = wz;
          g.wpT = 5 + Math.random() * 5;
        }
        _steerToward(g, g.wpx, g.wpy, g.wpz, 2.0, dt);
        _clampSpeed(g, 0.5);
        g.x += g.vx*dt; g.y += g.vy*dt; g.z += g.vz*dt;
        const s = Math.sqrt(g.vx*g.vx + g.vz*g.vz);
        if (s > 0.02) g.ry = Math.atan2(g.vx, g.vz);
      }

      // 터치 반응 (모든 상태에서 — 가이드는 보상이 후함)
      if (now - g.lastTouch > TOUCH_COOLDOWN) {
        for (const h of _touchPoints()) {
          if (Math.hypot(g.x-h.x, g.y-h.y, g.z-h.z) < TOUCH_R_S + 0.02) {
            g.lastTouch = now;
            if (g.mat.uniforms?.uFlashT) g.mat.uniforms.uFlashT.value = now;
            spawnLightMote(g.x, g.y, g.z);
            playTouchSound(g.x, g.y, g.z, 0);
            break;
          }
        }
      }

      g.mesh.position.set(g.x, g.y, g.z);
      g.mesh.rotation.y = g.ry;
      _guideTrailUpdate(now);
    }

    // ─────────────────────────────────────────────────────────────
    // C16 — SPAWN MANAGER + EGG SYSTEM
    // ─────────────────────────────────────────────────────────────

    const _spawnThr = {
      fishMNextPinch: SPAWN_PINCH_FIRST,
      fishSNextTrail: SPAWN_TRAIL_STEP,
      jellyNextVoice: SPAWN_VOICE_FIRST,
      fishLTriggered: false,
    };

    function _resetSpawnThresholds() {
      _spawnThr.fishMNextPinch = SPAWN_PINCH_FIRST;
      _spawnThr.fishSNextTrail = SPAWN_TRAIL_STEP;
      _spawnThr.jellyNextVoice = SPAWN_VOICE_FIRST;
      _spawnThr.fishLTriggered = false;
    }

    // ── 알(Egg) 시스템 ───────────────────────────────────────────

    const _eggs = [];
    const _eggFwd = new THREE.Vector3();

    function _makeEggGroup(col) {
      const g = new THREE.Group();
      const mk = (r, type, alpha) => {
        const m = new THREE.Mesh(
          new THREE.SphereGeometry(r, 20, 20),
          _makeGlowMat(col, type, alpha)
        );
        g.add(m);
        return m;
      };
      g.userData.rim  = mk(0.095, 'irid', 0.85);  // 무지개빛 비눗방울 막
      return g;
    }

    function _spawnEgg(type, hatchDur = EGG_HATCH_DUR) {
      if (_eggs.length >= EGG_MAX) return;

      camera.getWorldDirection(_eggFwd);
      // 수평 방향만 사용, 수직 성분 제거
      _eggFwd.y = 0;
      if (_eggFwd.lengthSq() < 0.001) _eggFwd.set(0, 0, -1);
      _eggFwd.normalize();

      // 살짝 랜덤 옆 오프셋 — 여러 알이 겹치지 않게
      const spread = (Math.random() - 0.5) * 0.5;
      const ex = ctx.headPos.x + _eggFwd.x * EGG_SPAWN_DIST - _eggFwd.z * spread;
      const ey = ctx.headPos.y;
      const ez = ctx.headPos.z + _eggFwd.z * EGG_SPAWN_DIST + _eggFwd.x * spread;

      const col   = EGG_COLORS[type] ?? 0xffffff;
      const group = _makeEggGroup(col);
      group.scale.setScalar(0);
      group.position.set(ex, ey, ez);
      scene.add(group);

      _eggs.push({ type, x: ex, y: ey, z: ez, timer: 0, hatchDur, group });
      if (DEBUG) console.log(`[egg] ${type} 소환 (${ex.toFixed(2)}, ${ey.toFixed(2)}, ${ez.toFixed(2)})`);
    }

    function updateEggs(dt) {
      for (let i = _eggs.length - 1; i >= 0; i--) {
        const e = _eggs[i];
        e.timer += dt;
        const prog = Math.min(e.timer / e.hatchDur, 1.0);

        // 부화 처리
        if (prog >= 1.0) {
          triggerBubbleBurst(e.x, e.y, e.z);
          playHatchSound(e.x, e.y, e.z);
          if      (e.type === 'fishS')     spawnFishS(e.x, e.y, e.z);
          else if (e.type === 'fishM')     spawnFishM(e.x, e.y, e.z);
          else if (e.type === 'fishL')     spawnFishL(e.x, e.y, e.z);
          else if (e.type === 'jellyfish') spawnJellyfish(e.x, e.y, e.z);
          scene.remove(e.group);
          _eggs.splice(i, 1);
          if (DEBUG) console.log(`[egg] ${e.type} 부화`);
          continue;
        }

        // 크기: 처음에 빠르게 등장, 이후 유지
        const baseScale = 0.3 + 0.7 * Math.min(prog * 5, 1.0);

        // 맥박 속도가 부화에 가까울수록 빨라짐
        const pulseSpeed = 2.0 + prog * 8.0;
        const pulseAmp   = 0.08 + prog * 0.12;
        const pulse = 1.0 + Math.sin(e.timer * pulseSpeed) * pulseAmp;

        e.group.scale.setScalar(baseScale * pulse);

        // 부화 직전(85%) — 림이 강하게 깜빡임
        if (prog > 0.85) {
          const flash = 0.5 + 0.5 * Math.sin(e.timer * 20);
          e.group.userData.rim.material.uniforms.uAlpha.value  = 0.55 + flash * 0.45;
        }
      }
    }

    // ── 임계값 이벤트 핸들러 ─────────────────────────────────────

    // C01에서 핀치마다 호출
    function onPinchEvent() {
      gaugeAdd(GAIN_PINCH);
      if (ctx.counters.pinchTotal >= _spawnThr.fishMNextPinch && ctx.spawnState.fishMCount < 3) {
        _spawnEgg('fishM');
        _spawnThr.fishMNextPinch += SPAWN_PINCH_STEP;
      }
    }

    // C03에서 궤적 누적마다 호출
    function onTrailLengthUpdate() {
      if (ctx.counters.trailLength >= _spawnThr.fishSNextTrail && ctx.spawnState.fishSCount < 7) {
        _spawnEgg('fishS');
        _spawnThr.fishSNextTrail += SPAWN_TRAIL_STEP;
      }
    }

    function updateSpawnManager() {
      // 음성 누적 → 해파리 알
      if (ctx.counters.voiceSec >= _spawnThr.jellyNextVoice && ctx.spawnState.jellyCount < 4) {
        _spawnEgg('jellyfish');
        _spawnThr.jellyNextVoice += SPAWN_VOICE_STEP;
      }

      // 핀치×15 + 중형×3 → 대형 물고기 알 1개
      if (!_spawnThr.fishLTriggered &&
          ctx.counters.pinchTotal >= SPAWN_LARGE_PINCH &&
          ctx.spawnState.fishMCount >= SPAWN_LARGE_MED) {
        _spawnEgg('fishL');
        _spawnThr.fishLTriggered = true;
      }
    }

    // ─────────────────────────────────────────────────────────────
    // C19 — SPATIAL AUDIO  (Web Audio API — 파일 없이 합성음)
    // ─────────────────────────────────────────────────────────────

    // _audioCtx 는 C17 VoiceAnalyzer에서 초기화됨 (공유)

    function _updateAudioListenerPos() {
      if (!_audioCtx) return;
      const p = ctx.headPos;
      // 브라우저 호환: AudioParam 방식과 구형 setPosition 방식 모두 처리
      if (_audioCtx.listener.positionX) {
        _audioCtx.listener.positionX.value = p.x;
        _audioCtx.listener.positionY.value = p.y;
        _audioCtx.listener.positionZ.value = p.z;
      } else {
        try { _audioCtx.listener.setPosition(p.x, p.y, p.z); } catch(_) {}
      }
    }

    function _audioReady() { return _audioCtx && _audioCtx.state === 'running'; }

    function _makePanner(x, y, z, refDist, rolloff) {
      const pan = _audioCtx.createPanner();
      pan.panningModel    = 'HRTF';
      pan.positionX.value = x;
      pan.positionY.value = y;
      pan.positionZ.value = z;
      pan.refDistance     = refDist;
      pan.rolloffFactor   = rolloff;
      return pan;
    }

    function _makeNoiseBuffer(durSec, shape) {
      const len = Math.max(1, Math.floor(_audioCtx.sampleRate * durSec));
      const buf = _audioCtx.createBuffer(1, len, _audioCtx.sampleRate);
      const d   = buf.getChannelData(0);
      for (let i = 0; i < len; i++) {
        const n = Math.random() * 2 - 1;
        d[i] = shape ? n * shape(i / len) : n;
      }
      return buf;
    }

    function playPinchSound(x, y, z) {
      if (!_audioReady()) return;
      try {
        const t    = _audioCtx.currentTime;
        const osc  = _audioCtx.createOscillator();
        const gain = _audioCtx.createGain();
        const pan  = _makePanner(x, y, z, 0.3, 2);
        osc.connect(gain); gain.connect(pan); pan.connect(_audioCtx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, t);
        osc.frequency.exponentialRampToValueAtTime(440, t + 0.3);
        gain.gain.setValueAtTime(0.22, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.45);
        osc.start(t); osc.stop(t + 0.45);
      } catch(_) {}
    }

    // ── Event 2: Fist release → bubble burst ──
    // 짧고 폭발적인 노이즈 버스트(밴드패스 스윕)로 거품이 터지는 느낌
    function playBurstSound(x, y, z) {
      if (!_audioReady()) return;
      try {
        const t   = _audioCtx.currentTime;
        const dur = 0.35;
        const src = _audioCtx.createBufferSource();
        src.buffer = _makeNoiseBuffer(dur);
        const bp = _audioCtx.createBiquadFilter();
        bp.type  = 'bandpass';
        bp.frequency.setValueAtTime(400, t);
        bp.frequency.exponentialRampToValueAtTime(2400, t + 0.15);
        bp.Q.value = 6;
        const gain = _audioCtx.createGain();
        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.exponentialRampToValueAtTime(0.5, t + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
        const pan = _makePanner(x, y, z, 0.4, 2);
        src.connect(bp); bp.connect(gain); gain.connect(pan); pan.connect(_audioCtx.destination);
        src.start(t); src.stop(t + dur);
      } catch(_) {}
    }

    // ── Event 4: Two-hand spread → shockwave ring ──
    // 저주파 sine 슬라이드(180→50Hz)로 '쿵' + 고역 노이즈 테일로 확산감
    function playShockwaveSound(x, y, z) {
      if (!_audioReady()) return;
      try {
        const t   = _audioCtx.currentTime;
        const pan = _makePanner(x, y, z, 0.5, 1.5);

        const osc = _audioCtx.createOscillator();
        osc.type  = 'sine';
        osc.frequency.setValueAtTime(180, t);
        osc.frequency.exponentialRampToValueAtTime(50, t + 0.5);
        const g1 = _audioCtx.createGain();
        g1.gain.setValueAtTime(0.0001, t);
        g1.gain.exponentialRampToValueAtTime(0.55, t + 0.02);
        g1.gain.exponentialRampToValueAtTime(0.001, t + 0.7);
        osc.connect(g1); g1.connect(pan);

        const src = _audioCtx.createBufferSource();
        src.buffer = _makeNoiseBuffer(0.6);
        const hp = _audioCtx.createBiquadFilter();
        hp.type = 'highpass';
        hp.frequency.value = 3000;
        const g2 = _audioCtx.createGain();
        g2.gain.setValueAtTime(0.0001, t);
        g2.gain.exponentialRampToValueAtTime(0.15, t + 0.1);
        g2.gain.exponentialRampToValueAtTime(0.001, t + 0.55);
        src.connect(hp); hp.connect(g2); g2.connect(pan);

        pan.connect(_audioCtx.destination);
        osc.start(t); osc.stop(t + 0.7);
        src.start(t); src.stop(t + 0.6);
      } catch(_) {}
    }

    // ── 물고기 터치: 크기별 음높이의 짧은 차임 ──
    function playTouchSound(x, y, z, size) {
      if (!_audioReady()) return;
      try {
        const t    = _audioCtx.currentTime;
        const base = [1320, 990, 660][size] ?? 1100;
        const osc  = _audioCtx.createOscillator();
        const gain = _audioCtx.createGain();
        const pan  = _makePanner(x, y, z, 0.3, 2);
        osc.connect(gain); gain.connect(pan); pan.connect(_audioCtx.destination);
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(base, t);
        osc.frequency.exponentialRampToValueAtTime(base * 0.75, t + 0.18);
        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.exponentialRampToValueAtTime(0.18, t + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
        osc.start(t); osc.stop(t + 0.22);
      } catch(_) {}
    }

    // ── 빛 알갱이 수집: 상승 블립 ──
    function playCollectSound(x, y, z) {
      if (!_audioReady()) return;
      try {
        const t    = _audioCtx.currentTime;
        const osc  = _audioCtx.createOscillator();
        const gain = _audioCtx.createGain();
        const pan  = _makePanner(x, y, z, 0.3, 2);
        osc.connect(gain); gain.connect(pan); pan.connect(_audioCtx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(1500, t);
        osc.frequency.exponentialRampToValueAtTime(2200, t + 0.10);
        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.exponentialRampToValueAtTime(0.14, t + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.14);
        osc.start(t); osc.stop(t + 0.14);
      } catch(_) {}
    }

    // ── Event 8: Egg hatch ──
    // 부드러운 트라이앵글 chime(1320→880Hz) + 짧은 밴드패스 노이즈 pop
    function playHatchSound(x, y, z) {
      if (!_audioReady()) return;
      try {
        const t   = _audioCtx.currentTime;
        const pan = _makePanner(x, y, z, 0.4, 2);

        const osc = _audioCtx.createOscillator();
        osc.type  = 'triangle';
        osc.frequency.setValueAtTime(1320, t);
        osc.frequency.exponentialRampToValueAtTime(880, t + 0.3);
        const g = _audioCtx.createGain();
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.32, t + 0.01);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
        osc.connect(g); g.connect(pan);

        const src = _audioCtx.createBufferSource();
        src.buffer = _makeNoiseBuffer(0.1, n => Math.exp(-n * 30));
        const bp = _audioCtx.createBiquadFilter();
        bp.type = 'bandpass';
        bp.frequency.value = 1800;
        bp.Q.value = 3;
        const g2 = _audioCtx.createGain();
        g2.gain.value = 0.2;
        src.connect(bp); bp.connect(g2); g2.connect(pan);

        pan.connect(_audioCtx.destination);
        osc.start(t); osc.stop(t + 0.45);
        src.start(t); src.stop(t + 0.1);
      } catch(_) {}
    }

    // ── Event 9: Whale arrival ──
    // 저음 sine(65Hz) + 2배음(130Hz), 느린 LFO 바이브라토, 긴 어택·릴리스로 4초 지속
    function playWhaleSound(x, y, z) {
      if (!_audioReady()) return;
      try {
        const t   = _audioCtx.currentTime;
        const dur = 4.0;
        const pan = _makePanner(x, y, z, 1.0, 0.8);

        const o1 = _audioCtx.createOscillator();
        o1.type = 'sine'; o1.frequency.value = 65;
        const lfo = _audioCtx.createOscillator();
        lfo.type = 'sine'; lfo.frequency.value = 0.3;
        const lfoGain = _audioCtx.createGain();
        lfoGain.gain.value = 6;
        lfo.connect(lfoGain); lfoGain.connect(o1.frequency);

        const o2 = _audioCtx.createOscillator();
        o2.type = 'sine'; o2.frequency.value = 130;

        const g1 = _audioCtx.createGain();
        g1.gain.setValueAtTime(0.0001, t);
        g1.gain.exponentialRampToValueAtTime(0.5, t + 1.2);
        g1.gain.exponentialRampToValueAtTime(0.001, t + dur);
        const g2 = _audioCtx.createGain();
        g2.gain.setValueAtTime(0.0001, t);
        g2.gain.exponentialRampToValueAtTime(0.15, t + 1.5);
        g2.gain.exponentialRampToValueAtTime(0.001, t + dur);

        o1.connect(g1); g1.connect(pan);
        o2.connect(g2); g2.connect(pan);
        pan.connect(_audioCtx.destination);

        o1.start(t); o2.start(t); lfo.start(t);
        o1.stop(t + dur); o2.stop(t + dur); lfo.stop(t + dur);
      } catch(_) {}
    }

    // ─────────────────────────────────────────────────────────────
    // HAND TRACKING  (WebXR Hand Tracking API)
    // ─────────────────────────────────────────────────────────────

    const _JOINT_MAP = [
      ['thumb-tip',         'thumbTip'],
      ['index-finger-tip',  'indexTip'],
      ['middle-finger-tip', 'middleTip'],
      ['ring-finger-tip',   'ringTip'],
      ['pinky-finger-tip',  'pinkyTip'],
    ];

    function updateHandTracking(frame) {
      const refSpace = renderer.xr.getReferenceSpace();
      if (!refSpace) return;
      const session = renderer.xr.getSession();
      if (!session) return;

      ctx.handJoints.left.valid  = false;
      ctx.handJoints.right.valid = false;

      for (const src of session.inputSources) {
        if (!src.hand) continue;
        const side   = src.handedness;
        const joints = ctx.handJoints[side];
        if (!joints) continue;

        const wristSpace = src.hand.get('wrist');
        if (wristSpace) {
          const wp = frame.getJointPose(wristSpace, refSpace);
          if (wp) {
            const { position: p, orientation: o } = wp.transform;
            joints.wrist.pos.set(p.x, p.y, p.z);
            joints.wrist.quat.set(o.x, o.y, o.z, o.w);
          }
        }

        let allValid = true;
        for (const [xrName, key] of _JOINT_MAP) {
          const jSpace = src.hand.get(xrName);
          if (!jSpace) { allValid = false; continue; }
          const jp = frame.getJointPose(jSpace, refSpace);
          if (!jp)    { allValid = false; continue; }
          const p = jp.transform.position;
          joints[key].set(p.x, p.y, p.z);
        }
        joints.valid = allValid;
      }
    }

    // ─────────────────────────────────────────────────────────────
    // RENDER LOOP
    // ─────────────────────────────────────────────────────────────

    let prevTimestamp = 0;

    renderer.setAnimationLoop((timestamp, frame) => {
      const dt = prevTimestamp === 0
        ? 0
        : Math.min((timestamp - prevTimestamp) / 1000, 0.05);
      prevTimestamp = timestamp;

      if (frame) {
        const refSpace = renderer.xr.getReferenceSpace();
        if (refSpace) {
          const vp = frame.getViewerPose(refSpace);
          if (vp) {
            const p = vp.transform.position;
            ctx.headPos.set(p.x, p.y, p.z);
            if (!ctx.calibrated && p.y > 0.3) {
              ctx.spawnEyeY  = p.y;
              ctx.calibrated = true;
              if (DEBUG) console.log(`[calibrated] eyeY=${p.y.toFixed(2)}`);
            }
          }
        }

        updateHandTracking(frame);
      }

      if (frame || FLAT) {
        ctx.sessionTime += dt;

        // ── Phase 2: 입력 레이어 ─────────────────────────────────
        updateVoiceAnalyzer(dt);
        updatePinchGesture();
        updatePointerDot();
        updateHandTrail(timestamp);
        updateFistRelease(dt);
        updateTwoHandGesture(dt);

        // ── Phase 3: VFX 레이어 ──────────────────────────────────
        updateAtmosphere(timestamp, dt);   // 전역 uTime/uVoice 유니폼 갱신 포함
        updateFoodParticle(timestamp, dt);
        updateBubbleBurst(timestamp, dt);
        updateGlowOrb(timestamp, dt);
        updateOrbAccretion(timestamp, dt);
        updateRingEffect(timestamp, dt);
        updateAmbientEnvironment(timestamp, dt);
        updateEggs(dt);

        // ── Phase 4: 크리처 레이어 ───────────────────────────────
        updateFishSchool(timestamp, dt);
        updateFishLarge(timestamp, dt);
        updateGuideFish(timestamp, dt);
        updateFishTouch(timestamp, dt);
        updateJellyfish(timestamp, dt);
        updateWhale(timestamp, dt);

        // ── Phase 5: 시스템 레이어 ───────────────────────────────
        updateMotes(timestamp, dt);
        updateGauge(dt);
        updateSpawnManager();
        _updateAudioListenerPos();

        if (DEBUG) {
          const lj = ctx.handJoints.left;
          const rj = ctx.handJoints.right;
          dbgEl.innerHTML =
            `t=${ctx.sessionTime.toFixed(1)}s  voice:<b>${ctx.voiceHeld}</b><br>` +
            `L: ${lj.valid ? `✓ idx(${lj.indexTip.x.toFixed(2)},${lj.indexTip.y.toFixed(2)},${lj.indexTip.z.toFixed(2)})` : '–'}<br>` +
            `R: ${rj.valid ? `✓ idx(${rj.indexTip.x.toFixed(2)},${rj.indexTip.y.toFixed(2)},${rj.indexTip.z.toFixed(2)})` : '–'}<br>` +
            `pinch:${ctx.counters.pinchTotal}  trail:${ctx.counters.trailLength.toFixed(1)}m<br>` +
            `voice:${ctx.counters.voiceSec.toFixed(0)}s  sing:${ctx.counters.singSec.toFixed(0)}s<br>` +
            `fishS:${ctx.spawnState.fishSCount} M:${ctx.spawnState.fishMCount} L:${ctx.spawnState.fishLCount} jelly:${ctx.spawnState.jellyCount}<br>` +
            `eggs:${_eggs.length}  whale:${_whale.phase}  t:${ctx.sessionTime.toFixed(0)}s<br>` +
            `gauge:${(_gauge.progress * 100).toFixed(0)}%  motes:${_motes.length}  guide:${_guide.state}`;
        }
      }

      renderer.render(scene, camera);
    });

    // ─────────────────────────────────────────────────────────────
    // AR SESSION INIT
    // ─────────────────────────────────────────────────────────────

    let _phase2Inited = false;
    async function initPhase2() {
      if (_phase2Inited) return;
      _phase2Inited = true;
      initPointerDot();
      initHandTrail();
      await initVoiceAnalyzer();
      if (DEBUG) console.log('[phase2] 입력 레이어 초기화 완료');
    }

    let _phase3Inited = false;
    function initPhase3() {
      if (_phase3Inited) return;
      _phase3Inited = true;
      initFoodParticle();
      initBubbleBurst();
      initGlowOrb();
      initOrbAccretion();
      initMotes();
      initWhaleGauge();
      initRingEffect();
      initAmbientEnvironment();
      initAtmosphere();
      if (DEBUG) console.log('[phase3] VFX 레이어 초기화 완료');
    }

    let _phase4Inited = false;
    function initPhase4() {
      if (_phase4Inited) return;
      _phase4Inited = true;
      initFishSchool();
      initJellyfish();
      // 소형 물고기 5마리 ambient 스폰
      const offsets = [[-0.5,-0.2,-1.0],[0.3,-0.1,-0.8],[-0.2,0.1,-1.2],[0.6,-0.3,-1.0],[-0.4,0,-1.4]];
      for (const [ox,oy,oz] of offsets)
        spawnFishS(ctx.headPos.x+ox, ctx.spawnEyeY+oy, ctx.headPos.z+oz);
      spawnGuideFish();
      if (DEBUG) console.log('[phase4] 크리처 레이어 초기화 완료');
    }

    renderer.xr.addEventListener('sessionstart', async () => {
      document.getElementById('overlay').classList.add('hidden');
      await initModels();
      await initPhase2();
      initPhase3();
      initPhase4();
      _resetSpawnThresholds();
      if (DEBUG) console.log('[phase5] SpawnManager + SpatialAudio 준비 완료');
    });

    renderer.xr.addEventListener('sessionend', () => {
      document.getElementById('overlay').classList.remove('hidden');
      prevTimestamp        = 0;
      ctx.sessionTime      = 0;
      ctx.calibrated       = false;
      ctx.voiceHeld        = 'silence';
      _smoothedRms         = 0;
      _voiceHoldTimer      = 0;
      ctx.counters.pinchTotal  = 0;
      ctx.counters.trailLength = 0;
      ctx.counters.voiceSec    = 0;
      ctx.counters.singSec     = 0;
      ctx.spawnState.fishSCount   = 0;
      ctx.spawnState.fishMCount   = 0;
      ctx.spawnState.fishLCount   = 0;
      ctx.spawnState.jellyCount   = 0;
      ctx.spawnState.whaleSpawned = false;
      _eggs.forEach(e => scene.remove(e.group));
      _eggs.length = 0;
      ctx.foodParticles = [];
      ctx.trailPoints   = [];
      _foodParts.length = 0;
      _ambBubs.length   = 0;
      _bubTimer         = 0;
      _burstPool.forEach(b => { b.active = false; if (b.mesh) b.mesh.visible = false; });
      _accParts.length = 0;
      if (_accMesh) _accMesh.geometry.setDrawRange(0, 0);
      _motes.length = 0;
      if (_moteMesh) _moteMesh.geometry.setDrawRange(0, 0);
      _gauge.progress = 0; _gauge.full = false; _gauge.trailSeen = 0;
      if (_gauge.mat) {
        _gauge.mat.uniforms.uProgress.value = 0;
        _gauge.mat.uniforms.uPulseT.value   = -10;
        _gauge.mat.uniforms.uFade.value     = 1;
      }
      if (_guide.mesh) _guide.mesh.visible = false;
      _guide.state = 'none';
      _gtPts.length = 0;
      if (_gtMesh) _gtMesh.geometry.setDrawRange(0, 0);
      _ringPool.forEach(r => { r.active = false; r.meshes?.forEach(m => m.visible = false); });
      if (_orb.group) { _orb.state = 'inactive'; _orb.group.visible = false; }
      _fishSData.length = 0; _fishMData.length = 0;
      _fishLData.forEach(f => { if (f.mesh) scene.remove(f.mesh); });
      _fishLData.length = 0;
      _jellyData.length = 0;
      if (_jellyBellMesh) _jellyBellMesh.count = 0;
      if (_jellyTentMesh) _jellyTentMesh.count = 0;
      _uVoice.value = 0;
      if (_fishSMesh) _fishSMesh.count = 0;
      if (_fishMMesh) _fishMMesh.count = 0;
      if (_whale.mesh) { scene.remove(_whale.mesh); _whale.mesh=null; }
      _whale.phase = 'idle';
      _phase4Inited = false;
      _resetSpawnThresholds();
    });

    // ─────────────────────────────────────────────────────────────
    // FLAT PREVIEW MODE  (?flat) — XR 없이 데스크톱에서 비주얼 확인
    // 셰이더 컴파일 검증 + 색감/이펙트 튜닝용. 마이크는 요청하지 않음.
    // ─────────────────────────────────────────────────────────────

    if (FLAT) {
      (async () => {
        document.getElementById('overlay').classList.add('hidden');
        ctx.headPos.set(0, 1.6, 0);
        ctx.spawnEyeY  = 1.6;
        ctx.calibrated = true;
        camera.position.set(0, 1.6, 1.4);
        await initModels();
        initPointerDot();
        initHandTrail();
        initPhase3();
        initPhase4();
        // 모든 셰이더가 한 번씩 렌더되도록 크리쳐/이펙트 샘플 소환
        spawnFishM( 0.2, 1.5, -1.0);
        spawnFishL(-0.5, 1.4, -1.2);
        spawnJellyfish(0.6, 1.5, -0.9);
        spawnJellyfish(-0.7, 1.8, -1.1);
        _spawnEgg('fishS');
        emitFoodParticles(0.3, 1.5, -0.6);
        triggerBubbleBurst(-0.3, 1.5, -0.8);
        triggerShockwaveRing(0, 1.4, -1.0);
        activateGlowOrb(0, 1.2, -0.7);
        spawnLightMote(0.4, 1.3, -0.6);
        spawnLightMote(-0.4, 1.6, -0.7);
        gaugeAdd(0.45, false);
        _triggerWhale();
        window._dbg = { ctx, whale: _whale, gauge: _gauge, guide: _guide, scene, camera, renderer };   // 콘솔 검사용
        console.log('[flat] preview ready');
      })();
    }

    document.getElementById('btnAR').addEventListener('click', async () => {
      const errEl = document.getElementById('errMsg');
      errEl.textContent = '';

      if (!navigator.xr) {
        errEl.textContent = 'WebXR를 지원하지 않는 기기입니다.';
        return;
      }

      // 마이크 권한을 2D 화면에서 미리 요청 — XR 진입 후엔 다이얼로그가 안 보임
      try {
        await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
      } catch (e) {
        console.warn('[mic pre-check] 권한 없음, 음성 기능 비활성화:', e.message);
      }

      try {
        const supported = await navigator.xr.isSessionSupported('immersive-ar');
        if (!supported) {
          errEl.textContent = 'AR 모드 미지원 — Meta Quest 3에서 실행해주세요.';
          return;
        }

        const session = await navigator.xr.requestSession('immersive-ar', {
          requiredFeatures: ['local-floor'],
          optionalFeatures: ['hand-tracking'],
        });

        await renderer.xr.setSession(session);

      } catch (e) {
        errEl.textContent = `오류: ${e.message}`;
        console.error('[XR session]', e);
      }
    });

  </script>
</body>
</html>
