<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MROCEANs</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; }
    canvas { display: block; }

    #overlay {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background:
        radial-gradient(ellipse at 50% 115%, rgba(30, 110, 160, 0.40), transparent 62%),
        radial-gradient(ellipse at 50% -15%, rgba(70, 170, 230, 0.16), transparent 55%),
        #021019;
    }
    #overlay.hidden { display: none; }
    #overlay h1 {
      color: #88eeff; font-size: 2.4rem;
      letter-spacing: 0.18em; font-weight: 300;
      margin-bottom: 0.6rem;
      text-shadow: 0 0 28px rgba(90, 210, 255, 0.55), 0 0 80px rgba(60, 140, 220, 0.35);
    }
    #overlay p {
      color: rgba(136, 238, 255, 0.5);
      font-size: 0.9rem; letter-spacing: 0.1em;
      margin-bottom: 3rem;
    }
    #btnAR {
      padding: 0.9rem 3rem; font-size: 1.05rem;
      background: transparent; color: #88eeff;
      border: 1px solid rgba(136, 238, 255, 0.6);
      border-radius: 6px; cursor: pointer;
      letter-spacing: 0.12em;
      transition: background 0.25s, border-color 0.25s;
    }
    #btnAR:hover { background: rgba(136, 238, 255, 0.1); border-color: #88eeff; }
    #errMsg {
      color: #ff8877; margin-top: 1.6rem;
      font-size: 0.82rem; text-align: center;
      max-width: 320px; line-height: 1.5;
    }
    #dbg {
      position: fixed; top: 0.8rem; left: 0.8rem; z-index: 20;
      color: #88ff88; font-family: monospace; font-size: 0.72rem;
      line-height: 1.6; pointer-events: none;
      text-shadow: 0 0 6px #000; display: none;
    }
  </style>
</head>
<body>

  <div id="overlay">
    <h1>MROCEANs</h1>
    <p>Mixed Reality Ocean Experience</p>
    <button id="btnAR">바다 속으로</button>
    <div id="errMsg"></div>
  </div>
  <div id="dbg"></div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.165.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.165.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader }  from 'three/addons/loaders/GLTFLoader.js';
    import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

    const DEBUG = location.search.includes('debug');
    const FLAT  = location.search.includes('flat');   // XR 없이 데스크톱 비주얼 프리뷰
    const dbgEl = document.getElementById('dbg');
    if (DEBUG) dbgEl.style.display = 'block';

    // ─────────────────────────────────────────────────────────────
    // CONSTANTS
    // ─────────────────────────────────────────────────────────────

    const SPAWN_RADIUS_XZ  = 2.0;
    const FISH_FLOOR_Y     = 0.3;
    const FISH_CEIL_Y      = 2.5;
    const USER_NEAR_DIST   = 0.5;

    const FISH_S_LENGTH    = 0.08;
    const FISH_S_SPEED     = 0.60;
    const FISH_S_SPRING_K  = 4.0;
    const FISH_S_SPRING_D  = 0.85;
    const FISH_S_SEP_R     = 0.15;
    const FISH_S_ALIGN_R   = 0.50;
    const FISH_S_COH_R     = 1.00;

    const FISH_M_LENGTH    = 0.18;
    const FISH_M_SPEED     = 0.40;
    const FISH_M_SPRING_K  = 3.0;
    const FISH_M_SPRING_D  = 0.88;

    const FISH_L_LENGTH    = 0.35;
    const FISH_L_SPEED     = 0.22;
    const FISH_L_SPRING_K  = 1.8;
    const FISH_L_SPRING_D  = 0.92;

    const JELLY_UMBRELLA_R   = 0.18;
    const JELLY_DRIFT_SPEED  = 0.10;
    const JELLY_PULSE_PERIOD = 2.8;
    const JELLY_VORTEX_DIST  = 1.5;
    const JELLY_SPRING_K     = 1.5;
    const JELLY_SPRING_D     = 0.95;

    const WHALE_LENGTH     = 3.0;
    const WHALE_SPEED      = 0.35;
    const WHALE_SPAWN_DIST = 7.0;
    const WHALE_FADE_DUR   = 4.0;
    const WHALE_PASS_DUR   = 35;

    const FOOD_PER_PINCH   = 8;
    const FOOD_LIFETIME    = 5.0;
    const FOOD_GRAVITY     = -0.30;
    const FOOD_SPREAD      = 0.12;
    const FOOD_ATTRACT_R   = 0.80;
    const FOOD_MAX         = 200;

    const PTR_LAZY_LERP       = 0.07;
    const TRAIL_LIFETIME      = 8.0;
    const TRAIL_ADD_INTERVAL  = 0.033;
    const TRAIL_FISH_FOLLOW_R = 0.60;

    const BURST_RADIUS     = 0.40;
    const BURST_PART_COUNT = 60;
    const BURST_DURATION   = 1.2;
    const BURST_SCATTER_R  = 0.60;

    // 오브 응집 파티클 (구 와류 토큰 대체 — 공간의 빛이 손 사이로 모임)
    const ORB_ACC_COUNT  = 80;     // 응집 파티클 수
    const ORB_ACC_RMIN   = 0.30;   // 응집 시작 반경 (오브 중심 기준)
    const ORB_ACC_RMAX   = 0.65;
    const ORB_ORBIT_MAX  = 28;     // 오브 완성 후 궤도에 남는 파티클 수

    // 물고기 터치 & 빛 알갱이 (잡기 욕구 → 터치 보상)
    const TOUCH_R_S      = 0.07;   // 터치 판정 반경 (소형)
    const TOUCH_R_M      = 0.10;
    const TOUCH_R_L      = 0.18;
    const TOUCH_COOLDOWN = 1.5;    // 같은 물고기 재터치 간격 (초)
    const MOTE_MAX       = 40;
    const MOTE_LIFETIME  = 12.0;
    const MOTE_COLLECT_R = 0.13;   // 손으로 수집되는 반경
    const MOTE_FLY_DUR   = 0.7;    // 수집 후 게이지로 날아가는 시간

    // 고래 게이지 (공중의 빛 고리 — 눈에 보이는 목표)
    const GAUGE_PTS   = 96;
    const GAUGE_R     = 0.35;
    const GAUGE_DIST  = 1.6;       // 사용자 전방 거리
    const GAIN_MOTE   = 0.05;      // 빛 알갱이 1개 수집
    const GAIN_ORB    = 0.10;      // 오브 완성
    const GAIN_PINCH  = 0.01;      // 핀치(먹이주기) 1회
    const GAIN_TRAIL  = 0.01;      // 트레일 0.5m당
    const GAIN_SING   = 0.012;     // SING 1초당

    const RING_COUNT       = 3;
    const RING_STAGGER     = 0.13;
    const RING_EXPAND_DUR  = 0.9;
    const RING_SHOCK_SCALE = 1.8;
    const RING_WAVE_SCALE  = 1.0;

    const ORB_MAX_R        = 0.15;
    const ORB_GROW_SPEED   = 0.08;
    const ORB_ATTRACT_R    = 1.0;
    const ORB_FISH_ORBIT_R = 0.25;

    const VOICE_THRESH = 0.02;
    const VOICE_HOLD   = 2.0;
    const VOICE_HYST   = 0.25;
    const VOICE_ATK    = 0.18;
    const VOICE_REL    = 0.04;
    const VOICE_LINGER = 2.5;

    const PINCH_THRESHOLD   = 0.02;
    const INDEX_EXTEND_MIN  = 0.14;
    const CURL_MAX          = 0.13;
    const FIST_CURL_MAX     = 0.08;
    const SWIPE_VELOCITY    = 1.2;
    const CUP_HAND_MAX_DIST = 0.15;
    const SPREAD_VELOCITY   = 0.8;
    const LAZY_LERP         = 0.07;

    const BUBBLE_RATE_BASE    = 4;
    const BUBBLE_RATE_SING    = 15;
    const BUBBLE_RISE_SPEED   = 0.35;
    const BUBBLE_LIFETIME     = 5.0;

    const SPAWN_PINCH_FIRST  = 5;
    const SPAWN_PINCH_STEP   = 3;
    const SPAWN_TRAIL_STEP   = 2.0;
    const SPAWN_VOICE_FIRST  = 10;
    const SPAWN_VOICE_STEP   = 8;
    const SPAWN_LARGE_PINCH  = 15;
    const SPAWN_LARGE_MED    = 3;
    const SPAWN_WHALE_TIME   = 180;
    const SPAWN_WHALE_SING   = 8;

    const EGG_HATCH_DUR   = 10;   // 부화까지 걸리는 시간 (초)
    const EGG_SPAWN_DIST  = 1.2;  // 사용자 정면으로부터의 거리 (m)
    const EGG_MAX         = 8;    // 동시 존재 가능한 알 최대 수

    const EGG_COLORS = {
      fishS:    0x44ffcc,
      fishM:    0x88ff44,
      fishL:    0xff8844,
      jellyfish: 0xcc44ff,
    };

    // ─────────────────────────────────────────────────────────────
    // GLOBAL CONTEXT
    // ─────────────────────────────────────────────────────────────

    const ctx = {
      headPos:     new THREE.Vector3(),
      spawnEyeY:   1.6,
      calibrated:  false,
      voiceHeld:   'silence',
      sessionTime: 0,

      counters: {
        pinchTotal:  0,
        trailLength: 0,
        voiceSec:    0,
        singSec:     0,
      },

      spawnState: {
        fishSCount:   0,
        fishMCount:   0,
        fishLCount:   0,
        jellyCount:   0,
        whaleSpawned: false,
      },

      foodParticles: [],
      trailPoints:   [],

      handJoints: {
        left: {
          wrist:     { pos: new THREE.Vector3(), quat: new THREE.Quaternion() },
          thumbTip:  new THREE.Vector3(),
          indexTip:  new THREE.Vector3(),
          middleTip: new THREE.Vector3(),
          ringTip:   new THREE.Vector3(),
          pinkyTip:  new THREE.Vector3(),
          valid:     false,
        },
        right: {
          wrist:     { pos: new THREE.Vector3(), quat: new THREE.Quaternion() },
          thumbTip:  new THREE.Vector3(),
          indexTip:  new THREE.Vector3(),
          middleTip: new THREE.Vector3(),
          ringTip:   new THREE.Vector3(),
          pinkyTip:  new THREE.Vector3(),
          valid:     false,
        },
      },
    };

    // ─────────────────────────────────────────────────────────────
    // SHARED VISUAL UNIFORMS
    // 모든 커스텀 셰이더가 같은 객체를 참조 → 한 곳에서만 갱신
    // (주의: ShaderMaterial.clone()은 이 참조를 끊으므로 clone 후 재연결 필요)
    // ─────────────────────────────────────────────────────────────

    const _uTime  = { value: 0 };   // 전역 시간 (초)
    const _uVoice = { value: 0 };   // 0~1 스무딩된 음성 레벨 (sing=1)

    // ─────────────────────────────────────────────────────────────
    // THREE.JS SCENE
    // ─────────────────────────────────────────────────────────────

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.xr.enabled = true;
    renderer.xr.setReferenceSpaceType('local-floor');
    document.body.appendChild(renderer.domElement);

    const scene  = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(
      75, window.innerWidth / window.innerHeight, 0.01, 50
    );
    scene.add(camera);

    // 수중 분위기 라이팅 — 위는 수면광(아쿠아), 아래는 심해 청색
    // (GLB 로드 실패 시 더미 StandardMaterial 폴백용. 커스텀 셰이더는 자체 라이팅)
    const hemiLight = new THREE.HemisphereLight(0xbfe8ff, 0x123a5e, 0.9);
    scene.add(hemiLight);
    const ambientLight = new THREE.AmbientLight(0x88aacc, 0.35);
    scene.add(ambientLight);

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ─────────────────────────────────────────────────────────────
    // GLB LOADER
    // ─────────────────────────────────────────────────────────────

    const dracoLoader = new DRACOLoader();
    dracoLoader.setDecoderPath(
      'https://www.gstatic.com/draco/versioned/decoders/1.5.6/'
    );
    const gltfLoader = new GLTFLoader();
    gltfLoader.setDRACOLoader(dracoLoader);

    const models = { fishS: null, fishM: null, fishL: null, jellyfish: null, whale: null };

    function loadGLB(url) {
      return new Promise((resolve, reject) =>
        gltfLoader.load(url, gltf => resolve(gltf.scene), undefined, reject)
      );
    }

    // ── 물고기 커스텀 셰이더 ──────────────────────────────────────
    // GLB 텍스처 유지 + 스타일라이즈드 헤미스피어 라이팅 + 수중 림 글로우
    // + GPU 꼬리 스웨이 (CPU 요 흔들림과 합산되어 살아있는 느낌)
    const _fishVert = `
      attribute float aPhase;
      attribute float aFlash;
      uniform float uTime;
      uniform float uLen;
      uniform float uPhase;
      uniform float uFlashT;
      varying vec2 vUv;
      varying vec3 vNormal;
      varying vec3 vViewPos;
      varying vec3 vWorldN;
      varying float vFlash;
      void main() {
        vUv = uv;
        float ph = uPhase + aPhase;
        // 터치 플래시: 터치 시각(aFlash/uFlashT) 후 0.6초간 감쇠
        float fT = max(aFlash, uFlashT);
        vFlash = clamp(1.0 - (uTime - fT) / 0.6, 0.0, 1.0);
        // 꼬리 스웨이: 머리(+z) 고정, 꼬리(-z)로 갈수록 진폭 증가
        float zn    = position.z / uLen;            // -1(꼬리) ~ +1(머리)
        float tailK = smoothstep(0.6, -1.0, zn);
        vec3 p = position;
        p.x += sin(uTime * 5.0 + ph + zn * 2.2) * tailK * uLen * 0.22;
        p *= 1.0 + vFlash * 0.08;                   // 터치 순간 살짝 부풂
        vec4 mp = vec4(p, 1.0);
        vec3 n  = normal;
        #ifdef USE_INSTANCING
          mp = instanceMatrix * mp;
          n  = mat3(instanceMatrix) * n;
        #endif
        vWorldN  = normalize(mat3(modelMatrix) * n);
        vec4 mv  = modelViewMatrix * mp;
        vNormal  = normalMatrix * n;
        vViewPos = mv.xyz;
        gl_Position = projectionMatrix * mv;
      }
    `;
    const _fishFrag = `
      uniform sampler2D map;
      uniform float uVoice;
      uniform vec3  uTint;
      varying vec2 vUv;
      varying vec3 vNormal;
      varying vec3 vViewPos;
      varying vec3 vWorldN;
      varying float vFlash;
      void main() {
        vec4 tex  = texture2D(map, vUv);
        vec3  N   = normalize(vNormal);
        vec3  V   = normalize(-vViewPos);
        float ndv = abs(dot(N, V));
        // 위에서 내려오는 수면광 ↔ 아래의 심해빛 그라데이션
        float hemi = 0.5 + 0.5 * vWorldN.y;
        vec3  lit  = tex.rgb * mix(vec3(0.30, 0.45, 0.62), vec3(1.05, 1.12, 1.15), hemi);
        lit *= uTint;                               // 가이드 물고기 황금 틴트용
        // 수중 림 글로우 — 음성 레벨이 오르면 강해짐 (SING = 씬 밝아짐)
        float rim = pow(1.0 - ndv, 2.4);
        lit += vec3(0.40, 0.85, 1.0) * rim * (0.35 + uVoice * 0.65);
        lit += vec3(0.90, 1.0, 1.0) * vFlash * 1.2; // 터치 플래시
        gl_FragColor = vec4(lit, 1.0);
        #include <colorspace_fragment>
      }
    `;

    function _dummyFish(len, color) {
      const g   = new THREE.Group();
      const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.7 });
      const body = new THREE.Mesh(new THREE.ConeGeometry(len * 0.22, len, 5), mat);
      body.rotation.x = Math.PI / 2;
      g.add(body);
      return g;
    }
    // 스피릿 웨일 — 에테리얼한 발광 실루엣 (캡슐 지오메트리 + 커스텀 셰이더)
    const _whaleVert = `
      uniform float uTime;
      varying vec3  vNormal;
      varying vec3  vViewPos;
      varying float vAxis;
      void main() {
        // 캡슐 장축 = 로컬 Y. 축을 따라 좌우로 휘는 유영 파동
        float axis = position.y / ${(WHALE_LENGTH * 0.5).toFixed(2)};
        vAxis = axis;
        vec3 p = position;
        p.x += sin(uTime * 1.4 + axis * 2.5) * 0.06 * (0.3 + abs(axis));
        vec4 mv  = modelViewMatrix * vec4(p, 1.0);
        vNormal  = normalMatrix * normal;
        vViewPos = mv.xyz;
        gl_Position = projectionMatrix * mv;
      }
    `;
    const _whaleFrag = `
      uniform float uTime;
      uniform float uOpacity;
      varying vec3  vNormal;
      varying vec3  vViewPos;
      varying float vAxis;
      void main() {
        vec3  N   = normalize(vNormal);
        vec3  V   = normalize(-vViewPos);
        float ndv = abs(dot(N, V));
        float rim = pow(1.0 - ndv, 1.8);
        vec3 col = vec3(0.10, 0.25, 0.45) * (0.4 + 0.6 * ndv);
        // 몸을 따라 흐르는 빛의 띠 + 시안 림 글로우
        float band = 0.5 + 0.5 * sin(vAxis * 6.0 - uTime * 1.5);
        col += vec3(0.35, 0.80, 1.0) * (rim * 1.1 + band * rim * 0.8);
        col += vec3(0.70, 0.90, 1.0) * pow(rim, 3.0) * 0.8;
        float a = (0.18 + rim * 0.85) * uOpacity;
        gl_FragColor = vec4(col, a);
      }
    `;

    function _dummyWhale() {
      const g   = new THREE.Group();
      const mat = new THREE.ShaderMaterial({
        uniforms: { uTime: _uTime, uOpacity: { value: 0 } },
        vertexShader: _whaleVert, fragmentShader: _whaleFrag,
        transparent: true, depthWrite: false,
        blending: THREE.AdditiveBlending,
      });
      const body = new THREE.Mesh(
        new THREE.CapsuleGeometry(WHALE_LENGTH * 0.11, WHALE_LENGTH * 0.68, 6, 20),
        mat
      );
      body.rotation.x = Math.PI / 2;
      body.name = 'whale_body';
      g.add(body);
      return g;
    }

    async function initModels() {
      if (models.fishS) return;   // 세션 재진입 시 재로드 방지
      // clown_fish.glb 1개로 fishS/M/L 모두 처리 (길이만 차별화)
      let baseMesh = null;
      try {
        const fishScene = await loadGLB('./clown_fish.glb');
        fishScene.traverse(o => { if (!baseMesh && o.isMesh) baseMesh = o; });
      } catch (e) {
        if (DEBUG) console.warn('[models] clown_fish.glb 로드 실패, 더미 사용', e);
      }

      if (baseMesh) {
        const baseGeo = baseMesh.geometry.clone();
        // 본 없이 정적으로 쓸 거라 스킨 어트리뷰트 제거
        baseGeo.deleteAttribute('JOINTS_0');
        baseGeo.deleteAttribute('WEIGHTS_0');
        baseGeo.computeBoundingBox();
        const bb = baseGeo.boundingBox;
        const baseLen = Math.max(
          bb.max.x - bb.min.x,
          bb.max.y - bb.min.y,
          bb.max.z - bb.min.z
        );
        // 원점을 메시 중심으로 (피쉬가 위치의 정중앙을 기준으로 회전하도록)
        const cx = (bb.max.x + bb.min.x) * 0.5;
        const cy = (bb.max.y + bb.min.y) * 0.5;
        const cz = (bb.max.z + bb.min.z) * 0.5;
        baseGeo.applyMatrix4(new THREE.Matrix4().makeTranslation(-cx, -cy, -cz));

        let baseTex = baseMesh.material.map;
        if (!baseTex) {
          baseTex = new THREE.DataTexture(new Uint8Array([255, 140, 60, 255]), 1, 1);
          baseTex.needsUpdate = true;
        }

        const makeFish = (targetLen) => {
          const g = baseGeo.clone();
          const k = targetLen / baseLen;
          g.applyMatrix4(new THREE.Matrix4().makeScale(k, k, k));
          // uniforms를 리터럴로 구성 → _uTime/_uVoice 공유 참조 유지
          const mat = new THREE.ShaderMaterial({
            uniforms: {
              map:    { value: baseTex },
              uTime:  _uTime,
              uVoice: _uVoice,
              uLen:   { value: targetLen * 0.5 },
              uPhase: { value: Math.random() * Math.PI * 2 },
              uFlashT:{ value: -1000 },
              uTint:  { value: new THREE.Color(1, 1, 1) },
            },
            vertexShader:   _fishVert,
            fragmentShader: _fishFrag,
            side: THREE.DoubleSide,
          });
          const m = new THREE.Mesh(g, mat);
          const grp = new THREE.Group();
          grp.add(m);
          return grp;
        };

        models.fishS = makeFish(FISH_S_LENGTH);
        models.fishM = makeFish(FISH_M_LENGTH);
        models.fishL = makeFish(FISH_L_LENGTH);
      } else {
        models.fishS = _dummyFish(FISH_S_LENGTH, 0x66ccff);
        models.fishM = _dummyFish(FISH_M_LENGTH, 0x33aadd);
        models.fishL = _dummyFish(FISH_L_LENGTH, 0x1177aa);
      }

      // 해파리는 C14에서 셰이더 기반으로 직접 생성 (models 불필요)
      models.whale = _dummyWhale();
      if (DEBUG) console.log('[models] init 완료 (clown_fish:', !!baseMesh, ')');
    }

    // onPinchEvent / onTrailLengthUpdate / playPinchSound → C16·C19에서 정의

    // ─────────────────────────────────────────────────────────────
    // C07 — FOOD PARTICLE
    // ─────────────────────────────────────────────────────────────

    const _foodVert = `
      attribute float alpha;
      varying float vAlpha;
      void main() {
        vAlpha = alpha;
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        gl_PointSize = max(3.0, 5.0 / max(0.1, -mv.z));
        gl_Position  = projectionMatrix * mv;
      }
    `;
    const _foodFrag = `
      varying float vAlpha;
      void main() {
        float r = length(gl_PointCoord - vec2(0.5));
        if (r > 0.5) discard;
        float glow = 1.0 - smoothstep(0.0, 0.5, r);
        vec3  col  = mix(vec3(1.0, 0.92, 0.3), vec3(1.0, 0.98, 0.85), r * 2.0);
        gl_FragColor = vec4(col, vAlpha * glow);
      }
    `;

    const _foodParts  = [];
    let   _foodMesh   = null;
    let   _foodPosArr, _foodAlphaArr;

    function initFoodParticle() {
      const geo = new THREE.BufferGeometry();
      _foodPosArr   = new Float32Array(FOOD_MAX * 3);
      _foodAlphaArr = new Float32Array(FOOD_MAX);
      geo.setAttribute('position', new THREE.BufferAttribute(_foodPosArr,   3));
      geo.setAttribute('alpha',    new THREE.BufferAttribute(_foodAlphaArr, 1));
      geo.setDrawRange(0, 0);
      _foodMesh = new THREE.Points(geo, new THREE.ShaderMaterial({
        vertexShader: _foodVert, fragmentShader: _foodFrag,
        transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
      }));
      _foodMesh.frustumCulled = false;
      scene.add(_foodMesh);
    }

    function emitFoodParticles(x, y, z) {
      for (let i = 0; i < FOOD_PER_PINCH; i++) {
        if (_foodParts.length >= FOOD_MAX) _foodParts.shift();
        const a = Math.random() * Math.PI * 2;
        const s = FOOD_SPREAD * (0.5 + Math.random() * 0.5);
        _foodParts.push({ x, y, z, vx: Math.cos(a)*s, vy: 0.05 + Math.random()*0.08, vz: Math.sin(a)*s, age: 0 });
      }
    }

    function updateFoodParticle(timestamp, dt) {
      if (!_foodMesh) return;
      for (let i = _foodParts.length - 1; i >= 0; i--) {
        const p = _foodParts[i];
        p.age += dt;
        if (p.age >= FOOD_LIFETIME) { _foodParts.splice(i, 1); continue; }
        p.vy += FOOD_GRAVITY * dt;
        p.x  += p.vx * dt;  p.y += p.vy * dt;  p.z += p.vz * dt;
        if (p.y < FISH_FLOOR_Y) { p.y = FISH_FLOOR_Y; p.vy = 0; p.vx *= 0.8; p.vz *= 0.8; }
      }
      const count = Math.min(_foodParts.length, FOOD_MAX);
      for (let i = 0; i < count; i++) {
        const p = _foodParts[i], t = p.age / FOOD_LIFETIME;
        _foodPosArr[i*3] = p.x; _foodPosArr[i*3+1] = p.y; _foodPosArr[i*3+2] = p.z;
        _foodAlphaArr[i] = t < 0.65 ? 0.85 : 0.85 * (1 - (t - 0.65) / 0.35);
      }
      _foodMesh.geometry.attributes.position.needsUpdate = true;
      _foodMesh.geometry.attributes.alpha.needsUpdate    = true;
      _foodMesh.geometry.setDrawRange(0, count);
      ctx.foodParticles = _foodParts.map(p => ({ x: p.x, y: p.y, z: p.z, age: p.age }));
    }

    // ─────────────────────────────────────────────────────────────
    // C08 — BUBBLE BURST
    // ─────────────────────────────────────────────────────────────

    const _burstVert = `
      uniform float uAlpha; uniform float uProgress; varying float vA;
      void main() {
        vA = uAlpha;
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        gl_PointSize = max(2.0, (5.0 - 3.0*uProgress) / max(0.1, -mv.z));
        gl_Position  = projectionMatrix * mv;
      }
    `;
    const _burstFrag = `
      varying float vA;
      void main() {
        float r = length(gl_PointCoord - vec2(0.5));
        if (r > 0.5) discard;
        vec3 col = mix(vec3(0.75,0.92,1.0), vec3(1.0), r*2.0);
        gl_FragColor = vec4(col, vA * (1.0-smoothstep(0.0,0.5,r)));
      }
    `;

    let _burstDirs = null;
    const _burstPool = [];

    function initBubbleBurst() {
      _burstDirs = new Float32Array(BURST_PART_COUNT * 3);
      for (let i = 0; i < BURST_PART_COUNT; i++) {
        const th = Math.random()*Math.PI*2, ph = Math.acos(2*Math.random()-1);
        _burstDirs[i*3]   = Math.sin(ph)*Math.cos(th);
        _burstDirs[i*3+1] = Math.sin(ph)*Math.sin(th);
        _burstDirs[i*3+2] = Math.cos(ph);
      }
      for (let s = 0; s < 3; s++) {
        const geo = new THREE.BufferGeometry();
        const posArr = new Float32Array(BURST_PART_COUNT * 3);
        geo.setAttribute('position', new THREE.BufferAttribute(posArr, 3));
        geo.setDrawRange(0, BURST_PART_COUNT);
        const mat = new THREE.ShaderMaterial({
          uniforms: { uAlpha: { value: 0 }, uProgress: { value: 0 } },
          vertexShader: _burstVert, fragmentShader: _burstFrag,
          transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
        });
        const mesh = new THREE.Points(geo, mat);
        mesh.frustumCulled = false; mesh.visible = false;
        scene.add(mesh);
        _burstPool.push({ active: false, timer: 0, cx:0, cy:0, cz:0, rot:0, mesh, posArr });
      }
    }

    function triggerBubbleBurst(x, y, z) {
      const slot = _burstPool.find(b => !b.active);
      if (!slot) return;
      slot.active = true; slot.timer = 0; slot.rot = Math.random()*Math.PI*2;
      slot.cx = x; slot.cy = y; slot.cz = z;
      slot.mesh.visible = true;
      scatterFishAt(x, y, z);
      scatterJellyfishAt(x, y, z, BURST_SCATTER_R);
      if (DEBUG) console.log(`[burstBurst] (${x.toFixed(2)},${y.toFixed(2)},${z.toFixed(2)})`);
    }

    function updateBubbleBurst(timestamp, dt) {
      for (const s of _burstPool) {
        if (!s.active) continue;
        s.timer += dt;
        const p  = Math.min(s.timer / BURST_DURATION, 1.0);
        const cr = Math.cos(s.rot), sr = Math.sin(s.rot);
        for (let i = 0; i < BURST_PART_COUNT; i++) {
          const r  = p * BURST_RADIUS;
          const dx = _burstDirs[i*3], dy = _burstDirs[i*3+1], dz = _burstDirs[i*3+2];
          s.posArr[i*3]   = s.cx + (dx*cr - dz*sr)*r;
          s.posArr[i*3+1] = s.cy + dy*r;
          s.posArr[i*3+2] = s.cz + (dx*sr + dz*cr)*r;
        }
        s.mesh.geometry.attributes.position.needsUpdate = true;
        s.mesh.material.uniforms.uAlpha.value    = 1.0 - p;
        s.mesh.material.uniforms.uProgress.value = p;
        if (p >= 1.0) { s.active = false; s.mesh.visible = false; }
      }
    }

    // ─────────────────────────────────────────────────────────────
    // C09 — ORB ACCRETION  (공간의 빛이 손 사이로 모여 오브가 된다)
    // 구 와류 토큰(손목 링) 대체 — 손목 부착형 가상 오브제는 패스스루에서
    // 오클루전이 없어 입체감이 죽는다. 양손 사이 공간을 채우는 연출로 교체.
    // ─────────────────────────────────────────────────────────────

    const _accVert = `
      attribute float aSeed;
      attribute float aAlpha;
      varying float vSeed;
      varying float vA;
      void main() {
        vSeed = aSeed; vA = aAlpha;
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        gl_PointSize = clamp(9.0 / max(0.25, -mv.z), 3.0, 12.0);
        gl_Position = projectionMatrix * mv;
      }
    `;
    const _accFrag = `
      uniform float uTime;
      varying float vSeed;
      varying float vA;
      void main() {
        float r = length(gl_PointCoord - vec2(0.5));
        if (r > 0.5) discard;
        float glow = exp(-r * r * 10.0);
        float tw   = 0.8 + 0.2 * sin(uTime * 5.0 + vSeed * 23.0);
        vec3 cyan  = vec3(0.45, 0.85, 1.0);
        vec3 white = vec3(0.95, 1.0, 1.0);
        gl_FragColor = vec4(mix(cyan, white, glow), glow * tw * vA);
      }
    `;

    const _accParts = [];
    let   _accMesh  = null;

    function initOrbAccretion() {
      if (_accMesh) return;
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(ORB_ACC_COUNT * 3), 3));
      geo.setAttribute('aSeed',    new THREE.BufferAttribute(new Float32Array(ORB_ACC_COUNT), 1));
      geo.setAttribute('aAlpha',   new THREE.BufferAttribute(new Float32Array(ORB_ACC_COUNT), 1));
      geo.setDrawRange(0, 0);
      _accMesh = new THREE.Points(geo, new THREE.ShaderMaterial({
        uniforms: { uTime: _uTime },
        vertexShader: _accVert, fragmentShader: _accFrag,
        transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
      }));
      _accMesh.frustumCulled = false;
      scene.add(_accMesh);
    }

    // 파티클을 '나선 진입' 상태로 (재)초기화
    function _accSpawnIn(p) {
      const th = Math.random() * Math.PI * 2;
      const ph = (Math.random() - 0.5) * Math.PI;
      const r  = ORB_ACC_RMIN + Math.random() * (ORB_ACC_RMAX - ORB_ACC_RMIN);
      p.mode = 'in';
      p.r0   = r;
      p.a0   = th;
      p.y0   = Math.sin(ph) * r * 0.6;
      p.t    = 0;
      p.dur  = 0.55 + Math.random() * 0.6;
      p.spin = 2.0 + Math.random() * 2.0;     // 나선 감김량 (rad)
      p.seed = Math.random() * 100;
    }

    // 해파리 와류 끌림의 대상 — 활성화된 오브 (등롱 문법)
    function getOrbVortexPositions() {
      if (_orb.group && (_orb.state === 'growing' || _orb.state === 'active')) {
        const p = _orb.group.position;
        return [{ x: p.x, y: p.y, z: p.z }];
      }
      return [];
    }

    function updateOrbAccretion(timestamp, dt) {
      if (!_accMesh) return;
      const active = _orb.state === 'growing' || _orb.state === 'active';

      // 활성 시 파티클 충원 (첫 충원은 위상 분산 — 한꺼번에 쏟아지지 않게)
      if (active) {
        while (_accParts.length < ORB_ACC_COUNT) {
          const p = {};
          _accSpawnIn(p);
          p.t = Math.random();
          _accParts.push(p);
        }
      }

      if (_accParts.length === 0) { _accMesh.geometry.setDrawRange(0, 0); return; }

      const c = _orb.group ? _orb.group.position : ctx.headPos;
      let orbiters = 0;
      for (const p of _accParts) if (p.mode === 'orbit') orbiters++;

      for (let i = _accParts.length - 1; i >= 0; i--) {
        const p = _accParts[i];

        // 오브 해제 → 흩어지며 소멸
        if (!active && p.mode !== 'out') {
          p.mode = 'out'; p.t = 0;
          const a = Math.random() * Math.PI * 2;
          p.vx = Math.cos(a) * (0.8 + Math.random());
          p.vy = 0.3 + Math.random() * 0.7;
          p.vz = Math.sin(a) * (0.8 + Math.random());
          p.x = p.cx ?? c.x; p.y = p.cy ?? c.y; p.z = p.cz ?? c.z;
        }

        if (p.mode === 'in') {
          p.t += dt / p.dur;
          if (p.t >= 1.0) {
            // 도착: 오브 완성 후엔 일부가 궤도(강착원반)에 남음
            if (_orb.state === 'active' && orbiters < ORB_ORBIT_MAX) {
              p.mode = 'orbit'; orbiters++;
              p.oa   = Math.random() * Math.PI * 2;
              p.or   = ORB_MAX_R * (1.4 + Math.random() * 0.6);
              p.oy   = (Math.random() - 0.5) * ORB_MAX_R * 0.8;
              p.ospd = 2.0 + Math.random() * 1.5;
            } else {
              _accSpawnIn(p);
            }
            continue;
          }
          const e = p.t * p.t * (3.0 - 2.0 * p.t);          // smoothstep
          const r = p.r0 * (1.0 - e) + 0.02;
          const a = p.a0 + e * p.spin;
          p.cx = c.x + Math.cos(a) * r;
          p.cy = c.y + p.y0 * (1.0 - e);
          p.cz = c.z + Math.sin(a) * r;

        } else if (p.mode === 'orbit') {
          p.oa += p.ospd * dt;
          p.cx = c.x + Math.cos(p.oa) * p.or;
          p.cy = c.y + p.oy + Math.sin(p.oa * 1.7) * 0.015;
          p.cz = c.z + Math.sin(p.oa) * p.or;

        } else {  // out
          p.t += dt;
          p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
          p.cx = p.x; p.cy = p.y; p.cz = p.z;
          if (p.t >= 0.6) { _accParts.splice(i, 1); continue; }
        }
      }

      // 버퍼 갱신
      const pos  = _accMesh.geometry.attributes.position.array;
      const seed = _accMesh.geometry.attributes.aSeed.array;
      const alp  = _accMesh.geometry.attributes.aAlpha.array;
      const count = Math.min(_accParts.length, ORB_ACC_COUNT);
      for (let i = 0; i < count; i++) {
        const p = _accParts[i];
        pos[i*3] = p.cx ?? 0; pos[i*3+1] = p.cy ?? 0; pos[i*3+2] = p.cz ?? 0;
        seed[i] = p.seed ?? 0;
        alp[i]  = p.mode === 'in'    ? 0.35 + p.t * 0.6
                : p.mode === 'orbit' ? 0.9
                : Math.max(0.9 * (1.0 - p.t / 0.6), 0);
      }
      _accMesh.geometry.attributes.position.needsUpdate = true;
      _accMesh.geometry.attributes.aSeed.needsUpdate    = true;
      _accMesh.geometry.attributes.aAlpha.needsUpdate   = true;
      _accMesh.geometry.setDrawRange(0, count);
    }

    // ─────────────────────────────────────────────────────────────
    // C10 — GLOW ORB
    // ─────────────────────────────────────────────────────────────

    const _orb = { state: 'inactive', scale: 0, group: null };

    function initGlowOrb() {
      _orb.group = new THREE.Group();
      const mk = (r, col, type, alpha) => {
        const m = new THREE.Mesh(
          new THREE.SphereGeometry(r, 24, 24),
          _makeGlowMat(col, type, alpha)
        );
        _orb.group.add(m);
      };
      mk(ORB_MAX_R * 0.45, 0xffffff,  'core', 1.0);
      mk(ORB_MAX_R * 1.00, 0xaaddff,  'core', 0.55);
      mk(ORB_MAX_R * 1.40, 0x4499ff,  'rim',  0.60);
      _orb.group.visible = false;
      scene.add(_orb.group);
    }

    function activateGlowOrb(x, y, z) {
      if (_orb.state !== 'inactive') return;
      _orb.state = 'growing'; _orb.scale = 0;
      _orb.group.position.set(x, y, z);
      _orb.group.visible = true;
    }
    function deactivateGlowOrb() {
      if (_orb.state !== 'inactive') _orb.state = 'dissolving';
    }
    function updateGlowOrbPosition(x, y, z) {
      if (_orb.state === 'growing' || _orb.state === 'active')
        _orb.group.position.set(x, y, z);
    }

    function updateGlowOrb(timestamp, dt) {
      if (_orb.state === 'inactive' || !_orb.group) return;
      const growRate = ORB_GROW_SPEED / ORB_MAX_R;
      if (_orb.state === 'growing') {
        _orb.scale = Math.min(_orb.scale + growRate * dt, 1.0);
        if (_orb.scale >= 1.0) {
          _orb.state = 'active';
          gaugeAdd(GAIN_ORB);   // 오브 완성 = 고래 게이지 기여
        }
      } else if (_orb.state === 'active') {
        _orb.scale = 1.0 + 0.05 * Math.sin(timestamp / 1000 * 3.0);
      } else if (_orb.state === 'dissolving') {
        _orb.scale = Math.max(_orb.scale - growRate * 2 * dt, 0);
        if (_orb.scale <= 0) { _orb.state = 'inactive'; _orb.group.visible = false; return; }
      }
      _orb.group.scale.setScalar(_orb.scale);
    }

    // ─────────────────────────────────────────────────────────────
    // C11 — RING EFFECT  (ShockwaveRing + WaterWave 공용)
    // ─────────────────────────────────────────────────────────────

    const _ringPool = [];
    const _ringGeo  = new THREE.TorusGeometry(1, 0.015, 8, 48);

    function initRingEffect() {
      const mat = new THREE.MeshBasicMaterial({
        color: 0x88ccff, transparent: true,
        depthWrite: false, blending: THREE.AdditiveBlending,
      });
      for (let s = 0; s < 3; s++) {
        const meshes = [];
        for (let r = 0; r < RING_COUNT; r++) {
          const m = new THREE.Mesh(_ringGeo, mat.clone());
          m.rotation.x = Math.PI / 2;
          m.visible = false;
          scene.add(m);
          meshes.push(m);
        }
        _ringPool.push({ active: false, timer: 0, type: 'shockwave', cx:0, cy:0, cz:0, meshes });
      }
    }

    function triggerShockwaveRing(x, y, z) {
      const slot = _ringPool.find(r => !r.active);
      if (!slot) return;
      slot.active = true; slot.timer = 0; slot.type = 'shockwave';
      slot.cx = x; slot.cy = y; slot.cz = z;
      slot.meshes.forEach(m => m.visible = true);
      scatterFishAt(x, y, z);
      scatterJellyfishAt(x, y, z, RING_SHOCK_SCALE);
      if (DEBUG) console.log(`[ring] (${x.toFixed(2)},${y.toFixed(2)},${z.toFixed(2)})`);
    }

    function updateRingEffect(timestamp, dt) {
      for (const s of _ringPool) {
        if (!s.active) continue;
        s.timer += dt;
        const maxSc = s.type === 'shockwave' ? RING_SHOCK_SCALE : RING_WAVE_SCALE;
        for (let r = 0; r < RING_COUNT; r++) {
          const m    = s.meshes[r];
          const tOff = s.timer - r * RING_STAGGER;
          if (tOff <= 0) { m.visible = false; continue; }
          const p = Math.min(tOff / RING_EXPAND_DUR, 1.0);
          m.scale.setScalar(p * maxSc);
          m.position.set(s.cx, s.cy, s.cz);
          m.material.opacity = (1.0 - p) * 0.75;
          m.visible = p < 1.0;
        }
        if (s.timer >= RING_STAGGER * (RING_COUNT-1) + RING_EXPAND_DUR) {
          s.active = false;
          s.meshes.forEach(m => m.visible = false);
        }
      }
    }

    // ─────────────────────────────────────────────────────────────
    // C17 — VOICE ANALYZER
    // ─────────────────────────────────────────────────────────────

    let _audioCtx       = null;
    let _analyser       = null;
    let _micBuf         = null;
    let _smoothedRms    = 0;
    let _voiceHoldTimer = 0;

    const _V_THRESH = {
      whisper: VOICE_THRESH * 0.15,
      call:    VOICE_THRESH * 0.63,
      sing:    VOICE_THRESH * 0.88,
    };
    const _V_EXIT = {
      whisper: VOICE_THRESH * 0.15 * VOICE_HYST,
      call:    VOICE_THRESH * 0.63 * VOICE_HYST,
      sing:    VOICE_THRESH * 0.88 * VOICE_HYST,
    };
    const _V_LVL = { silence: 0, whisper: 1, call: 2, sing: 3 };

    async function initVoiceAnalyzer() {
      try {
        const stream = await Promise.race([
          navigator.mediaDevices.getUserMedia({ audio: true, video: false }),
          new Promise((_, rej) => setTimeout(() => rej(new Error('mic timeout')), 3000)),
        ]);
        _audioCtx = new AudioContext();
        _analyser = _audioCtx.createAnalyser();
        _analyser.fftSize = 2048;
        _micBuf = new Float32Array(_analyser.fftSize);
        _audioCtx.createMediaStreamSource(stream).connect(_analyser);
        if (DEBUG) console.log('[voice] mic ready');
      } catch (e) {
        console.warn('[voice] mic unavailable:', e.message);
      }
    }

    function updateVoiceAnalyzer(dt) {
      if (!_analyser) return;

      _analyser.getFloatTimeDomainData(_micBuf);
      let sum = 0;
      for (let i = 0; i < _micBuf.length; i++) sum += _micBuf[i] * _micBuf[i];
      const raw = Math.sqrt(sum / _micBuf.length);

      const k = raw > _smoothedRms ? VOICE_ATK : VOICE_REL;
      _smoothedRms += (raw - _smoothedRms) * k;
      const rms = _smoothedRms;

      let target = 'silence';
      if      (rms >= _V_THRESH.sing)    target = 'sing';
      else if (rms >= _V_THRESH.call)    target = 'call';
      else if (rms >= _V_THRESH.whisper) target = 'whisper';

      const targetLvl  = _V_LVL[target];
      const currentLvl = _V_LVL[ctx.voiceHeld];

      if (targetLvl > currentLvl) {
        ctx.voiceHeld    = target;
        _voiceHoldTimer  = 0;
      } else if (targetLvl < currentLvl) {
        const exitKey   = ctx.voiceHeld;
        const exitThresh = _V_EXIT[exitKey] ?? 0;
        if (rms < exitThresh) {
          ctx.voiceHeld   = target;
          _voiceHoldTimer = 0;
        } else {
          _voiceHoldTimer += dt;
          if (_voiceHoldTimer >= VOICE_HOLD) {
            ctx.voiceHeld   = target;
            _voiceHoldTimer = 0;
          }
        }
      } else {
        _voiceHoldTimer = 0;
      }

      if (ctx.voiceHeld !== 'silence') ctx.counters.voiceSec += dt;
      if (ctx.voiceHeld === 'sing')    ctx.counters.singSec  += dt;
    }

    // ─────────────────────────────────────────────────────────────
    // C01 — PINCH GESTURE
    // ─────────────────────────────────────────────────────────────

    const _pinch = {
      left:  { wasPinching: false },
      right: { wasPinching: false },
    };

    function updatePinchGesture() {
      for (const side of ['left', 'right']) {
        const j = ctx.handJoints[side];
        if (!j.valid) continue;

        const isPinching = j.thumbTip.distanceTo(j.indexTip) < PINCH_THRESHOLD;

        if (isPinching && !_pinch[side].wasPinching) {
          const mx = (j.thumbTip.x + j.indexTip.x) * 0.5;
          const my = (j.thumbTip.y + j.indexTip.y) * 0.5;
          const mz = (j.thumbTip.z + j.indexTip.z) * 0.5;

          emitFoodParticles(mx, my, mz);
          playPinchSound(mx, my, mz);
          ctx.counters.pinchTotal++;
          onPinchEvent();

          if (DEBUG) console.log(`[pinch] ${side}  total=${ctx.counters.pinchTotal}`);
        }

        _pinch[side].wasPinching = isPinching;
      }
    }

    // ─────────────────────────────────────────────────────────────
    // GLOW MATERIAL HELPER
    // ─────────────────────────────────────────────────────────────

    const _glowVert = `
      varying vec3 vNormal;
      varying vec3 vViewPos;
      void main() {
        vNormal  = normalMatrix * normal;
        vec4 mv  = modelViewMatrix * vec4(position, 1.0);
        vViewPos = mv.xyz;
        gl_Position = projectionMatrix * mv;
      }
    `;
    // 중심이 밝고 가장자리로 갈수록 흐려짐
    const _glowFragCore = `
      uniform vec3  uColor;
      uniform float uAlpha;
      varying vec3  vNormal;
      varying vec3  vViewPos;
      void main() {
        float NdotV = abs(dot(normalize(vNormal), normalize(-vViewPos)));
        float i = pow(NdotV, 0.55);
        gl_FragColor = vec4(uColor, i * uAlpha);
      }
    `;
    // 가장자리만 발광 (rim glow)
    const _glowFragRim = `
      uniform vec3  uColor;
      uniform float uAlpha;
      varying vec3  vNormal;
      varying vec3  vViewPos;
      void main() {
        float NdotV = abs(dot(normalize(vNormal), normalize(-vViewPos)));
        float rim = pow(1.0 - NdotV, 1.8);
        gl_FragColor = vec4(uColor, rim * uAlpha);
      }
    `;
    // 볼류메트릭 — 경계선 없이 내부에서 빛이 새어나오는 느낌
    const _glowFragVol = `
      uniform vec3  uColor;
      uniform float uAlpha;
      varying vec3  vNormal;
      varying vec3  vViewPos;
      void main() {
        float NdotV = abs(dot(normalize(vNormal), normalize(-vViewPos)));
        float vol   = sqrt(NdotV);
        vec3  col   = mix(uColor, vec3(1.0), pow(NdotV, 2.5));
        gl_FragColor = vec4(col, vol * uAlpha);
      }
    `;

    // 이리데센스 — 보는 각도에 따라 무지개빛이 흐르는 비눗방울 막
    const _glowFragIrid = `
      uniform vec3  uColor;
      uniform float uAlpha;
      uniform float uTime;
      varying vec3  vNormal;
      varying vec3  vViewPos;
      void main() {
        float ndv = abs(dot(normalize(vNormal), normalize(-vViewPos)));
        float hue = fract(ndv * 1.4 + uTime * 0.06);
        vec3 irid = 0.5 + 0.5 * cos(6.28318 * (vec3(0.0, 0.33, 0.67) + hue));
        float rim = pow(1.0 - ndv, 1.5);
        vec3 col  = mix(uColor, irid, 0.65) + vec3(0.4) * pow(rim, 3.0);
        gl_FragColor = vec4(col, (0.10 + rim * 0.9) * uAlpha);
      }
    `;

    function _makeGlowMat(color, type, alpha) {
      const frag = type === 'rim'  ? _glowFragRim
                 : type === 'vol'  ? _glowFragVol
                 : type === 'irid' ? _glowFragIrid
                 : _glowFragCore;
      return new THREE.ShaderMaterial({
        uniforms: {
          uColor: { value: new THREE.Color(color) },
          uAlpha: { value: alpha },
          uTime:  _uTime,
        },
        vertexShader:   _glowVert,
        fragmentShader: frag,
        transparent: true, depthWrite: false,
        blending: THREE.AdditiveBlending,
      });
    }

    // ─────────────────────────────────────────────────────────────
    // C02 — POINTER DOT
    // ─────────────────────────────────────────────────────────────

    const _ptrDots = {};

    function initPointerDot() {
      const coreGeo = new THREE.SphereGeometry(0.010, 16, 16);
      const rimGeo  = new THREE.SphereGeometry(0.026, 16, 16);

      for (const side of ['left', 'right']) {
        const core = new THREE.Mesh(coreGeo, _makeGlowMat(0xffffff,  'core', 0.95));
        const rim  = new THREE.Mesh(rimGeo,  _makeGlowMat(0x88eeff,  'rim',  0.70));
        core.add(rim);
        core.visible = false;
        scene.add(core);
        _ptrDots[side] = {
          mesh:       core,
          lazyPos:    new THREE.Vector3(),
          isPointing: false,
        };
      }
    }

    function _detectPointing(j) {
      if (!j.valid) return false;
      const wrist = j.wrist.pos;
      return j.indexTip.distanceTo(wrist)  > INDEX_EXTEND_MIN &&
             j.middleTip.distanceTo(wrist) < CURL_MAX &&
             j.ringTip.distanceTo(wrist)   < CURL_MAX &&
             j.pinkyTip.distanceTo(wrist)  < CURL_MAX;
    }

    function updatePointerDot() {
      for (const side of ['left', 'right']) {
        const dot = _ptrDots[side];
        if (!dot) continue;
        const j = ctx.handJoints[side];

        dot.isPointing = _detectPointing(j);

        if (dot.isPointing) {
          dot.lazyPos.lerp(j.indexTip, LAZY_LERP);
          dot.mesh.position.copy(dot.lazyPos);
          dot.mesh.visible = true;
        } else {
          dot.mesh.visible = false;
          if (j.valid) dot.lazyPos.copy(j.indexTip);
        }
      }
    }

    // ─────────────────────────────────────────────────────────────
    // C03 — HAND TRAIL
    // ─────────────────────────────────────────────────────────────

    const TRAIL_MAX_PTS = 600;

    // Open Brush Hypercolor — hue cycles along trail length and flows over time
    const _trailVert = `
      attribute float age;
      uniform float uTime;
      varying float vNorm;
      varying float vHue;
      void main() {
        float norm = clamp(age / ${TRAIL_LIFETIME.toFixed(1)}, 0.0, 1.0);
        vNorm = norm;
        vHue  = fract(norm * 2.0 + uTime * 0.28);
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        gl_PointSize = max(2.0, 12.0 * (1.0 - norm * 0.65));
        gl_Position  = projectionMatrix * mv;
      }
    `;
    const _trailFrag = `
      varying float vNorm;
      varying float vHue;
      vec3 hsv2rgb(float h, float s, float v) {
        vec4 K = vec4(1.0, 2.0/3.0, 1.0/3.0, 3.0);
        vec3 p = abs(fract(vec3(h) + K.xyz) * 6.0 - K.www);
        return v * mix(K.xxx, clamp(p - K.xxx, 0.0, 1.0), s);
      }
      void main() {
        float r    = length(gl_PointCoord - vec2(0.5));
        float glow = exp(-r * r * 14.0);
        float a    = glow * pow(1.0 - vNorm, 1.4) * 0.95;
        vec3  col  = hsv2rgb(vHue, 0.85, 1.0);
        gl_FragColor = vec4(col, a);
      }
    `;

    const _trails = {};

    function initHandTrail() {
      const mat = new THREE.ShaderMaterial({
        uniforms:       { uTime: { value: 0.0 } },
        vertexShader:   _trailVert,
        fragmentShader: _trailFrag,
        transparent:    true,
        depthWrite:     false,
        blending:       THREE.AdditiveBlending,
      });

      for (const side of ['left', 'right']) {
        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(TRAIL_MAX_PTS * 3), 3));
        geo.setAttribute('age',      new THREE.BufferAttribute(new Float32Array(TRAIL_MAX_PTS),     1));
        geo.setDrawRange(0, 0);

        const mesh = new THREE.Points(geo, mat.clone());
        mesh.frustumCulled = false;
        scene.add(mesh);

        _trails[side] = { mesh, pts: [], lastAddT: 0 };
      }
    }

    function updateHandTrail(timestamp) {
      const now = timestamp / 1000;

      for (const side of ['left', 'right']) {
        if (_trails[side]) _trails[side].mesh.material.uniforms.uTime.value = now;
      }

      for (const side of ['left', 'right']) {
        const trail = _trails[side];
        if (!trail) continue;
        const dot = _ptrDots[side];
        const j   = ctx.handJoints[side];

        // 새 점 추가
        if (dot?.isPointing && j.valid && (now - trail.lastAddT) >= TRAIL_ADD_INTERVAL) {
          const p    = dot.lazyPos;
          const prev = trail.pts[trail.pts.length - 1];
          if (prev) {
            const d = Math.hypot(p.x - prev.x, p.y - prev.y, p.z - prev.z);
            ctx.counters.trailLength += d;
            onTrailLengthUpdate();
          }
          trail.pts.push({ x: p.x, y: p.y, z: p.z, t: now });
          trail.lastAddT = now;
        }

        // 수명 만료 제거
        trail.pts = trail.pts.filter(pt => (now - pt.t) < TRAIL_LIFETIME);

        // 버퍼 갱신
        const geo    = trail.mesh.geometry;
        const posArr = geo.attributes.position.array;
        const ageArr = geo.attributes.age.array;
        const count  = Math.min(trail.pts.length, TRAIL_MAX_PTS);

        for (let i = 0; i < count; i++) {
          const pt = trail.pts[i];
          posArr[i * 3]     = pt.x;
          posArr[i * 3 + 1] = pt.y;
          posArr[i * 3 + 2] = pt.z;
          ageArr[i]         = now - pt.t;
        }
        geo.attributes.position.needsUpdate = true;
        geo.attributes.age.needsUpdate      = true;
        geo.setDrawRange(0, count);
      }

      // 글로벌 trailPoints 갱신 (C12에서 소비)
      ctx.trailPoints = [];
      for (const side of ['left', 'right']) {
        if (_trails[side]) {
          for (const pt of _trails[side].pts) ctx.trailPoints.push(pt);
        }
      }
    }

    // ─────────────────────────────────────────────────────────────
    // C04 — FIST RELEASE
    // ─────────────────────────────────────────────────────────────

    const _fist = {
      left:  { wasFist: false, prevWrist: new THREE.Vector3(), speed: 0 },
      right: { wasFist: false, prevWrist: new THREE.Vector3(), speed: 0 },
    };
    const _fistTmp = new THREE.Vector3();

    function _isFistClosed(j) {
      if (!j.valid) return false;
      const w = j.wrist.pos;
      return j.thumbTip.distanceTo(w)  < FIST_CURL_MAX &&
             j.indexTip.distanceTo(w)  < FIST_CURL_MAX &&
             j.middleTip.distanceTo(w) < FIST_CURL_MAX &&
             j.ringTip.distanceTo(w)   < FIST_CURL_MAX &&
             j.pinkyTip.distanceTo(w)  < FIST_CURL_MAX;
    }

    function updateFistRelease(dt) {
      for (const side of ['left', 'right']) {
        const j     = ctx.handJoints[side];
        const state = _fist[side];
        if (!j.valid) continue;

        // 손목 이동 속도 추정
        if (dt > 0) {
          _fistTmp.subVectors(j.wrist.pos, state.prevWrist);
          state.speed = _fistTmp.length() / dt;
        }
        state.prevWrist.copy(j.wrist.pos);

        const closed = _isFistClosed(j);
        const open   = j.indexTip.distanceTo(j.wrist.pos) > INDEX_EXTEND_MIN;

        if (state.wasFist && open && state.speed > 0.4) {
          const p = j.wrist.pos;
          triggerBubbleBurst(p.x, p.y, p.z);
          playBurstSound(p.x, p.y, p.z);
          if (DEBUG) console.log(`[fistRelease] ${side}`);
        }

        if (closed)     state.wasFist = true;
        else if (open)  state.wasFist = false;
      }
    }


    // ─────────────────────────────────────────────────────────────
    // C06 — TWO HAND GESTURE
    // ─────────────────────────────────────────────────────────────

    const _twoHand = { cupActive: false, cupHoldTime: 0, prevDist: 0 };
    const _twoHandMid = new THREE.Vector3();
    const _palmL      = new THREE.Vector3();
    const _palmR      = new THREE.Vector3();

    // 손바닥 중앙 근사: 손목과 중지 끝 사이의 약 40% 지점
    function _palmPos(j, out) {
      return out.copy(j.wrist.pos).lerp(j.middleTip, 0.4);
    }

    function updateTwoHandGesture(dt) {
      const lj = ctx.handJoints.left;
      const rj = ctx.handJoints.right;

      if (!lj.valid || !rj.valid) {
        if (_twoHand.cupActive) { _twoHand.cupActive = false; deactivateGlowOrb(); }
        _twoHand.prevDist    = 0;
        _twoHand.cupHoldTime = 0;
        return;
      }

      const dist = lj.wrist.pos.distanceTo(rj.wrist.pos);
      _palmPos(lj, _palmL);
      _palmPos(rj, _palmR);
      _twoHandMid.addVectors(_palmL, _palmR).multiplyScalar(0.5);

      // Cup 감지: 양손 간격 좁고 높이 유사
      const heightDiff = Math.abs(lj.wrist.pos.y - rj.wrist.pos.y);
      const isCupPose  = dist < CUP_HAND_MAX_DIST && heightDiff < 0.12;

      if (isCupPose) {
        _twoHand.cupHoldTime += dt;
        if (_twoHand.cupHoldTime >= 0.3 && !_twoHand.cupActive) {
          _twoHand.cupActive = true;
          activateGlowOrb(_twoHandMid.x, _twoHandMid.y, _twoHandMid.z);
          if (DEBUG) console.log('[twoHand] cup active');
        }
      } else {
        _twoHand.cupHoldTime = 0;
        if (_twoHand.cupActive) {
          _twoHand.cupActive = false;
          deactivateGlowOrb();
          if (DEBUG) console.log('[twoHand] cup inactive');
        }
      }
      if (_twoHand.cupActive) {
        updateGlowOrbPosition(_twoHandMid.x, _twoHandMid.y, _twoHandMid.z);
      }

      // Spread 감지: 가까이 있다가 빠르게 벌어짐
      if (dt > 0 && _twoHand.prevDist > 0 && _twoHand.prevDist < 0.3) {
        const speed = (dist - _twoHand.prevDist) / dt;
        if (speed > SPREAD_VELOCITY) {
          triggerShockwaveRing(_twoHandMid.x, _twoHandMid.y, _twoHandMid.z);
          playShockwaveSound(_twoHandMid.x, _twoHandMid.y, _twoHandMid.z);
          if (DEBUG) console.log('[twoHand] spread trigger');
        }
      }

      _twoHand.prevDist = dist;
    }

    // ─────────────────────────────────────────────────────────────
    // C18 — AMBIENT ENVIRONMENT
    // ─────────────────────────────────────────────────────────────

    const _ambVert = `
      attribute float alpha;
      varying float vA;
      void main() {
        vA = alpha;
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        gl_PointSize = max(4.0, 10.0 / max(0.1, -mv.z));
        gl_Position  = projectionMatrix * mv;
      }
    `;
    const _ambFrag = `
      varying float vA;
      void main() {
        float r = length(gl_PointCoord - vec2(0.5));
        if (r > 0.5) discard;
        gl_FragColor = vec4(0.85, 0.95, 1.0, vA*(1.0-r*1.8));
      }
    `;

    const AMB_MAX   = 200;
    const _ambBubs  = [];
    let   _ambMesh  = null;
    let   _ambPosA, _ambAlpA;
    let   _bubTimer = 0;

    function initAmbientEnvironment() {
      const geo = new THREE.BufferGeometry();
      _ambPosA = new Float32Array(AMB_MAX * 3);
      _ambAlpA = new Float32Array(AMB_MAX);
      geo.setAttribute('position', new THREE.BufferAttribute(_ambPosA, 3));
      geo.setAttribute('alpha',    new THREE.BufferAttribute(_ambAlpA, 1));
      geo.setDrawRange(0, 0);
      _ambMesh = new THREE.Points(geo, new THREE.ShaderMaterial({
        vertexShader: _ambVert, fragmentShader: _ambFrag,
        transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
      }));
      _ambMesh.frustumCulled = false;
      scene.add(_ambMesh);
    }

    function updateAmbientEnvironment(timestamp, dt) {
      if (!_ambMesh) return;
      const lvl = { silence:0, whisper:1, call:2, sing:3 }[ctx.voiceHeld] ?? 0;

      // Bubble emission
      const rate = BUBBLE_RATE_BASE + (BUBBLE_RATE_SING - BUBBLE_RATE_BASE) * (lvl / 3);
      _bubTimer += dt;
      while (_bubTimer >= 1.0 / rate) {
        _bubTimer -= 1.0 / rate;
        if (_ambBubs.length < AMB_MAX) {
          const r = SPAWN_RADIUS_XZ * Math.sqrt(Math.random());
          const a = Math.random() * Math.PI * 2;
          _ambBubs.push({
            x: ctx.headPos.x + r*Math.cos(a), y: FISH_FLOOR_Y,
            z: ctx.headPos.z + r*Math.sin(a),
            vx: (Math.random()-0.5)*0.04, vz: (Math.random()-0.5)*0.04,
            age: 0, lt: 3.0 + Math.random()*3.0,
          });
        }
      }

      // Update bubbles
      for (let i = _ambBubs.length - 1; i >= 0; i--) {
        const b = _ambBubs[i];
        b.age += dt;
        if (b.age >= b.lt || b.y > FISH_CEIL_Y + 0.5) { _ambBubs.splice(i, 1); continue; }
        b.y += BUBBLE_RISE_SPEED * dt * (0.7 + Math.sin(b.age*2 + b.x)*0.3);
        b.x += b.vx * dt;  b.z += b.vz * dt;
      }
      const count = Math.min(_ambBubs.length, AMB_MAX);
      for (let i = 0; i < count; i++) {
        const b = _ambBubs[i], n = b.age / b.lt;
        _ambPosA[i*3] = b.x; _ambPosA[i*3+1] = b.y; _ambPosA[i*3+2] = b.z;
        _ambAlpA[i]   = n < 0.1 ? n*10 : n > 0.8 ? (1-n)*5 : 0.5;
      }
      _ambMesh.geometry.attributes.position.needsUpdate = true;
      _ambMesh.geometry.attributes.alpha.needsUpdate    = true;
      _ambMesh.geometry.setDrawRange(0, count);
    }

    // ─────────────────────────────────────────────────────────────
    // C20 — UNDERWATER ATMOSPHERE  (플랑크톤 / 빛기둥 / 바닥 커스틱)
    // 현실 방을 "물에 잠긴 공간"으로 — 전부 1드로우콜씩, 애니메이션은 GPU
    // ─────────────────────────────────────────────────────────────

    const PLANKTON_COUNT = 240;
    const SHAFT_COUNT    = 5;

    let _planktonMesh = null;
    let _shaftMesh    = null;
    let _causticMesh  = null;

    // 플랑크톤: 떠다니는 미세 발광 입자. 음성 레벨에 따라 밝아짐 (WHISPER=발광 시작)
    const _plkVert = `
      attribute float aSeed;
      uniform float uTime;
      varying float vTw;
      varying float vSeed;
      void main() {
        vSeed = aSeed;
        vec3 p = position;
        p.x += sin(uTime * 0.13 + aSeed * 7.1)  * 0.18;
        p.y += sin(uTime * 0.09 + aSeed * 13.7) * 0.12;
        p.z += cos(uTime * 0.11 + aSeed * 5.3)  * 0.18;
        vec4 mv = modelViewMatrix * vec4(p, 1.0);
        vTw = 0.55 + 0.45 * sin(uTime * (1.2 + fract(aSeed) * 1.8) + aSeed * 20.0);
        // Quest 3 근거리 파티클 규칙: flat 위주 + 원거리 감쇠, 폭주 방지 clamp
        gl_PointSize = clamp(7.0 / max(0.3, -mv.z), 1.5, 8.0);
        gl_Position = projectionMatrix * mv;
      }
    `;
    const _plkFrag = `
      uniform float uVoice;
      varying float vTw;
      varying float vSeed;
      void main() {
        float r = length(gl_PointCoord - vec2(0.5));
        if (r > 0.5) discard;
        float glow = exp(-r * r * 12.0);
        // 대부분 시안-화이트, 일부는 따뜻한 금빛 입자
        vec3 col = mix(vec3(0.55, 0.90, 1.0), vec3(1.0, 0.85, 0.55), step(0.87, fract(vSeed * 0.371)));
        float a = glow * vTw * (0.26 + uVoice * 0.6);
        gl_FragColor = vec4(col, a);
      }
    `;

    // 빛기둥: 수면에서 내려오는 godray. Y축 실린드리컬 빌보드로 항상 면이 보임
    const _shaftVert = `
      attribute vec2  aOffset;
      attribute vec2  aSize;
      attribute float aSeed;
      varying vec2  vUv;
      varying float vSeed;
      void main() {
        vec3 r0 = vec3(viewMatrix[0][0], 0.0, viewMatrix[2][0]);
        vec3 right = normalize(r0 + vec3(1e-4, 0.0, 0.0));
        vec3 wp = position + right * (aOffset.x * aSize.x) + vec3(0.0, aOffset.y * aSize.y, 0.0);
        vUv   = vec2(aOffset.x + 0.5, aOffset.y);
        vSeed = aSeed;
        gl_Position = projectionMatrix * viewMatrix * vec4(wp, 1.0);
      }
    `;
    const _shaftFrag = `
      uniform float uTime;
      uniform float uVoice;
      varying vec2  vUv;
      varying float vSeed;
      void main() {
        float ex = pow(1.0 - abs(vUv.x * 2.0 - 1.0), 2.2);
        float ey = smoothstep(0.0, 0.35, vUv.y) * (0.30 + 0.70 * vUv.y);
        ey *= 1.0 - smoothstep(0.85, 1.0, vUv.y) * 0.6;
        float flick = 0.7 + 0.3 * sin(uTime * 0.45 + vSeed * 6.0);
        float a = ex * ey * flick * (0.075 + uVoice * 0.12);
        gl_FragColor = vec4(vec3(0.55, 0.82, 1.0), a);
      }
    `;

    // 바닥 커스틱: 실제 방바닥 위에 일렁이는 물빛 그물 무늬
    const _causVert = `
      varying vec2 vUv;
      varying vec2 vWorld;
      void main() {
        vUv = uv;
        vec4 wp = modelMatrix * vec4(position, 1.0);
        vWorld = wp.xz;
        gl_Position = projectionMatrix * viewMatrix * wp;
      }
    `;
    const _causFrag = `
      uniform float uTime;
      uniform float uVoice;
      varying vec2 vUv;
      varying vec2 vWorld;
      void main() {
        vec2 p = vWorld * 3.2;
        float a1 = sin(p.x * 2.1 + uTime * 0.85) + sin(p.y * 1.9 - uTime * 0.65)
                 + sin((p.x + p.y) * 1.3 + uTime * 0.45);
        float a2 = sin(p.x * 1.6 - uTime * 0.55 + p.y * 2.3)
                 + sin(p.y * 1.4 + uTime * 0.75 - p.x * 2.0);
        float ca = pow(clamp(1.0 - abs(a1 + a2) * 0.32, 0.0, 1.0), 6.0);
        float fade = 1.0 - smoothstep(0.55, 1.0, length(vUv * 2.0 - 1.0));
        float a = ca * fade * (0.40 + uVoice * 0.36);
        gl_FragColor = vec4(vec3(0.50, 0.85, 1.0), a);
      }
    `;

    function initAtmosphere() {
      if (_planktonMesh) return;

      // 플랑크톤
      {
        const pos  = new Float32Array(PLANKTON_COUNT * 3);
        const seed = new Float32Array(PLANKTON_COUNT);
        for (let i = 0; i < PLANKTON_COUNT; i++) {
          const r = 0.7 + Math.sqrt(Math.random()) * 2.5;
          const a = Math.random() * Math.PI * 2;
          pos[i*3]   = Math.cos(a) * r;
          pos[i*3+1] = 0.25 + Math.random() * 2.45;
          pos[i*3+2] = Math.sin(a) * r;
          seed[i]    = Math.random() * 100.0;
        }
        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
        geo.setAttribute('aSeed',    new THREE.BufferAttribute(seed, 1));
        _planktonMesh = new THREE.Points(geo, new THREE.ShaderMaterial({
          uniforms: { uTime: _uTime, uVoice: _uVoice },
          vertexShader: _plkVert, fragmentShader: _plkFrag,
          transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
        }));
        _planktonMesh.frustumCulled = false;
        scene.add(_planktonMesh);
      }

      // 빛기둥 (전부 한 지오메트리에 머지 → 1드로우콜)
      {
        const centers = [], offsets = [], sizes = [], seeds = [], idx = [];
        for (let s = 0; s < SHAFT_COUNT; s++) {
          const a  = (s / SHAFT_COUNT) * Math.PI * 2 + Math.random() * 0.8;
          const r  = 1.3 + Math.random() * 1.1;
          const cx = Math.cos(a) * r, cz = Math.sin(a) * r;
          const w  = 0.45 + Math.random() * 0.45;
          const h  = 2.6 + Math.random() * 0.6;
          const sd = Math.random() * 10;
          for (const [u, v] of [[-0.5,0],[0.5,0],[0.5,1],[-0.5,1]]) {
            centers.push(cx, 0.25, cz);
            offsets.push(u, v);
            sizes.push(w, h);
            seeds.push(sd);
          }
          const b = s * 4;
          idx.push(b, b+1, b+2, b, b+2, b+3);
        }
        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.Float32BufferAttribute(centers, 3));
        geo.setAttribute('aOffset',  new THREE.Float32BufferAttribute(offsets, 2));
        geo.setAttribute('aSize',    new THREE.Float32BufferAttribute(sizes, 2));
        geo.setAttribute('aSeed',    new THREE.Float32BufferAttribute(seeds, 1));
        geo.setIndex(idx);
        _shaftMesh = new THREE.Mesh(geo, new THREE.ShaderMaterial({
          uniforms: { uTime: _uTime, uVoice: _uVoice },
          vertexShader: _shaftVert, fragmentShader: _shaftFrag,
          transparent: true, depthWrite: false, side: THREE.DoubleSide,
          blending: THREE.AdditiveBlending,
        }));
        _shaftMesh.frustumCulled = false;
        scene.add(_shaftMesh);
      }

      // 바닥 커스틱 (사용자를 천천히 따라옴)
      {
        const geo = new THREE.CircleGeometry(2.6, 48);
        _causticMesh = new THREE.Mesh(geo, new THREE.ShaderMaterial({
          uniforms: { uTime: _uTime, uVoice: _uVoice },
          vertexShader: _causVert, fragmentShader: _causFrag,
          transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
        }));
        _causticMesh.rotation.x = -Math.PI / 2;
        _causticMesh.position.y = 0.01;
        scene.add(_causticMesh);
      }
    }

    function updateAtmosphere(timestamp, dt) {
      _uTime.value = timestamp / 1000;
      const lvl = { silence:0, whisper:1, call:2, sing:3 }[ctx.voiceHeld] ?? 0;
      _uVoice.value += (lvl / 3 - _uVoice.value) * Math.min(1, dt * 1.5);
      if (_causticMesh) {
        _causticMesh.position.x += (ctx.headPos.x - _causticMesh.position.x) * 0.02;
        _causticMesh.position.z += (ctx.headPos.z - _causticMesh.position.z) * 0.02;
      }
    }

    // ─────────────────────────────────────────────────────────────
    // PHASE 4 HELPERS
    // ─────────────────────────────────────────────────────────────

    const FISH_S_ORBIT_R = 0.6;
    const FISH_M_ORBIT_R = 0.9;
    const FISH_L_ORBIT_R = 1.5;

    // 재사용 임시 변수 (GC 방지)
    const _iMat  = new THREE.Matrix4();
    const _iPos  = new THREE.Vector3();
    const _iQuat = new THREE.Quaternion();
    const _iScl  = new THREE.Vector3(1, 1, 1);
    const _iEul  = new THREE.Euler();
    const _jScl  = new THREE.Vector3();

    function _randomSpawnPos() {
      const r = SPAWN_RADIUS_XZ * 0.6 * Math.sqrt(Math.random());
      const a = Math.random() * Math.PI * 2;
      return [
        ctx.headPos.x + r * Math.cos(a),
        ctx.spawnEyeY + (Math.random() - 0.5) * 0.8,
        ctx.headPos.z + r * Math.sin(a),
      ];
    }

    function _steerToward(f, tx, ty, tz, str, dt) {
      const dx = tx-f.x, dy = ty-f.y, dz = tz-f.z;
      const d  = Math.sqrt(dx*dx+dy*dy+dz*dz) + 0.001;
      f.vx += (dx/d)*str*dt; f.vy += (dy/d)*str*dt; f.vz += (dz/d)*str*dt;
    }

    function _clampSpeed(f, max) {
      const s = Math.sqrt(f.vx*f.vx+f.vy*f.vy+f.vz*f.vz);
      if (s > max) { const k=max/s; f.vx*=k; f.vy*=k; f.vz*=k; }
    }

    function _constrainVolume(f) {
      const dx=f.x-ctx.headPos.x, dz=f.z-ctx.headPos.z;
      const r = Math.sqrt(dx*dx+dz*dz);
      if (r > SPAWN_RADIUS_XZ) { f.vx -= (dx/r)*0.5; f.vz -= (dz/r)*0.5; }
      if (f.y < FISH_FLOOR_Y+0.05) f.vy += 1.5;
      if (f.y > FISH_CEIL_Y -0.05) f.vy -= 1.5;
    }

    function _boidsForce(f, flock, sepR, aliR, cohR, dt) {
      let sx=0,sy=0,sz=0,sc=0, ax=0,ay=0,az=0,ac=0, cx=0,cy=0,cz=0,cc=0;
      for (const o of flock) {
        if (o===f) continue;
        const dx=f.x-o.x, dy=f.y-o.y, dz=f.z-o.z;
        const d2=dx*dx+dy*dy+dz*dz;
        if (d2<sepR*sepR&&d2>0){const d=Math.sqrt(d2);sx+=dx/d;sy+=dy/d;sz+=dz/d;sc++;}
        if (d2<aliR*aliR){ax+=o.vx;ay+=o.vy;az+=o.vz;ac++;}
        if (d2<cohR*cohR){cx+=o.x;cy+=o.y;cz+=o.z;cc++;}
      }
      if (sc>0){f.vx+=sx/sc*1.5*dt;f.vy+=sy/sc*1.5*dt;f.vz+=sz/sc*1.5*dt;}
      if (ac>0){f.vx+=ax/ac*dt;    f.vy+=ay/ac*dt;    f.vz+=az/ac*dt;}
      if (cc>0){const tx=cx/cc-f.x,ty=cy/cc-f.y,tz=cz/cc-f.z;
                f.vx+=tx*0.8*dt;f.vy+=ty*0.8*dt;f.vz+=tz*0.8*dt;}
    }

    function _applyScatterImpulse(f, sx, sy, sz, r) {
      const dx=f.x-sx, dy=f.y-sy, dz=f.z-sz;
      const d=Math.sqrt(dx*dx+dy*dy+dz*dz);
      if (d<r) {
        const force=(r-d)/r*2.5;
        const nx=d>0.01?dx/d:(Math.random()-0.5);
        const nz=d>0.01?dz/d:(Math.random()-0.5);
        f.vx+=nx*force; f.vy+=0.2*force; f.vz+=nz*force;
        f.scatterTimer=1.5;
      }
    }

    // ─────────────────────────────────────────────────────────────
    // C12 — FISH SCHOOL  (소형 + 중형 InstancedMesh)
    // ─────────────────────────────────────────────────────────────

    const _fishSData = [];
    const _fishMData = [];
    let   _fishSMesh = null;
    let   _fishMMesh = null;

    function initFishSchool() {
      if (!models.fishS || _fishSMesh) return;   // 세션 재진입 시 중복 생성 방지

      // 인스턴스별 꼬리 스웨이 위상(aPhase) + 터치 플래시 시각(aFlash)
      const addPhase = (geo, n) => {
        const arr = new Float32Array(n);
        for (let i = 0; i < n; i++) arr[i] = Math.random() * Math.PI * 2;
        geo.setAttribute('aPhase', new THREE.InstancedBufferAttribute(arr, 1));
        const fl = new Float32Array(n).fill(-1000);
        geo.setAttribute('aFlash', new THREE.InstancedBufferAttribute(fl, 1));
      };

      // clown_fish.glb는 이미 +Z forward로 베이크되어 있다고 가정 (틀리면 makeRotationY(Math.PI) 등으로 보정)
      // material.clone() 금지 — clone하면 _uTime/_uVoice 공유 참조가 끊김
      const sChild = models.fishS.children[0];
      addPhase(sChild.geometry, 15);
      _fishSMesh = new THREE.InstancedMesh(sChild.geometry, sChild.material, 15);
      _fishSMesh.count = 0; _fishSMesh.frustumCulled = false;
      scene.add(_fishSMesh);

      const mChild = models.fishM.children[0];
      addPhase(mChild.geometry, 6);
      _fishMMesh = new THREE.InstancedMesh(mChild.geometry, mChild.material, 6);
      _fishMMesh.count = 0; _fishMMesh.frustumCulled = false;
      scene.add(_fishMMesh);
    }

    function spawnFishS(x, y, z) {
      if (_fishSData.length >= 15) return;
      _fishSData.push({ x, y, z, vx:(Math.random()-0.5)*0.2, vy:0, vz:(Math.random()-0.5)*0.2,
        ry:Math.random()*Math.PI*2, phase:Math.random()*Math.PI*2, scatterTimer:0 });
      ctx.spawnState.fishSCount = _fishSData.length;
    }

    function spawnFishM(x, y, z) {
      if (_fishMData.length >= 6) return;
      _fishMData.push({ x, y, z, vx:(Math.random()-0.5)*0.1, vy:0, vz:(Math.random()-0.5)*0.1,
        ry:Math.random()*Math.PI*2, phase:Math.random()*Math.PI*2, scatterTimer:0 });
      ctx.spawnState.fishMCount = _fishMData.length;
    }

    function scatterFishAt(x, y, z) {
      for (const f of _fishSData) _applyScatterImpulse(f, x, y, z, BURST_SCATTER_R);
      for (const f of _fishMData) _applyScatterImpulse(f, x, y, z, BURST_SCATTER_R);
    }

    function _updateFishGroup(flock, mesh, maxSpd, freq, amp, bob, sepR, aliR, cohR, orbitR, dt) {
      if (!mesh || flock.length === 0) return;
      const now = performance.now() / 1000;
      const lvl = { silence:0, whisper:1, call:2, sing:3 }[ctx.voiceHeld] ?? 0;

      for (let i = 0; i < flock.length; i++) {
        const f = flock[i];
        if (f.scatterTimer > 0) f.scatterTimer -= dt;

        // 우선순위 상태 결정
        let state = 'swim';
        if (f.scatterTimer > 0)                   state = 'scattered';
        else if (ctx.foodParticles.length > 0 && lvl < 2) state = 'food';
        else if (lvl === 3)                        state = 'orbit';
        else if (lvl === 2)                        state = 'gather';
        else if (ctx.trailPoints.length > 0)       state = 'trail';

        // 상태별 조종력
        if (state === 'food') {
          let near=null, nd=FOOD_ATTRACT_R*FOOD_ATTRACT_R;
          for (const p of ctx.foodParticles) {
            const d2=(p.x-f.x)**2+(p.y-f.y)**2+(p.z-f.z)**2;
            if (d2<nd){nd=d2;near=p;}
          }
          if (near) _steerToward(f, near.x, near.y, near.z, 4.0, dt);
        } else if (state === 'gather') {
          _steerToward(f, ctx.headPos.x, ctx.spawnEyeY*0.85, ctx.headPos.z-USER_NEAR_DIST, 3.5, dt);
        } else if (state === 'orbit') {
          const ang = Math.atan2(f.z-ctx.headPos.z, f.x-ctx.headPos.x) + 0.8*dt;
          _steerToward(f,
            ctx.headPos.x + Math.cos(ang)*orbitR,
            ctx.spawnEyeY*0.85,
            ctx.headPos.z + Math.sin(ang)*orbitR, 4.0, dt);
        } else if (state === 'trail') {
          let near=null, nd=TRAIL_FISH_FOLLOW_R*TRAIL_FISH_FOLLOW_R;
          const n2 = performance.now()/1000;
          for (const pt of ctx.trailPoints) {
            if (n2-pt.t > TRAIL_LIFETIME*0.5) continue;
            const d2=(pt.x-f.x)**2+(pt.y-f.y)**2+(pt.z-f.z)**2;
            if (d2<nd){nd=d2;near=pt;}
          }
          if (near) _steerToward(f, near.x, near.y, near.z, 3.0, dt);
        }

        // 보이드 (swim 상태에서 100%, 다른 상태에서 30%)
        _boidsForce(f, flock, sepR, aliR, cohR, dt * (state==='swim'?1.0:0.3));

        f.vy *= 0.95;
        _constrainVolume(f);
        _clampSpeed(f, maxSpd);
        f.x += f.vx*dt; f.y += f.vy*dt; f.z += f.vz*dt;

        // 진행 방향으로 회전
        const spd2d = Math.sqrt(f.vx*f.vx + f.vz*f.vz);
        if (spd2d > 0.02) f.ry = Math.atan2(f.vx, f.vz);

        // InstancedMesh 행렬 갱신
        const yaw = f.ry + Math.sin(now*freq+f.phase)*amp;
        _iPos.set(f.x, f.y + Math.sin(now*1.5+f.phase)*bob, f.z);
        _iEul.set(0, yaw, 0);
        _iQuat.setFromEuler(_iEul);
        _iMat.compose(_iPos, _iQuat, _iScl);
        mesh.setMatrixAt(i, _iMat);
      }
      mesh.instanceMatrix.needsUpdate = true;
      mesh.count = flock.length;
    }

    function updateFishSchool(timestamp, dt) {
      _updateFishGroup(_fishSData, _fishSMesh, FISH_S_SPEED, 4.0, 0.20, 0.015,
        FISH_S_SEP_R, FISH_S_ALIGN_R, FISH_S_COH_R, FISH_S_ORBIT_R, dt);
      _updateFishGroup(_fishMData, _fishMMesh, FISH_M_SPEED, 2.8, 0.14, 0.015,
        FISH_S_SEP_R*1.5, FISH_S_ALIGN_R*1.5, FISH_S_COH_R*1.5, FISH_M_ORBIT_R, dt);
    }

    // ─────────────────────────────────────────────────────────────
    // C13 — FISH LARGE  (개별 Mesh, 최대 2마리)
    // ─────────────────────────────────────────────────────────────

    const _fishLData = [];

    function spawnFishL(x, y, z) {
      if (_fishLData.length >= 2) return;
      const mesh = models.fishL.clone();
      // 터치 플래시(uFlashT)를 개체별로 — 재질 분리 후 공유 유니폼 재연결
      mesh.traverse(c => {
        if (c.isMesh && c.material?.uniforms) {
          c.material = c.material.clone();
          c.material.uniforms.uTime  = _uTime;
          c.material.uniforms.uVoice = _uVoice;
        }
      });
      scene.add(mesh);
      const [wx, wy, wz] = _randomSpawnPos();
      _fishLData.push({ x, y, z, vx:0, vy:0, vz:0,
        ry:Math.random()*Math.PI*2, phase:Math.random()*Math.PI*2,
        scatterTimer:0, wpx:wx, wpy:wy, wpz:wz, wpTimer:0, mesh });
      ctx.spawnState.fishLCount = _fishLData.length;
    }

    function updateFishLarge(timestamp, dt) {
      const now = timestamp / 1000;
      const lvl = { silence:0, whisper:1, call:2, sing:3 }[ctx.voiceHeld] ?? 0;

      for (const f of _fishLData) {
        f.scatterTimer = Math.max(f.scatterTimer-dt, 0);
        f.wpTimer      = Math.max(f.wpTimer-dt, 0);

        const distWp = Math.hypot(f.x-f.wpx, f.y-f.wpy, f.z-f.wpz);
        if (f.wpTimer <= 0 || distWp < 0.15) {
          const [wx,wy,wz] = _randomSpawnPos();
          f.wpx=wx; f.wpy=wy; f.wpz=wz; f.wpTimer = 6+Math.random()*6;
        }

        let tx=f.wpx, ty=f.wpy, tz=f.wpz;
        if (f.scatterTimer <= 0) {
          if (lvl === 3) {
            const ang = Math.atan2(f.z-ctx.headPos.z, f.x-ctx.headPos.x) + 0.3*dt;
            tx=ctx.headPos.x+Math.cos(ang)*FISH_L_ORBIT_R;
            ty=ctx.spawnEyeY*0.85;
            tz=ctx.headPos.z+Math.sin(ang)*FISH_L_ORBIT_R;
          } else if (lvl === 2) {
            tx=ctx.headPos.x; ty=ctx.spawnEyeY*0.85; tz=ctx.headPos.z-2.0;
          }
        }

        _steerToward(f, tx, ty, tz, FISH_L_SPRING_K, dt);
        f.vx *= (1-FISH_L_SPRING_D*dt*2); f.vy *= 0.95; f.vz *= (1-FISH_L_SPRING_D*dt*2);
        _constrainVolume(f);
        _clampSpeed(f, FISH_L_SPEED);
        f.x+=f.vx*dt; f.y+=f.vy*dt; f.z+=f.vz*dt;

        const s2d = Math.sqrt(f.vx*f.vx+f.vz*f.vz);
        if (s2d > 0.01) f.ry = Math.atan2(f.vx, f.vz);

        f.mesh.position.set(f.x, f.y+Math.sin(now*0.8+f.phase)*0.02, f.z);
        f.mesh.rotation.y = f.ry + Math.sin(now*1.8+f.phase)*0.10;
      }
    }

    // ─────────────────────────────────────────────────────────────
    // C21 — FISH TOUCH + LIGHT MOTES
    // 만지면 반짝 + 빛 알갱이를 떨어뜨림 → 손으로 수집 → 고래 게이지
    // ─────────────────────────────────────────────────────────────

    const _moteVert = `
      attribute float aSeed;
      attribute float aAlpha;
      uniform float uTime;
      varying float vSeed;
      varying float vA;
      void main() {
        vSeed = aSeed; vA = aAlpha;
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        float pulse = 0.85 + 0.15 * sin(uTime * 4.0 + aSeed * 17.0);
        gl_PointSize = clamp(10.0 / max(0.3, -mv.z), 4.0, 16.0) * pulse;
        gl_Position = projectionMatrix * mv;
      }
    `;
    const _moteFrag = `
      varying float vSeed;
      varying float vA;
      void main() {
        float r = length(gl_PointCoord - vec2(0.5));
        if (r > 0.5) discard;
        float glow = exp(-r * r * 9.0);
        vec3 col = mix(vec3(1.0, 0.85, 0.45), vec3(1.0, 1.0, 0.85), glow);
        gl_FragColor = vec4(col, glow * vA);
      }
    `;

    const _motes = [];
    let   _moteMesh = null;

    function initMotes() {
      if (_moteMesh) return;
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(MOTE_MAX * 3), 3));
      geo.setAttribute('aSeed',    new THREE.BufferAttribute(new Float32Array(MOTE_MAX), 1));
      geo.setAttribute('aAlpha',   new THREE.BufferAttribute(new Float32Array(MOTE_MAX), 1));
      geo.setDrawRange(0, 0);
      _moteMesh = new THREE.Points(geo, new THREE.ShaderMaterial({
        uniforms: { uTime: _uTime },
        vertexShader: _moteVert, fragmentShader: _moteFrag,
        transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
      }));
      _moteMesh.frustumCulled = false;
      scene.add(_moteMesh);
    }

    function spawnLightMote(x, y, z) {
      if (_motes.length >= MOTE_MAX) _motes.shift();
      _motes.push({
        x, y, z,
        vx: (Math.random() - 0.5) * 0.10,
        vy: 0.04 + Math.random() * 0.05,
        vz: (Math.random() - 0.5) * 0.10,
        age: 0, seed: Math.random() * 100, state: 'free',
        sx: 0, sy: 0, sz: 0, ft: 0,
      });
    }

    // 터치/수집 판정에 쓰는 손 포인트 (검지 끝 + 손바닥 중앙)
    const _tpA = new THREE.Vector3();
    const _tpB = new THREE.Vector3();
    const _touchPts = [];
    function _touchPoints() {
      _touchPts.length = 0;
      for (const side of ['left', 'right']) {
        const j = ctx.handJoints[side];
        if (!j.valid) continue;
        _touchPts.push(j.indexTip);
        _touchPts.push(_palmPos(j, side === 'left' ? _tpA : _tpB));
      }
      return _touchPts;
    }

    function updateMotes(timestamp, dt) {
      if (!_moteMesh) return;
      const hands = _touchPoints();
      const gp = _gauge.pos;

      for (let i = _motes.length - 1; i >= 0; i--) {
        const m = _motes[i];
        if (m.state === 'free') {
          m.age += dt;
          if (m.age >= MOTE_LIFETIME) { _motes.splice(i, 1); continue; }
          // 부드러운 부유
          m.vx *= 0.985; m.vy *= 0.985; m.vz *= 0.985;
          m.x += m.vx * dt;
          m.y += m.vy * dt + Math.sin(m.age * 1.7 + m.seed) * 0.012 * dt;
          m.z += m.vz * dt;
          // 손에 닿으면 수집 → 게이지로 날아감
          for (const h of hands) {
            const dx = m.x - h.x, dy = m.y - h.y, dz = m.z - h.z;
            if (dx*dx + dy*dy + dz*dz < MOTE_COLLECT_R * MOTE_COLLECT_R) {
              m.state = 'fly'; m.ft = 0;
              m.sx = m.x; m.sy = m.y; m.sz = m.z;
              playCollectSound(m.x, m.y, m.z);
              break;
            }
          }
        } else {
          m.ft += dt;
          const t = Math.min(m.ft / MOTE_FLY_DUR, 1.0);
          const e = t * t;   // ease-in: 게이지에 빨려들 듯
          m.x = m.sx + (gp.x - m.sx) * e;
          m.y = m.sy + (gp.y - m.sy) * e;
          m.z = m.sz + (gp.z - m.sz) * e;
          if (t >= 1.0) { _motes.splice(i, 1); gaugeAdd(GAIN_MOTE); continue; }
        }
      }

      // 버퍼 갱신
      const pos  = _moteMesh.geometry.attributes.position.array;
      const seed = _moteMesh.geometry.attributes.aSeed.array;
      const alp  = _moteMesh.geometry.attributes.aAlpha.array;
      const count = Math.min(_motes.length, MOTE_MAX);
      for (let i = 0; i < count; i++) {
        const m = _motes[i];
        pos[i*3] = m.x; pos[i*3+1] = m.y; pos[i*3+2] = m.z;
        seed[i] = m.seed;
        const fadeIn  = Math.min(m.age * 4, 1);
        const fadeOut = m.state === 'free' ? Math.min((MOTE_LIFETIME - m.age) / 2, 1) : 1;
        alp[i] = 0.95 * fadeIn * Math.max(fadeOut, 0);
      }
      _moteMesh.geometry.attributes.position.needsUpdate = true;
      _moteMesh.geometry.attributes.aSeed.needsUpdate    = true;
      _moteMesh.geometry.attributes.aAlpha.needsUpdate   = true;
      _moteMesh.geometry.setDrawRange(0, count);
    }

    function _setFishFlash(mesh, i, t) {
      const attr = mesh?.geometry?.attributes?.aFlash;
      if (!attr) return;
      attr.array[i] = t;
      attr.needsUpdate = true;
    }

    function updateFishTouch(timestamp, dt) {
      const now = timestamp / 1000;
      const hands = _touchPoints();
      if (hands.length === 0) return;

      const tryTouch = (flock, touchR, flash, size) => {
        for (let i = 0; i < flock.length; i++) {
          const f = flock[i];
          if (now - (f.lastTouch ?? -10) < TOUCH_COOLDOWN) continue;
          for (const h of hands) {
            const dx = f.x - h.x, dy = f.y - h.y, dz = f.z - h.z;
            if (dx*dx + dy*dy + dz*dz >= touchR * touchR) continue;
            f.lastTouch = now;
            // 반짝 + 살짝 도망쳤다 돌아옴
            const d = Math.sqrt(dx*dx + dy*dy + dz*dz) || 0.01;
            f.vx += dx/d * 0.7; f.vy += dy/d * 0.3; f.vz += dz/d * 0.7;
            f.scatterTimer = Math.max(f.scatterTimer ?? 0, 0.7);
            flash(i, now);
            spawnLightMote(f.x, f.y, f.z);
            playTouchSound(f.x, f.y, f.z, size);
            break;
          }
        }
      };

      tryTouch(_fishSData, TOUCH_R_S, (i, t) => _setFishFlash(_fishSMesh, i, t), 0);
      tryTouch(_fishMData, TOUCH_R_M, (i, t) => _setFishFlash(_fishMMesh, i, t), 1);
      tryTouch(_fishLData, TOUCH_R_L, (i, t) => {
        _fishLData[i].mesh.traverse(c => {
          if (c.isMesh && c.material?.uniforms?.uFlashT) c.material.uniforms.uFlashT.value = t;
        });
      }, 2);
    }

    // ─────────────────────────────────────────────────────────────
    // C14 — JELLYFISH  (벨 + 발광 베일, InstancedMesh ×2, 최대 8개)
    // 맥동·스웨이·발광 전부 GPU 셰이더에서 처리 — CPU는 위치만 관리
    // ─────────────────────────────────────────────────────────────

    const JELLY_MAX = 8;
    const _JELLY_PULSE_W = (2 * Math.PI / JELLY_PULSE_PERIOD).toFixed(4);   // 맥박 각속도

    const _jellyBellVert = `
      attribute float aPhase;
      uniform float uTime;
      varying vec3  vNormal;
      varying vec3  vViewPos;
      varying float vH;
      varying float vPh;
      void main() {
        // 호흡 맥동: 림(아래)이 크게, 정수리(위)는 작게 + 수직 카운터 스쿼시
        float pulse = sin(uTime * ${_JELLY_PULSE_W} + aPhase);
        float hN    = position.y / ${JELLY_UMBRELLA_R.toFixed(3)};
        vec3 p = position;
        float radial = 1.0 + pulse * 0.13 * (1.0 - clamp(hN, 0.0, 1.0));
        p.x *= radial;
        p.z *= radial;
        p.y *= 1.0 - pulse * 0.07;
        vec4 mp = vec4(p, 1.0);
        vec3 n  = normal;
        #ifdef USE_INSTANCING
          mp = instanceMatrix * mp;
          n  = mat3(instanceMatrix) * n;
        #endif
