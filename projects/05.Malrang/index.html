<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Malrang</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; }
    canvas { display: block; }

    #overlay {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(0, 8, 12, 0.92);
    }
    #overlay.hidden { display: none; }
    #overlay h1 {
      color: #88ffcc; font-size: 2.4rem;
      letter-spacing: 0.18em; font-weight: 300;
      margin-bottom: 0.6rem;
    }
    #overlay p {
      color: rgba(136, 255, 204, 0.5);
      font-size: 0.9rem; letter-spacing: 0.1em;
      margin-bottom: 3rem;
    }
    #btnXR {
      padding: 0.9rem 3rem; font-size: 1.05rem;
      background: transparent; color: #88ffcc;
      border: 1px solid rgba(136, 255, 204, 0.6);
      border-radius: 6px; cursor: pointer;
      letter-spacing: 0.12em;
      transition: background 0.25s, border-color 0.25s;
    }
    #btnXR:hover { background: rgba(136, 255, 204, 0.1); border-color: #88ffcc; }
    #errMsg {
      color: #ff8877; margin-top: 1.6rem;
      font-size: 0.82rem; text-align: center;
      max-width: 320px; line-height: 1.5;
    }
    #dbg {
      position: fixed; top: 0.8rem; left: 0.8rem; z-index: 20;
      color: #88ffcc; font-family: monospace; font-size: 0.72rem;
      line-height: 1.6; pointer-events: none;
      text-shadow: 0 0 6px #000; display: none;
    }
  </style>
</head>
<body>

  <div id="overlay">
    <h1>Malrang</h1>
    <p>말랑말랑한 무언가</p>
    <button id="btnXR">만져보기</button>
    <div id="errMsg"></div>
  </div>
  <div id="dbg"></div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.165.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.165.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { MarchingCubes } from 'three/addons/objects/MarchingCubes.js';

    const DEBUG = location.search.includes('debug');
    const dbgEl = document.getElementById('dbg');
    if (DEBUG) dbgEl.style.display = 'block';

    // ─────────────────────────────────────────────────────────────
    // TOKENS
    // ─────────────────────────────────────────────────────────────

    const T = {
      blob: {
        forward:    0.5,    // 시작 시 머리 정면 거리 m
        drop:       0.25,   // 눈높이에서 아래로 m
        fieldScale: 0.45,   // 마칭큐브 필드 큐브 반-크기 m (큐브 = ±0.45 = 0.9m)
        resolution: 32,     // 그리드 해상도 (Quest 예산상 ↑ 주의)
        isolation:  80,     // 등위면 임계값
        charges:    12,     // 메타볼 전하 수
        offsetR:    0.07,   // 전하 분포 반경 m (표면은 이보다 약간 큼)
        ballSubtract: 12,   // 메타볼 낙폭 (클수록 뭉침)
      },
      spring: {
        k:       0.20,   // 복원 강성
        kGrab:   0.45,   // 잡힌 전하가 손가락 따라가는 강성
        damping: 0.80,   // 출렁임 감쇠
      },
      grab: {
        capture: 0.065,  // 이 거리 안이면 전하를 잡음 m
        break:   0.28,   // 중심에서 이만큼 멀어지면 끊김(스냅) m
      },
      hand: { touchRadius: 0.02 },
      color: {
        base:     new THREE.Color(0x33ffaa),
        emissive: new THREE.Color(0x003322),
        opacity:  0.78,
      },
      droplet: {
        count:    96,
        perSnap:  14,
        sizePx:   7.0,
        speed:    0.7,    // 초기 분출 속도 m/s
        gravity:  1.1,    // 중력 m/s^2
        life:     0.9,    // 수명 s
      },
    };

    // ─────────────────────────────────────────────────────────────
    // SHADERS — 슬라임 표면 (프레넬 광택 + 접촉 글로우 + 반투명)
    // ─────────────────────────────────────────────────────────────

    const blobVert = /* glsl */`
      uniform vec3 uFingerWorld;
      varying vec3 vNormal;
      varying vec3 vView;
      varying float vGlow;
      void main() {
        vec4 wp  = modelMatrix * vec4(position, 1.0);
        vView    = normalize(cameraPosition - wp.xyz);
        vNormal  = normalize(mat3(modelMatrix) * normal);
        float d  = distance(wp.xyz, uFingerWorld);
        vGlow    = exp(-d * d * 220.0);       // 손끝 수 cm 안에서 밝아짐
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `;

    const blobFrag = /* glsl */`
      uniform vec3  uColor;
      uniform vec3  uEmissive;
      uniform float uOpacity;
      varying vec3  vNormal;
      varying vec3  vView;
      varying float vGlow;
      void main() {
        float NdotV  = max(dot(normalize(vNormal), normalize(vView)), 0.0);
        float fresnel = pow(1.0 - NdotV, 3.0);
        vec3 col  = uColor + uEmissive;
        col      += vec3(0.20, 0.45, 0.32) * vGlow;   // 만진 곳 밝게
        col      += vec3(0.9) * fresnel * 0.35;        // 가장자리 광택
        float alpha = uOpacity + fresnel * 0.20;
        gl_FragColor = vec4(col, alpha);
      }
    `;

    // ─────────────────────────────────────────────────────────────
    // SCENE
    // ─────────────────────────────────────────────────────────────

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.xr.enabled = true;
    document.body.appendChild(renderer.domElement);

    const scene  = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

    const ambient = new THREE.AmbientLight(0xffffff, 0.6);
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
    dirLight.position.set(1, 2, 1);
    scene.add(ambient, dirLight);

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ─────────────────────────────────────────────────────────────
    // BLOB — 마칭큐브 등위면 + 스프링 전하
    // ─────────────────────────────────────────────────────────────

    const blobMat = new THREE.ShaderMaterial({
      vertexShader:   blobVert,
      fragmentShader: blobFrag,
      transparent:    true,
      side:           THREE.DoubleSide,
      uniforms: {
        uFingerWorld: { value: new THREE.Vector3(9999, 9999, 9999) },
        uColor:       { value: T.color.base },
        uEmissive:    { value: T.color.emissive },
        uOpacity:     { value: T.color.opacity },
      },
    });

    const effect = new MarchingCubes(T.blob.resolution, blobMat, false, false, 120000);
    effect.isolation = T.blob.isolation;
    effect.scale.setScalar(T.blob.fieldScale);
    effect.visible = false;
    scene.add(effect);

    // 메타볼 세기 (공식 예제 휴리스틱)
    const ballStrength = 1.2 / ((Math.sqrt(T.blob.charges) - 1) / 4 + 1);

    // 전하: rest = 중심 기준 오프셋(월드), pos/vel = 현재 상태
    const center  = new THREE.Vector3();
    const charges = [];
    for (let i = 0; i < T.blob.charges; i++) {
      // 피보나치 구 분포로 고르게
      const phi   = Math.acos(1 - 2 * (i + 0.5) / T.blob.charges);
      const theta = Math.PI * (1 + Math.sqrt(5)) * i;
      const rest  = new THREE.Vector3(
        Math.sin(phi) * Math.cos(theta),
        Math.cos(phi),
        Math.sin(phi) * Math.sin(theta),
      ).multiplyScalar(T.blob.offsetR);
      charges.push({ rest, pos: new THREE.Vector3(), vel: new THREE.Vector3() });
    }
    let grabbed = -1;  // 현재 잡힌 전하 인덱스

    // ─────────────────────────────────────────────────────────────
    // DROPLETS — 스냅 시 위로 튀는 물방울 (flat px → 근거리 PointSize 안전)
    // ─────────────────────────────────────────────────────────────

    const dropGeo = new THREE.BufferGeometry();
    const dropPos  = new Float32Array(T.droplet.count * 3);
    const dropLife = new Float32Array(T.droplet.count);
    const dropVel  = new Float32Array(T.droplet.count * 3);
    dropGeo.setAttribute('position', new THREE.BufferAttribute(dropPos, 3));
    dropGeo.setAttribute('aLife', new THREE.BufferAttribute(dropLife, 1));

    const dropMat = new THREE.ShaderMaterial({
      transparent: true,
      depthWrite:  false,
      blending:    THREE.AdditiveBlending,
      uniforms: { uSize: { value: T.droplet.sizePx }, uColor: { value: T.color.base } },
      vertexShader: /* glsl */`
        attribute float aLife;
        uniform float uSize;
        varying float vLife;
        void main() {
          vLife = aLife;
          gl_PointSize = uSize * aLife;            // z감쇠 없음 = 근거리 폭발 방지
          gl_Position  = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: /* glsl */`
        uniform vec3 uColor;
        varying float vLife;
        void main() {
          vec2 uv = gl_PointCoord - 0.5;
          if (dot(uv, uv) > 0.25) discard;          // 둥근 점
          gl_FragColor = vec4(uColor + 0.3, vLife);
        }
      `,
    });
    const droplets = new THREE.Points(dropGeo, dropMat);
    droplets.frustumCulled = false;
    droplets.visible = false;
    scene.add(droplets);

    let dropCursor = 0;
    const _spawnDir = new THREE.Vector3();
    function spawnDroplets(at) {
      droplets.visible = true;
      for (let n = 0; n < T.droplet.perSnap; n++) {
        const i = dropCursor; dropCursor = (dropCursor + 1) % T.droplet.count;
        dropPos[i * 3]     = at.x;
        dropPos[i * 3 + 1] = at.y;
        dropPos[i * 3 + 2] = at.z;
        // 위 + 바깥으로 (패스스루 오클루전 규칙: 손 근처는 위로/퍼지게)
        _spawnDir.set((Math.random() - 0.5), Math.random() * 0.8 + 0.6, (Math.random() - 0.5)).normalize();
        const sp = T.droplet.speed * (0.6 + Math.random() * 0.6);
        dropVel[i * 3]     = _spawnDir.x * sp;
        dropVel[i * 3 + 1] = _spawnDir.y * sp;
        dropVel[i * 3 + 2] = _spawnDir.z * sp;
        dropLife[i] = 1.0;
      }
    }
    function updateDroplets(dt) {
      let alive = false;
      for (let i = 0; i < T.droplet.count; i++) {
        if (dropLife[i] <= 0) continue;
        alive = true;
        dropVel[i * 3 + 1] -= T.droplet.gravity * dt;
        dropPos[i * 3]     += dropVel[i * 3] * dt;
        dropPos[i * 3 + 1] += dropVel[i * 3 + 1] * dt;
        dropPos[i * 3 + 2] += dropVel[i * 3 + 2] * dt;
        dropLife[i] -= dt / T.droplet.life;
        if (dropLife[i] < 0) dropLife[i] = 0;
      }
      droplets.visible = alive;
      if (alive) {
        dropGeo.attributes.position.needsUpdate = true;
        dropGeo.attributes.aLife.needsUpdate = true;
      }
    }

    // ─────────────────────────────────────────────────────────────
    // PLACEMENT — 세션 첫 프레임에 눈높이·정면 배치
    // ─────────────────────────────────────────────────────────────

    let needsPlacement = false;
    const _headPos = new THREE.Vector3();
    const _headFwd = new THREE.Vector3();

    function placeBlob() {
      const xrCam = renderer.xr.getCamera();
      xrCam.getWorldPosition(_headPos);
      xrCam.getWorldDirection(_headFwd);
      _headFwd.y = 0;
      if (_headFwd.lengthSq() < 1e-6) _headFwd.set(0, 0, -1);
      _headFwd.normalize();

      center.copy(_headPos).addScaledVector(_headFwd, T.blob.forward);
      center.y = _headPos.y - T.blob.drop;
      effect.position.copy(center);

      for (const c of charges) {
        c.pos.copy(center).add(c.rest);
        c.vel.set(0, 0, 0);
      }
      grabbed = -1;
      effect.visible = true;
    }

    // ─────────────────────────────────────────────────────────────
    // HANDS  (scene에 추가해야 joint matrixWorld가 매 프레임 갱신됨)
    // ─────────────────────────────────────────────────────────────

    const hands = [renderer.xr.getHand(0), renderer.xr.getHand(1)];
    hands.forEach(h => scene.add(h));

    const _tipWorld   = new THREE.Vector3();
    const _fingerWorld = new THREE.Vector3();
    let   hasFinger = false;

    // 양손 손가락 끝 중 중심에 가장 가까운 것 → _fingerWorld, hasFinger
    function pickFinger() {
      let best = Infinity;
      hasFinger = false;
      for (const hand of hands) {
        const tip = hand?.joints?.['index-finger-tip'];
        if (!tip) continue;
        _tipWorld.setFromMatrixPosition(tip.matrixWorld);
        if (_tipWorld.lengthSq() < 1e-8) continue;   // 미갱신 joint(원점) 무시
        const d = _tipWorld.distanceTo(center);
        if (d < best) { best = d; _fingerWorld.copy(_tipWorld); hasFinger = true; }
      }
    }

    // ─────────────────────────────────────────────────────────────
    // SIM — 전하 스프링 + 잡기/끊기
    // ─────────────────────────────────────────────────────────────

    const _target = new THREE.Vector3();
    const _accel  = new THREE.Vector3();
    const _field  = new THREE.Vector3();

    function updateBlob() {
      pickFinger();

      // 잡기 획득
      if (grabbed < 0 && hasFinger) {
        let bi = -1, bd = T.grab.capture;
        for (let i = 0; i < charges.length; i++) {
          const d = charges[i].pos.distanceTo(_fingerWorld);
          if (d < bd) { bd = d; bi = i; }
        }
        grabbed = bi;
      }
      // 끊김 판정
      if (grabbed >= 0) {
        if (!hasFinger) {
          grabbed = -1;
        } else if (charges[grabbed].pos.distanceTo(center) > T.grab.break) {
          spawnDroplets(charges[grabbed].pos);
          grabbed = -1;
        }
      }

      // 적분 (프레임 스텝, 72fps 가정 — 기존 튜닝과 일관)
      for (let i = 0; i < charges.length; i++) {
        const c = charges[i];
        if (i === grabbed && hasFinger) {
          _target.copy(_fingerWorld);
          _accel.copy(_target).sub(c.pos).multiplyScalar(T.spring.kGrab);
        } else {
          _target.copy(center).add(c.rest);
          _accel.copy(_target).sub(c.pos).multiplyScalar(T.spring.k);
        }
        c.vel.add(_accel).multiplyScalar(T.spring.damping);
        c.pos.add(c.vel);
      }

      // 마칭큐브 필드 갱신
      effect.reset();
      const inv = 1 / (2 * T.blob.fieldScale);
      for (let i = 0; i < charges.length; i++) {
        _field.copy(charges[i].pos).sub(center).multiplyScalar(inv).addScalar(0.5);
        const fx = THREE.MathUtils.clamp(_field.x, 0.02, 0.98);
        const fy = THREE.MathUtils.clamp(_field.y, 0.02, 0.98);
        const fz = THREE.MathUtils.clamp(_field.z, 0.02, 0.98);
        effect.addBall(fx, fy, fz, ballStrength, T.blob.ballSubtract);
      }
      effect.update();

      // 셰이더 손끝 글로우
      blobMat.uniforms.uFingerWorld.value.copy(
        hasFinger ? _fingerWorld : { x: 9999, y: 9999, z: 9999 });

      if (DEBUG) {
        dbgEl.textContent =
          `finger: ${hasFinger ? 'yes' : 'no'}\n` +
          `grabbed: ${grabbed}\n` +
          (grabbed >= 0 ? `pull: ${charges[grabbed].pos.distanceTo(center).toFixed(3)}m / break ${T.grab.break}\n` : '');
      }
    }

    // ─────────────────────────────────────────────────────────────
    // XR SETUP
    // ─────────────────────────────────────────────────────────────

    const btnXR  = document.getElementById('btnXR');
    const errMsg = document.getElementById('errMsg');
    const overlay = document.getElementById('overlay');

    btnXR.addEventListener('click', async () => {
      if (!navigator.xr) {
        errMsg.textContent = 'WebXR를 지원하지 않는 기기입니다.';
        return;
      }
      const supported = await navigator.xr.isSessionSupported('immersive-ar').catch(() => false);
      if (!supported) {
        errMsg.textContent = 'immersive-ar 세션을 지원하지 않습니다.';
        return;
      }
      try {
        const session = await navigator.xr.requestSession('immersive-ar', {
          requiredFeatures: ['hand-tracking'],
          optionalFeatures: ['local-floor'],
        });
        renderer.xr.setSession(session);
        needsPlacement = true;
        overlay.classList.add('hidden');
      } catch (e) {
        errMsg.textContent = `세션 시작 실패: ${e.message}`;
      }
    });

    // ─────────────────────────────────────────────────────────────
    // RENDER LOOP
    // ─────────────────────────────────────────────────────────────

    const clock = new THREE.Clock();

    renderer.setAnimationLoop(() => {
      const dt = Math.min(clock.getDelta(), 0.05);

      if (needsPlacement && renderer.xr.isPresenting) {
        placeBlob();
        needsPlacement = false;
      }
      if (effect.visible) {
        updateBlob();
        updateDroplets(dt);
      }
      renderer.render(scene, camera);
    });

  </script>
</body>
</html>
