<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Malrang</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; }
    canvas { display: block; }

    #overlay {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(0, 8, 12, 0.92);
    }
    #overlay.hidden { display: none; }
    #overlay h1 {
      color: #88ffcc; font-size: 2.4rem;
      letter-spacing: 0.18em; font-weight: 300;
      margin-bottom: 0.6rem;
    }
    #overlay p {
      color: rgba(136, 255, 204, 0.5);
      font-size: 0.9rem; letter-spacing: 0.1em;
      margin-bottom: 3rem;
    }
    #btnXR {
      padding: 0.9rem 3rem; font-size: 1.05rem;
      background: transparent; color: #88ffcc;
      border: 1px solid rgba(136, 255, 204, 0.6);
      border-radius: 6px; cursor: pointer;
      letter-spacing: 0.12em;
      transition: background 0.25s, border-color 0.25s;
    }
    #btnXR:hover { background: rgba(136, 255, 204, 0.1); border-color: #88ffcc; }
    #errMsg {
      color: #ff8877; margin-top: 1.6rem;
      font-size: 0.82rem; text-align: center;
      max-width: 320px; line-height: 1.5;
    }
    #dbg {
      position: fixed; top: 0.8rem; left: 0.8rem; z-index: 20;
      color: #88ffcc; font-family: monospace; font-size: 0.72rem;
      line-height: 1.6; pointer-events: none;
      text-shadow: 0 0 6px #000; display: none;
    }
  </style>
</head>
<body>

  <div id="overlay">
    <h1>Malrang</h1>
    <p>말랑말랑한 무언가</p>
    <button id="btnXR">만져보기</button>
    <div id="errMsg"></div>
  </div>
  <div id="dbg"></div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.165.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.165.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { MarchingCubes } from 'three/addons/objects/MarchingCubes.js';

    const DEBUG = location.search.includes('debug');
    const dbgEl = document.getElementById('dbg');
    if (DEBUG) dbgEl.style.display = 'block';

    // ─────────────────────────────────────────────────────────────
    // TOKENS
    // ─────────────────────────────────────────────────────────────

    const T = {
      blob: {
        forward:    0.5,    // 시작 시 머리 정면 거리 m
        drop:       0.25,   // 눈높이에서 아래로 m
        resolution: 32,     // 마칭큐브 그리드 해상도
        isolation:  80,     // 등위면 임계값
        charges:    12,     // 메타볼 전하 수
        spawnR:     0.08,   // 초기 분포 반경 m
        ballSubtract: 10,   // 메타볼 낙폭 (작을수록 더 뭉침)
        fieldPad:   0.14,   // 필드 큐브 여유 m (표면이 잘리지 않게)
        fieldMin:   0.22,   // 필드 큐브 반-크기 하한 m
        fieldMax:   0.95,   // 상한 m
      },
      sim: {
        cohesion: 0.040,   // 클러스터 중심으로 모이는 힘
        repelR:   0.070,   // 반발 사거리 m (부피 유지)
        repel:    0.55,    // 반발 강성
        bondDist: 0.130,   // 이 거리 안이면 같은 덩어리(붙음), 넘으면 분리
        damping:  0.85,    // 출렁임 감쇠
      },
      grab: {
        capture: 0.060,    // 이 거리 안의 전하를 잡음 m
        kGrab:   0.40,     // 잡힌 전하가 손가락 따라가는 강성
      },
      color: {
        base:     new THREE.Color(0x33ffaa),
        emissive: new THREE.Color(0x003322),
        opacity:  0.78,
      },
    };

    // ─────────────────────────────────────────────────────────────
    // SHADER — 슬라임 표면 (프레넬 광택 + 양손 접촉 글로우 + 반투명)
    // ─────────────────────────────────────────────────────────────

    const blobVert = /* glsl */`
      uniform vec3 uFingers[2];
      uniform int  uFingerCount;
      varying vec3 vNormal;
      varying vec3 vView;
      varying float vGlow;
      void main() {
        vec4 wp  = modelMatrix * vec4(position, 1.0);
        vView    = normalize(cameraPosition - wp.xyz);
        vNormal  = normalize(mat3(modelMatrix) * normal);
        float g = 0.0;
        for (int k = 0; k < 2; k++) {
          if (k >= uFingerCount) break;
          float d = distance(wp.xyz, uFingers[k]);
          g = max(g, exp(-d * d * 220.0));         // 손끝 수 cm 안에서 밝아짐
        }
        vGlow = g;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `;

    const blobFrag = /* glsl */`
      uniform vec3  uColor;
      uniform vec3  uEmissive;
      uniform float uOpacity;
      varying vec3  vNormal;
      varying vec3  vView;
      varying float vGlow;
      void main() {
        float NdotV  = max(dot(normalize(vNormal), normalize(vView)), 0.0);
        float fresnel = pow(1.0 - NdotV, 3.0);
        vec3 col  = uColor + uEmissive;
        col      += vec3(0.20, 0.45, 0.32) * vGlow;   // 만진 곳 밝게
        col      += vec3(0.9) * fresnel * 0.35;        // 가장자리 광택
        float alpha = uOpacity + fresnel * 0.20;
        gl_FragColor = vec4(col, alpha);
      }
    `;

    // ─────────────────────────────────────────────────────────────
    // SCENE
    // ─────────────────────────────────────────────────────────────

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.xr.enabled = true;
    document.body.appendChild(renderer.domElement);

    const scene  = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

    const ambient = new THREE.AmbientLight(0xffffff, 0.6);
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
    dirLight.position.set(1, 2, 1);
    scene.add(ambient, dirLight);

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ─────────────────────────────────────────────────────────────
    // BLOB — 마칭큐브 등위면 + 자유 전하 (중심 없음)
    // ─────────────────────────────────────────────────────────────

    const blobMat = new THREE.ShaderMaterial({
      vertexShader:   blobVert,
      fragmentShader: blobFrag,
      transparent:    true,
      side:           THREE.DoubleSide,
      uniforms: {
        uFingers:     { value: [new THREE.Vector3(9999, 9999, 9999),
                                new THREE.Vector3(9999, 9999, 9999)] },
        uFingerCount: { value: 0 },
        uColor:       { value: T.color.base },
        uEmissive:    { value: T.color.emissive },
        uOpacity:     { value: T.color.opacity },
      },
    });

    const effect = new MarchingCubes(T.blob.resolution, blobMat, false, false, 120000);
    effect.isolation = T.blob.isolation;
    effect.visible = false;
    scene.add(effect);

    const ballStrength = 1.2 / ((Math.sqrt(T.blob.charges) - 1) / 4 + 1);

    // ─────────────────────────────────────────────────────────────
    // MATERIALS — 손맛 스파이크: 탄성 ↔ 소성 두 극단만 (B단계)
    //   cohesion: 형상 기억(높음=탄성 복원 / ≈0=소성, 자국이 남음)
    //   damping : 생기(높음=출렁/스냅백 / 낮음=죽은 듯 무복원)
    //   color는 어느 재질인지 알려주는 *테스터용 임시 틴트*. C단계에서
    //   재질별 외형(광택·투명도·질감)으로 대체 — 손맛은 외형이 아니라 역학에 있음.
    // ─────────────────────────────────────────────────────────────

    const MATERIALS = [
      { // 0 — 탄성 극단: 팽팽하고 즉시 스냅백
        name: 'Water Balloon',
        cohesion: 0.075, repelR: 0.075, repel: 0.62, bondDist: 0.135, damping: 0.90,
        color: new THREE.Color(0x55ddff),
      },
      { // 1 — 소성 극단: 누른 자국이 남고, 죽은 듯 복원이 없음
        name: 'Putty',
        cohesion: 0.0018, repelR: 0.070, repel: 0.45, bondDist: 0.160, damping: 0.55,
        color: new THREE.Color(0xd9c8a0),
      },
    ];
    let activeMat = 0;

    function applyMaterial(i) {
      activeMat = (i % MATERIALS.length + MATERIALS.length) % MATERIALS.length;
      const m = MATERIALS[activeMat];
      T.sim.cohesion = m.cohesion;
      T.sim.repelR   = m.repelR;
      T.sim.repel    = m.repel;
      T.sim.bondDist = m.bondDist;
      T.sim.damping  = m.damping;
      blobMat.uniforms.uColor.value.copy(m.color);
    }

    // 전하: 중심 없이 자유롭게 떠다님. cohesion으로 덩어리 유지.
    const N = T.blob.charges;
    const charges = [];
    for (let i = 0; i < N; i++) {
      charges.push({ pos: new THREE.Vector3(), vel: new THREE.Vector3() });
    }
    const force    = Array.from({ length: N }, () => new THREE.Vector3());
    const parent   = new Int32Array(N);            // union-find
    const cenSum   = Array.from({ length: N }, () => new THREE.Vector3());
    const cenCount = new Int32Array(N);

    // ─────────────────────────────────────────────────────────────
    // PLACEMENT — 세션 첫 프레임에 눈높이·정면 배치
    // ─────────────────────────────────────────────────────────────

    let needsPlacement = false;
    const _headPos = new THREE.Vector3();
    const _headFwd = new THREE.Vector3();
    const _spawn   = new THREE.Vector3();

    function placeBlob() {
      const xrCam = renderer.xr.getCamera();
      xrCam.getWorldPosition(_headPos);
      xrCam.getWorldDirection(_headFwd);
      _headFwd.y = 0;
      if (_headFwd.lengthSq() < 1e-6) _headFwd.set(0, 0, -1);
      _headFwd.normalize();

      _spawn.copy(_headPos).addScaledVector(_headFwd, T.blob.forward);
      _spawn.y = _headPos.y - T.blob.drop;

      for (let i = 0; i < N; i++) {
        const phi   = Math.acos(1 - 2 * (i + 0.5) / N);
        const theta = Math.PI * (1 + Math.sqrt(5)) * i;
        charges[i].pos.set(
          Math.sin(phi) * Math.cos(theta),
          Math.cos(phi),
          Math.sin(phi) * Math.sin(theta),
        ).multiplyScalar(T.blob.spawnR * (0.5 + Math.random() * 0.5)).add(_spawn);
        charges[i].vel.set(0, 0, 0);
      }
      grab[0] = grab[1] = -1;
      applyMaterial(0);
      effect.visible = true;
    }

    // ─────────────────────────────────────────────────────────────
    // HANDS  (scene에 추가해야 joint matrixWorld가 매 프레임 갱신됨)
    // ─────────────────────────────────────────────────────────────

    const hands = [renderer.xr.getHand(0), renderer.xr.getHand(1)];
    hands.forEach(h => scene.add(h));

    const fingers = [
      { pos: new THREE.Vector3(), has: false },
      { pos: new THREE.Vector3(), has: false },
    ];
    const grab = [-1, -1];   // 손별로 잡은 전하 인덱스

    // 핀치(엄지+검지)로 재질 순환 — 슬라임에서 떨어진 허공에서 의도적으로
    const pinchOn = [false, false];
    let   pinchCooldown = 0;
    const _thumb = new THREE.Vector3();

    function readFingers() {
      for (let h = 0; h < 2; h++) {
        const tip = hands[h]?.joints?.['index-finger-tip'];
        fingers[h].has = false;
        if (!tip) continue;
        fingers[h].pos.setFromMatrixPosition(tip.matrixWorld);
        if (fingers[h].pos.lengthSq() < 1e-8) continue;   // 미갱신 joint(원점) 무시
        fingers[h].has = true;
      }
    }

    // ─────────────────────────────────────────────────────────────
    // UNION-FIND (근접 클러스터링)
    // ─────────────────────────────────────────────────────────────

    function find(x) { while (parent[x] !== x) { parent[x] = parent[parent[x]]; x = parent[x]; } return x; }
    function union(a, b) { parent[find(a)] = find(b); }

    // ─────────────────────────────────────────────────────────────
    // SIM
    // ─────────────────────────────────────────────────────────────

    const _d   = new THREE.Vector3();
    const _acc = new THREE.Vector3();
    const _min = new THREE.Vector3();
    const _max = new THREE.Vector3();
    const _f   = new THREE.Vector3();

    function updateBlob() {
      readFingers();

      // ── 핀치로 재질 순환: 슬라임에서 떨어진 허공에서 엄지+검지를 붙임
      //    (잡는 중이거나 슬라임 근처면 무시 → 인터랙션과 충돌 방지)
      pinchCooldown = Math.max(0, pinchCooldown - 1);
      for (let h = 0; h < 2; h++) {
        const tipT = hands[h]?.joints?.['thumb-tip'];
        let isPinch = false;
        if (tipT && fingers[h].has) {
          _thumb.setFromMatrixPosition(tipT.matrixWorld);
          if (_thumb.lengthSq() > 1e-8) {
            const pinchClose = fingers[h].pos.distanceTo(_thumb) < 0.022;
            const farFromBlob = fingers[h].pos.distanceTo(effect.position) > 0.25;
            isPinch = pinchClose && farFromBlob && grab[h] < 0;
          }
        }
        if (isPinch && !pinchOn[h] && pinchCooldown === 0) {
          applyMaterial(activeMat + 1);
          pinchCooldown = 45;   // ~0.6s @72fps 디바운스
        }
        pinchOn[h] = isPinch;
      }

      // ── 잡기 획득/해제 (손별 독립)
      for (let h = 0; h < 2; h++) {
        if (grab[h] >= 0 && !fingers[h].has) grab[h] = -1;            // 손 사라짐 → 놓기
        if (grab[h] < 0 && fingers[h].has) {
          let bi = -1, bd = T.grab.capture;
          for (let i = 0; i < N; i++) {
            if (i === grab[1 - h]) continue;                          // 다른 손이 잡은 건 제외
            const dd = charges[i].pos.distanceTo(fingers[h].pos);
            if (dd < bd) { bd = dd; bi = i; }
          }
          grab[h] = bi;
        }
      }

      // ── 근접 클러스터링: bondDist 안이면 같은 덩어리
      for (let i = 0; i < N; i++) parent[i] = i;
      const bond2 = T.sim.bondDist * T.sim.bondDist;
      for (let i = 0; i < N; i++)
        for (let j = i + 1; j < N; j++)
          if (charges[i].pos.distanceToSquared(charges[j].pos) < bond2) union(i, j);

      // ── 클러스터 중심 계산
      for (let i = 0; i < N; i++) { cenSum[i].set(0, 0, 0); cenCount[i] = 0; }
      for (let i = 0; i < N; i++) { const r = find(i); cenSum[r].add(charges[i].pos); cenCount[r]++; }

      // ── 힘 누적: cohesion(중심으로) + repulsion(부피 유지)
      for (let i = 0; i < N; i++) force[i].set(0, 0, 0);
      for (let i = 0; i < N; i++) {
        const r = find(i);
        _acc.copy(cenSum[r]).divideScalar(cenCount[r]).sub(charges[i].pos);
        force[i].addScaledVector(_acc, T.sim.cohesion);
      }
      const repelR2 = T.sim.repelR * T.sim.repelR;
      for (let i = 0; i < N; i++) {
        for (let j = i + 1; j < N; j++) {
          const dsq = charges[i].pos.distanceToSquared(charges[j].pos);
          if (dsq >= repelR2 || dsq < 1e-8) continue;
          const dist = Math.sqrt(dsq);
          _d.copy(charges[i].pos).sub(charges[j].pos).multiplyScalar(1 / dist);
          const mag = (T.sim.repelR - dist) * T.sim.repel;
          force[i].addScaledVector(_d, mag);
          force[j].addScaledVector(_d, -mag);
        }
      }

      // ── 적분 (잡힌 전하는 손가락 스프링으로 오버라이드)
      let grabbedBy = -1;
      for (let i = 0; i < N; i++) {
        const c = charges[i];
        grabbedBy = (i === grab[0]) ? 0 : (i === grab[1]) ? 1 : -1;
        if (grabbedBy >= 0) {
          _acc.copy(fingers[grabbedBy].pos).sub(c.pos).multiplyScalar(T.grab.kGrab);
          c.vel.add(_acc).multiplyScalar(T.sim.damping);
        } else {
          c.vel.add(force[i]).multiplyScalar(T.sim.damping);
        }
        c.pos.add(c.vel);
      }

      // ── 필드 큐브를 전하들에 맞춰 재배치/스케일 (밖으로 안 잘리게)
      _min.copy(charges[0].pos); _max.copy(charges[0].pos);
      for (let i = 1; i < N; i++) { _min.min(charges[i].pos); _max.max(charges[i].pos); }
      const cx = (_min.x + _max.x) * 0.5, cy = (_min.y + _max.y) * 0.5, cz = (_min.z + _max.z) * 0.5;
      let half = Math.max(_max.x - _min.x, _max.y - _min.y, _max.z - _min.z) * 0.5 + T.blob.fieldPad;
      half = THREE.MathUtils.clamp(half, T.blob.fieldMin, T.blob.fieldMax);
      effect.position.set(cx, cy, cz);
      effect.scale.setScalar(half);

      // ── 메타볼 필드 갱신
      effect.reset();
      const inv = 1 / (2 * half);
      for (let i = 0; i < N; i++) {
        _f.set(
          (charges[i].pos.x - cx) * inv + 0.5,
          (charges[i].pos.y - cy) * inv + 0.5,
          (charges[i].pos.z - cz) * inv + 0.5,
        );
        effect.addBall(
          THREE.MathUtils.clamp(_f.x, 0.02, 0.98),
          THREE.MathUtils.clamp(_f.y, 0.02, 0.98),
          THREE.MathUtils.clamp(_f.z, 0.02, 0.98),
          ballStrength, T.blob.ballSubtract);
      }
      effect.update();

      // ── 셰이더 손끝 글로우
      let fc = 0;
      for (let h = 0; h < 2; h++) if (fingers[h].has) blobMat.uniforms.uFingers.value[fc++].copy(fingers[h].pos);
      blobMat.uniforms.uFingerCount.value = fc;

      if (DEBUG) {
        let clusters = 0;
        for (let i = 0; i < N; i++) if (find(i) === i) clusters++;
        dbgEl.textContent =
          `material: ${MATERIALS[activeMat].name}  (핀치로 전환)\n` +
          `fingers: ${fingers[0].has ? 'L' : '-'}${fingers[1].has ? 'R' : '-'}\n` +
          `grab: ${grab[0]} / ${grab[1]}\n` +
          `clusters(덩어리): ${clusters}\n` +
          `field half: ${half.toFixed(3)}m`;
      }
    }

    // ─────────────────────────────────────────────────────────────
    // XR SETUP
    // ─────────────────────────────────────────────────────────────

    const btnXR  = document.getElementById('btnXR');
    const errMsg = document.getElementById('errMsg');
    const overlay = document.getElementById('overlay');

    btnXR.addEventListener('click', async () => {
      if (!navigator.xr) {
        errMsg.textContent = 'WebXR를 지원하지 않는 기기입니다.';
        return;
      }
      const supported = await navigator.xr.isSessionSupported('immersive-ar').catch(() => false);
      if (!supported) {
        errMsg.textContent = 'immersive-ar 세션을 지원하지 않습니다.';
        return;
      }
      try {
        const session = await navigator.xr.requestSession('immersive-ar', {
          requiredFeatures: ['hand-tracking'],
          optionalFeatures: ['local-floor'],
        });
        renderer.xr.setSession(session);
        needsPlacement = true;
        overlay.classList.add('hidden');
      } catch (e) {
        errMsg.textContent = `세션 시작 실패: ${e.message}`;
      }
    });

    // ─────────────────────────────────────────────────────────────
    // RENDER LOOP
    // ─────────────────────────────────────────────────────────────

    renderer.setAnimationLoop(() => {
      if (needsPlacement && renderer.xr.isPresenting) {
        placeBlob();
        needsPlacement = false;
      }
      if (effect.visible) updateBlob();
      renderer.render(scene, camera);
    });

  </script>
</body>
</html>
