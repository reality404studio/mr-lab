name: Deploy 07 MalrangCat → Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-07-malrangcat.yml"
      - "projects/07.MalrangCat/**"
  workflow_dispatch:   # 수동 실행도 가능

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy projects/07.MalrangCat --project-name=malrangcat --commit-dirty=true
